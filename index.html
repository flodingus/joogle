<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle</title>

<link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text y='.9em' font-size='90'>💙</text>
</svg>">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#202124;
  transition:background 0.6s ease;
}

.header{
  padding:15px 24px;
  border-bottom:1px solid #dadce0;
}

.logo{
  font-size:26px;
  font-weight:bold;
  letter-spacing:-2px;
  cursor:pointer;
}

.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.hero{
  height:60vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.heroLogo{
  font-size:100px;
  font-weight:bold;
  letter-spacing:-8px;
}

.heroLogo span:nth-child(1){color:#4285F4}
.heroLogo span:nth-child(2){color:#DB4437}
.heroLogo span:nth-child(3){color:#F4B400}
.heroLogo span:nth-child(4){color:#4285F4}
.heroLogo span:nth-child(5){color:#0F9D58}
.heroLogo span:nth-child(6){color:#DB4437}

.bounce{
  display:inline-block;
  animation:premiumBounce 2.4s infinite cubic-bezier(.28,.84,.42,1);
}

@keyframes premiumBounce{
  0%,100%{transform:translateY(0) scaleX(1) scaleY(1);}
  25%{transform:translateY(-10px) scaleX(1.02) scaleY(.98);}
  40%{transform:translateY(0) scaleX(.96) scaleY(1.05);}
  55%{transform:translateY(-4px) scaleX(1.01) scaleY(.99);}
  70%{transform:translateY(0);}
}

.searchArea{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.searchInput{
  width:420px;
  max-width:90vw;
  padding:12px 18px;
  border-radius:24px;
  border:1px solid #dadce0;
  font-size:16px;
}

.button{
  padding:10px 16px;
  border-radius:20px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  cursor:pointer;
}

.results{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

.card{
  background:#f8f9fa;
  padding:24px;
  border-radius:14px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.error{
  background:#ffecec;
  color:#900;
}

.resultItem{
  margin-bottom:24px;
}

.resultItem h3{
  margin:0;
  color:#1a0dab;
}

footer{
  text-align:center;
  font-size:12px;
  color:gray;
  padding:30px;
  opacity:.6;
}

/* JULIE MODE */

.loveScreen{
  height:70vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#fdfbfb,#ebedee);
  animation:fadeIn 1.5s ease;
}

.loveCard{
  background:white;
  padding:50px;
  border-radius:20px;
  box-shadow:0 10px 40px rgba(0,0,0,0.15);
  text-align:center;
  max-width:500px;
}

.loveCard h1{
  font-size:40px;
}

.loveText{
  font-size:20px;
  margin:25px 0;
}

.signature{
  margin-top:30px;
  opacity:.6;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(20px);}
  to{opacity:1;transform:translateY(0);}
}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.reload()">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
</div>

<div id="hero" class="hero">
  <div class="heroLogo">
    <span>J</span>
    <span class="bounce">o</span>
    <span class="bounce">o</span>
    <span>g</span>
    <span>l</span>
    <span>e</span>
  </div>

  <form id="searchForm" class="searchArea">
    <input id="searchBox" class="searchInput" placeholder="Search Joogle..." />
    <button class="button" type="submit">Joogle Search</button>
    <button class="button" type="button" onclick="feelingJoogly()">I'm Feeling Joogly</button>
  </form>
</div>

<div id="main" class="results"></div>

<footer>
Joogle is a private parody made with love and is not affiliated with Google LLC.
</footer>

<script>

const PROXY_URL="https://joogle-proxy.flodingus.workers.dev";

function timeoutFetch(resource, options = {}, timeout = 8000) {
  return Promise.race([
    fetch(resource, options),
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error("Timeout")), timeout)
    )
  ]);
}

document.getElementById("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  performSearch(searchBox.value.trim());
});

function feelingJoogly(){
  const val=searchBox.value.trim();
  if(val) window.open("https://www.google.com/search?q="+encodeURIComponent(val));
}

async function performSearch(query){
  if(!query) return;

  const q=query.toLowerCase();

  /* JULIE EASTER EGG */

  if(q.includes("julie")){

    const notes=[
      "You are my favorite thing to Joogle.",
      "If loving you was a search, I'd never hit enter.",
      "You are my homepage.",
      "I don't need Google when I have you.",
      "You are my favorite result.",
      "Every search ends with you."
    ];

    const randomNote=notes[Math.floor(Math.random()*notes.length)];

    hero.style.display="none";

    main.innerHTML=`
      <div class="loveScreen">
        <div class="loveCard">
          <h1>💙 Julie 💙</h1>
          <p class="loveText">${randomNote}</p>
          <div class="signature">— Love, always.</div>
        </div>
        <audio autoplay loop>
          <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b63c9b2a.mp3?filename=romantic-piano-110624.mp3" type="audio/mpeg">
        </audio>
      </div>
    `;
    return;
  }

  hero.style.display="none";
  main.innerHTML="<div class='card'>Loading...</div>";

  try{
    const res=await timeoutFetch(PROXY_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({q:query})
    });

    const data=await res.json();
    let html="";
    if(data.organic){
      data.organic.forEach(r=>{
        html+=`
          <div class="resultItem">
            <a href="${r.link}" target="_blank">
              <h3>${r.title}</h3>
            </a>
            <p>${r.snippet}</p>
          </div>
        `;
      });
    }
    main.innerHTML=html || "<div class='card'>No results.</div>";
  }catch(err){
    main.innerHTML="<div class='card error'>Search failed.</div>";
  }
}

</script>

</body>
</html>
