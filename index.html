function drawSpeechBubble(ctx,text,tx,ty,alpha){
  if(alpha<=0) return;
  ctx.save(); ctx.globalAlpha=alpha;
  ctx.fillStyle='#fff';
  const tw=ctx.measureText(text).width+24;
  const bx=tx-tw/2, by=ty-46, bh=34;
  ctx.beginPath();
  if(ctx.roundRect) ctx.roundRect(bx,by,tw,bh,8); else ctx.rect(bx,by,tw,bh);
  ctx.fill(); ctx.strokeStyle=C.outline; ctx.lineWidth=2; ctx.stroke();
  // Tail
  ctx.beginPath(); ctx.moveTo(tx-8,by+bh); ctx.lineTo(tx,ty); ctx.lineTo(tx+8,by+bh); ctx.fill();
  ctx.fillStyle='#333'; ctx.font='bold 13px Arial'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(text,tx,by+bh/2);
  ctx.restore();
}

function drawPopWord(ctx,word,cx,cy,t,color=C.pink){
  ctx.save(); ctx.translate(cx,cy);
  ctx.rotate(Math.sin(t*7)*0.1);
  const sc=0.85+Math.sin(t*8)*0.07;
  ctx.scale(sc,sc);
  ctx.font='bold 28px "Arial Black",Impact,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.strokeStyle=C.outline; ctx.lineWidth=6; ctx.strokeText(word,0,0);
  ctx.fillStyle=color; ctx.fillText(word,0,0);
  ctx.restore();
}

function drawConfetti(ctx,t){
  const cc=['#FF3366','#FFD700','#00FFFF','#FF69B4','#7FFF00','#FF6E40'];
  for(let i=0;i<18;i++){
    const rx=((i*73.1)%1)*CW;
    const ry=((((i*37.7)%1)+t*0.9*((i*13.3)%1+0.4))%1)*(CH-62);
    ctx.save(); ctx.translate(rx,ry); ctx.rotate(t*2.5+i*0.7);
    ctx.fillStyle=cc[i%cc.length]; ctx.fillRect(-3,-5,6,10); ctx.restore();
  }
}

function drawVHSOverlay(ctx,W,H,t,fn){
  // Scanlines
  ctx.save(); ctx.globalAlpha=0.09;
  for(let y=0;y<H;y+=3){ ctx.fillStyle='#000'; ctx.fillRect(0,y,W,1); }
  ctx.globalAlpha=1;
  // Timestamp
  const mm=Math.floor(fn/60/60)%60, ss=Math.floor(fn/60)%60;
  ctx.font=`${Math.round(H*0.042)}px monospace`;
  ctx.fillStyle='rgba(255,255,80,0.88)';
  ctx.fillText(`SP  ${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`,10,H*0.062);
  // REC dot
  if(Math.floor(fn/8)%2===0){
    ctx.fillStyle='#CC0000'; ctx.beginPath(); ctx.arc(W-42,H*0.052,7,0,Math.PI*2); ctx.fill();
    ctx.fillStyle='#FF4444'; ctx.fillText('REC',W-30,H*0.062);
  }
  // Occasional glitch line
  if(Math.sin(t*8.7)>0.96){
    ctx.globalAlpha=0.55; ctx.fillStyle='#fff';
    ctx.fillRect(Math.random()*W*0.5,Math.random()*H,Math.random()*100+20,2);
  }
  ctx.globalAlpha=1; ctx.restore();
}

// ─────────────────────────────────────
// MAIN RENDERER
// ─────────────────────────────────────
let _cFn=0;

function renderCartoonFrame(ctx,W,H,t){
  _cFn++;
  ctx.save(); ctx.scale(W/CW,H/CH);

  const lp=t%LOOP_DUR;

  let scene='title', sT=0;
  if(lp<1.0)           {scene='static';  sT=lp/1.0;}
  else if(lp<2.0)      {scene='bars';    sT=(lp-1.0)/1.0;}
  else if(lp<5.5)      {scene='title';   sT=(lp-2.0)/3.5;}
  else if(lp<10.2)     {scene='walkIn';  sT=(lp-5.5)/4.7;}
  else if(lp<15.5)     {scene='salon';   sT=(lp-10.2)/5.3;}
  else if(lp<20.5)     {scene='outdoor'; sT=(lp-15.5)/5.0;}
  else if(lp<24.0)     {scene='dance';   sT=(lp-20.5)/3.5;}
  else                 {scene='freeze';  sT=(lp-24.0)/2.0;}

  // ── Transitions in/out fade ──
  const sceneLen={static:1.0,bars:1.0,title:3.5,walkIn:4.7,salon:5.3,outdoor:5.0,dance:3.5,freeze:2.0};
  const len=sceneLen[scene]||3;
  const fadeIn=sT<0.12?sT/0.12:1;
  const fadeOut=sT>0.88?(1-sT)/0.12:1;
  const sceneAlpha=Math.min(fadeIn,fadeOut);

  if(scene==='static'){
    // TV noise
    for(let y=0;y<CH;y+=2) for(let x=0;x<CW;x+=2){
      const v=Math.random()*255|0; ctx.fillStyle=`rgb(${v},${v},${v})`; ctx.fillRect(x,y,2,2);
    }
    ctx.fillStyle='rgba(255,255,80,0.8)'; ctx.font='12px monospace'; ctx.fillText('SP  0:00:00',8,18); ctx.fillText('CH03',8,34);
  }
  else if(scene==='bars'){
    const cols=['#fff','#ff0','#0ff','#0f0','#f0f','#f00','#00f','#111'];
    cols.forEach((c,i)=>{ ctx.fillStyle=c; ctx.fillRect(i*CW/8,0,CW/8,CH); });
    ctx.fillStyle='#000'; ctx.fillRect(0,CH*0.75,CW,CH*0.25);
    ctx.fillStyle='#fff'; ctx.font='bold 18px Arial'; ctx.textAlign='center';
    ctx.fillText('● PLEASE STAND BY ●',CW/2,CH*0.48);
    ctx.font='12px Arial'; ctx.fillText('A JOOGLE ORIGINAL PRODUCTION',CW/2,CH*0.58);
    ctx.textAlign='left';
  }
  else if(scene==='title'){
    bgPurpleStars(ctx,lp);
    // Character peeks from bottom mid-way
    if(sT>0.45){
      const pk=eout(Math.min(1,(sT-0.45)/0.4));
      const py=CH+10-pk*155;
      drawHair(ctx,CW/2,py,Math.sin(lp*2)*5);
      drawHead(ctx,CW/2,py,lp,'happy',0,Math.sin(lp*1.5)*0.06);
    }
    drawTitleSplash(ctx,sT,1.0);
  }
  else if(scene==='walkIn'){
    bgLivingRoom(ctx,lp);
    // Walk from right, stop at center
    const arrived=sT>0.55;
    const wx=arrived
      ? lerp(CW+80,CW/2-8,(sT-0.55)/0.2)
      : CW+80-sT/0.55*(CW+80-CW/2-8+CW*0.35);
    const charX=arrived?CW/2-8:wx;
    // Speed lines while moving
    if(!arrived){
      ctx.save(); ctx.globalAlpha=0.25;
      for(let sl=0;sl<8;sl++){
        ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.moveTo(charX+60+sl*18,CH/2-60+sl*12); ctx.lineTo(charX+120+sl*18,CH/2-60+sl*12); ctx.stroke();
      }
      ctx.restore();
    }
    drawCharacter(ctx,charX,CH-22,lp,'walkIn',sT);
    if(sT>0.7) drawSpeechBubble(ctx,'Hi there! 👋',charX,CH-170,sm(0.7,0.8,sT));
    if(sT>0.62) drawNameplate(ctx,'Julie','WORLD\'S BEST HUMAN ⭐',sm(0.62,0.75,sT));
  }
  else if(scene==='salon'){
    bgSalon(ctx,lp);
    drawDryer(ctx,lp);
    drawCharacter(ctx,CW/2,CH-22,lp,'salon',sT);
    // Captions
    if(sT>0.18&&sT<0.52) drawNameplate(ctx,'Julie','GETTING GLAM... ALLEGEDLY',sm(0.18,0.28,sT)*sm(0.52,0.42,1-sT+0.52-0.42));
    if(sT>0.55&&sT<0.9){
      const ca=sm(0.55,0.65,sT)*(1-sm(0.82,0.9,sT));
      drawNameplate(ctx,'Julie','"is it hot in here or just me?"',ca);
      if(ca>0.5) drawPopWord(ctx,'OOPS!',CW*0.78,CH*0.28,lp,'#FF3366');
    }
  }
  else if(scene==='outdoor'){
    bgOutdoor(ctx,lp);
    drawCharacter(ctx,CW/2,CH-22,lp,'outdoor',sT);
    if(sT>0.18&&sT<0.52) drawNameplate(ctx,'Julie','LIVING HER BEST LIFE ☀️',sm(0.18,0.28,sT));
    if(sT>0.58&&sT<0.9){
      const ca=sm(0.58,0.68,sT)*(1-sm(0.82,0.9,sT));
      drawNameplate(ctx,'Julie','"her smile could end wars. probably has."',ca);
      if(ca>0.5) drawPopWord(ctx,'FABULOUS!',CW*0.78,CH*0.3,lp,C.gold);
    }
  }
  else if(scene==='dance'){
    bgDanceStage(ctx,lp);
    drawConfetti(ctx,lp);
    // Music notes
    ctx.font='22px Arial'; ctx.fillStyle=C.gold;
    ctx.fillText('♪',CW*0.18+Math.sin(lp*2.5)*12,(CH*0.32-(lp*0.6%1)*35));
    ctx.fillText('♫',CW*0.78+Math.cos(lp*2)*12,(CH*0.26-(lp*0.45%1)*35));
    drawCharacter(ctx,CW/2,CH-22,lp,'dance',sT);
    if(sT>0.25) drawNameplate(ctx,'Julie','★  STAR OF THE SHOW  ★',sm(0.25,0.4,sT));
  }
  else if(scene==='freeze'){
    bgPurpleStars(ctx,lp);
    // Radiating lines
    ctx.save(); ctx.globalAlpha=0.35;
    for(let i=0;i<18;i++){
      const a=(i/18)*Math.PI*2; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(CW/2+Math.cos(a)*75,CH/2+Math.sin(a)*75); ctx.lineTo(CW/2+Math.cos(a)*180,CH/2+Math.sin(a)*180); ctx.stroke();
    }
    ctx.restore();
    drawCharacter(ctx,CW/2,CH-22,lp,'freeze',sT);
    // White flash at start
    if(sT<0.25){ ctx.save(); ctx.globalAlpha=(1-sT/0.25)*0.7; ctx.fillStyle='#fff'; ctx.fillRect(0,0,CW,CH); ctx.restore(); }
    // Title
    const ta=sm(0.2,0.38,sT);
    if(ta>0){
      ctx.save(); ctx.globalAlpha=ta;
      ctx.textAlign='center';
      ctx.font='bold 38px "Arial Black",Impact,sans-serif';
      ctx.strokeStyle=C.outline; ctx.lineWidth=7; ctx.strokeText('★  JULIE  ★',CW/2,54);
      ctx.fillStyle=C.pink; ctx.fillText('★  JULIE  ★',CW/2,54);
      ctx.font='bold 20px Arial'; ctx.strokeStyle=C.outline; ctx.lineWidth=4;
      ctx.strokeText('SEASON 1',CW/2,80); ctx.fillStyle=C.gold; ctx.fillText('SEASON 1',CW/2,80);
      ctx.restore();
    }
    drawNameplate(ctx,'Julie','STARRING AS HERSELF',sm(0.35,0.52,sT));
    // Fade to black
    if(sT>0.75){ ctx.fillStyle=`rgba(0,0,0,${sm(0.75,1.0,sT)})`; ctx.fillRect(0,0,CW,CH); }
  }

  ctx.restore();
  drawVHSOverlay(ctx,W,H,lp,_cFn);
}


/* ══════════════════════════════════════════
   JULIE — SYNTH THEME (Web Audio)
══════════════════════════════════════════ */
let _julieAudioCtx = null;

function stopJulieTheme(){
  if(_julieAudioCtx){ try{ _julieAudioCtx.close(); }catch(e){} _julieAudioCtx=null; }
}

function playJulieTheme(){
  stopJulieTheme();
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    _julieAudioCtx = ctx;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value=-18; comp.ratio.value=4; comp.connect(ctx.destination);
    const master = ctx.createGain(); master.gain.value=0.5; master.connect(comp);

    function makeReverb(dur,dec){
      const len=ctx.sampleRate*dur, buf=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec*8);}
      const cv=ctx.createConvolver(); cv.buffer=buf; return cv;
    }
    const reverb=makeReverb(1.6,0.4);
    reverb.connect(master);
    const dry=ctx.createGain(); dry.gain.value=0.68; dry.connect(master);
    const wet=ctx.createGain(); wet.gain.value=0.32; wet.connect(master);

    const BPM=128, b=60/BPM, now=ctx.currentTime+0.05;

    function note(freq,startBeat,durBeats,wave,amp,dest){
      const s=now+startBeat*b, e=s+durBeats*b*0.85;
      if(e>now+30) return;
      const osc=ctx.createOscillator(), g=ctx.createGain();
      osc.type=wave; osc.frequency.value=freq;
      const vib=ctx.createOscillator(), vg=ctx.createGain();
      vib.frequency.value=5.5; vg.gain.value=freq*0.011;
      vib.connect(vg); vg.connect(osc.frequency); vib.start(s); vib.stop(e+0.1);
      g.gain.setValueAtTime(0,s);
      g.gain.linearRampToValueAtTime(amp,s+0.02);
      g.gain.setValueAtTime(amp*0.75,s+0.1);
      g.gain.exponentialRampToValueAtTime(0.001,e);
      osc.connect(g); g.connect(dest); osc.start(s); osc.stop(e+0.05);
    }

    // Melody (square lead)
    const ML=[
      [880,0,2],[659,2,1],[784,3,1],[880,4,2],[784,6,1],[659,7,1],
      [740,8,2],[659,10,1],[587,11,1],[659,12,2],[587,14,2],
      [988,16,2],[880,18,1],[784,19,1],[880,20,2],[659,22,2],
      [784,24,1],[880,25,1],[988,26,1],[1047,27,1],[988,28,2],[880,30,2],
      [880,32,2],[659,34,1],[784,35,1],[880,36,2],[784,38,1],[659,39,1],
      [740,40,2],[659,42,1],[587,43,1],[659,44,2],[880,46,2],
      [1047,48,2],[988,50,2],[880,52,2],[784,54,2],[880,56,4],
    ];
    ML.forEach(([f,s,d])=>{ note(f,s,d,'square',0.20,dry); note(f,s,d,'square',0.07,wet); note(f*0.749,s+0.02,d,'sawtooth',0.07,dry); });

    // Bass
    [[110,0,4],[138,4,4],[147,8,4],[110,12,4],[165,16,4],[147,20,4],[138,24,4],[110,28,4],
     [110,32,4],[138,36,4],[147,40,4],[110,44,4],[138,48,4],[165,52,4],[110,56,4]].forEach(([f,s,d])=>{
      const st=now+s*b, en=st+d*b*0.9;
      if(en>now+30) return;
      const osc=ctx.createOscillator(), filt=ctx.createBiquadFilter(), g=ctx.createGain();
      osc.type='sawtooth'; osc.frequency.value=f;
      filt.type='lowpass'; filt.frequency.value=600;
      g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(0.35,st+0.02); g.gain.exponentialRampToValueAtTime(0.001,en);
      osc.connect(filt); filt.connect(g); g.connect(dry); osc.start(st); osc.stop(en+0.05);
    });

    // Pad chords
    [[220,277,330,0,8],[185,233,277,8,8],[196,247,294,16,8],[220,277,330,24,8],
     [175,220,262,32,8],[196,247,294,40,8],[220,277,330,48,8]].forEach(([a,b2,c,s,d])=>{
      [a,b2,c].forEach(f=>{ note(f,s,d,'sawtooth',0.052,wet); note(f*1.005,s,d,'sawtooth',0.038,wet); });
    });

    // Drums
    const totalBeats=Math.floor(30/b);
    function kick(t){ const o=ctx.createOscillator(),g=ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(30,t+0.18); g.gain.setValueAtTime(0.65,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.22); o.connect(g);g.connect(dry);o.start(t);o.stop(t+0.25); }
    function snare(t){ const sz=ctx.sampleRate*0.14,buf=ctx.createBuffer(1,sz,ctx.sampleRate),d2=buf.getChannelData(0); for(let i=0;i<sz;i++)d2[i]=Math.random()*2-1; const src=ctx.createBufferSource(),filt=ctx.createBiquadFilter(),g=ctx.createGain(); src.buffer=buf;filt.type='bandpass';filt.frequency.value=1500;filt.Q.value=0.9;g.gain.setValueAtTime(0.26,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.14);src.connect(filt);filt.connect(g);g.connect(dry);src.start(t);src.stop(t+0.16); }
    function hat(t,v=0.1){ const sz=Math.max(1,ctx.sampleRate*0.038),buf=ctx.createBuffer(1,sz,ctx.sampleRate),d2=buf.getChannelData(0); for(let i=0;i<sz;i++)d2[i]=Math.random()*2-1; const src=ctx.createBufferSource(),filt=ctx.createBiquadFilter(),g=ctx.createGain(); src.buffer=buf;filt.type='highpass';filt.frequency.value=8000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.038);src.connect(filt);filt.connect(g);g.connect(dry);src.start(t);src.stop(t+0.04); }
    for(let beat=0;beat<totalBeats;beat++){
      const t=now+beat*b;
      kick(t); if(beat%4===2)kick(t+b*0.5);
      if(beat%4===1||beat%4===3) snare(t);
      for(let e=0;e<8;e++) hat(t+e*b*0.125, e%2===0?0.13:0.08);
    }
  }catch(e){ console.warn('Julie audio error',e); }
}

/* ══════════════════════════════════════════
   JULIE — ACTIVATION / TEARDOWN
══════════════════════════════════════════ */
let _jAnimId = null;
let _jStart  = null;
let heartInterval;

function activateJulie(){
  hideResults(); closeNetTools();
  const overlay = document.getElementById('julieOverlay');
  overlay.classList.add('active');

  const canvas = document.getElementById('julieCanvas');
  _jStart = null;
  if(_jAnimId) cancelAnimationFrame(_jAnimId);

  playJulieTheme();

  function loop(ts){
    if(!_jStart) _jStart = ts;
    const elapsed = (ts - _jStart) / 1000;
    const ctx = canvas.getContext('2d');
    // Match canvas resolution to its displayed size
    const W = canvas.offsetWidth  || 400;
    const H = canvas.offsetHeight || 300;
    if(canvas.width !== W || canvas.height !== H){
      canvas.width = W; canvas.height = H;
    }
    renderCartoonFrame(ctx, W, H, elapsed);
    _jAnimId = requestAnimationFrame(loop);
  }
  _jAnimId = requestAnimationFrame(loop);

  // Floating hearts
  heartInterval = setInterval(()=>{
    const h = document.createElement('div');
    h.className = 'heart';
    h.innerHTML = '❤';
    h.style.left = Math.random()*100+'vw';
    h.style.animationDuration = (4+Math.random()*4)+'s';
    document.body.appendChild(h);
    setTimeout(()=>h.remove(), 8000);
  }, 800);
}

function exitJulie(){
  document.getElementById('julieOverlay').classList.remove('active');
  if(_jAnimId){ cancelAnimationFrame(_jAnimId); _jAnimId = null; }
  clearInterval(heartInterval);
  stopJulieTheme();
  document.querySelectorAll('.heart').forEach(h=>h.remove());
}



/* ══════════════════════════════════════════
   HELPERS
══════════════════════════════════════════ */
function showSpinner(){
  showResults();
  document.getElementById("resultsContainer").innerHTML=
    '<div class="spinner" style="display:block"></div>';
}

function showResults(){
  document.getElementById("resultsContainer").style.display="block";
  document.getElementById("logo").classList.add("shifted");
}

function hideResults(){
  document.getElementById("resultsContainer").style.display="none";
  document.getElementById("logo").classList.remove("shifted");
}

function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escAttr(s){
  return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
