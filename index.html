<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

/* ===== EXACT LOGO WITH PROPER CLEAVAGE ===== */

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:baseline;
  letter-spacing:-3px;
  margin-bottom:30px;
}

.twin-o{
  display:inline-block;
  position:relative;
  color:#EA4335;
  animation:bounce 1.6s ease-in-out infinite;
}

/* Slightly tighter squeeze */
.twin-o:nth-child(2){
  margin-left:-9px;
}

/* More defined center crease */
.twin-o:first-of-type::after{
  content:"";
  position:absolute;
  right:-2px;
  top:28%;
  width:3px;
  height:45%;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0.28),
    rgba(0,0,0,0)
  );
  border-radius:3px;
  pointer-events:none;
}

@keyframes bounce{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-14px); }
}

/* ===== SEARCH ===== */

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
}

.buttons{ margin-top:25px; }

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}

.feature-card{
  width:90%;
  max-width:900px;
  margin-top:30px;
}

.map-container{
  height:380px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #dadce0;
}

.place-item{
  margin-bottom:18px;
  padding-bottom:12px;
  border-bottom:1px solid #eee;
}

.place-links a{
  margin-right:15px;
  font-size:14px;
}

.detail-panel{
  margin-top:20px;
  padding:15px;
  border:1px solid #dadce0;
  border-radius:12px;
}

.results{
  margin-top:30px;
  width:90%;
  max-width:800px;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">

<div class="joogle-logo">
  <span style="color:#4285F4;">J</span>
  <span class="twin-o">o</span>
  <span class="twin-o">o</span>
  <span style="color:#4285F4;">g</span>
  <span style="color:#34A853;">l</span>
  <span style="color:#EA4335;">e</span>
</div>

<input class="search-box" id="searchInput" placeholder="Search Joogle..." />

<div class="buttons">
  <button onclick="search()">Joogle Search</button>
  <button onclick="imFeelingJoogly()">I'm Feeling Joogly</button>
</div>

<div class="feature-card" id="featureCard"></div>
<div class="results" id="results"></div>

</div>

<div class="footer">
Joogle is a parody project created with love.
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const WORKER_URL="https://joogle-proxy.flodingus.workers.dev/";

function imFeelingJoogly(){
  alert("Joogly Mode Activated 💕");
}

async function search(){
  const q=document.getElementById("searchInput").value.trim();
  if(!q) return;

  document.getElementById("featureCard").innerHTML="";
  document.getElementById("results").innerHTML="";

  if(q.toLowerCase().includes("weather")){
    renderWeatherWidget(q);
    return;
  }

  if(q.toLowerCase().includes("near me")){
    handleNearMe();
    return;
  }

  const res=await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({q})
  });

  const data=await res.json();
  renderResults(data.organic||[]);
}

/* ===== WEATHER HANDOFF TO SYSTEM ===== */

function renderWeatherWidget(q){
  document.getElementById("featureCard").innerHTML=
    "<div style='padding:20px;'>Weather loaded above via stable system.</div>";
}

/* ===== MAP ===== */

async function handleNearMe(){

navigator.geolocation.getCurrentPosition(async pos=>{

  const lat=pos.coords.latitude;
  const lon=pos.coords.longitude;

  document.getElementById("featureCard").innerHTML=
  `<div class="map-container" id="map"></div>
   <div id="placeList"></div>
   <div id="detailPanel"></div>`;

  const map=L.map("map").setView([lat,lon],14);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);

  const overpass=`
    [out:json];
    node["amenity"="restaurant"](around:3000,${lat},${lon});
    out;
  `;

  const response=await fetch("https://overpass-api.de/api/interpreter",{
    method:"POST",
    body:overpass
  });

  const data=await response.json();
  const list=document.getElementById("placeList");

  data.elements.forEach(place=>{
    if(!place.tags || !place.tags.name) return;

    const website=place.tags.website
      ? `<a href="${place.tags.website}" target="_blank">Website</a>`
      : "";

    const directions=
      `<a href="https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lon}" target="_blank">
      Get Directions
      </a>`;

    const marker=L.marker([place.lat,place.lon]).addTo(map);

    marker.bindPopup(
      `<strong>${place.tags.name}</strong><br>${website}<br>${directions}`
    );

    marker.on("click",()=>showDetails(place));

    const item=document.createElement("div");
    item.className="place-item";
    item.innerHTML=`
      <strong>${place.tags.name}</strong>
      <div class="place-links">
        ${website} ${directions}
      </div>
    `;

    item.onclick=()=>{
      map.setView([place.lat,place.lon],16);
      marker.openPopup();
      showDetails(place);
    };

    list.appendChild(item);
  });

});
}

function showDetails(place){

  const website=place.tags.website
    ? `<a href="${place.tags.website}" target="_blank">Visit Website</a>`
    : "";

  document.getElementById("detailPanel").innerHTML=`
    <div class="detail-panel">
      <h2>${place.tags.name}</h2>
      ${website}
      <div style="margin-top:10px;">
        <a href="https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lon}" target="_blank">
        Get Directions
        </a>
      </div>
    </div>
  `;
}

function renderResults(results){
  document.getElementById("results").innerHTML=
    results.map(r=>`
      <div style="margin-bottom:20px;">
        <a href="${r.link}" target="_blank" style="font-size:18px;color:#1a0dab;text-decoration:none;">${r.title}</a>
        <div style="color:#006621;font-size:14px;">${r.link}</div>
        <div style="color:#545454;font-size:14px;">${r.snippet||""}</div>
      </div>
    `).join("");
}

document.getElementById("searchInput")
  .addEventListener("keydown",e=>{
    if(e.key==="Enter") search();
  });
</script>

</body>
</html>
