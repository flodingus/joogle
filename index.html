<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Joogle</title>

  <!-- Leaflet (free OSM map) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root{
      --bg:#fff; --text:#202124; --muted:#5f6368; --border:#dadce0; --chip:#f1f3f4;
      --link:#1a0dab; --visited:#681da8; --green:#137333; --blue:#1a73e8;
      --max:1280px;
      --leftcol: 652px; /* close to Google's results column */
    }
    *{box-sizing:border-box}
    body{margin:0;font:14px/1.35 Arial, Helvetica, sans-serif;background:var(--bg);color:var(--text)}
    a{color:var(--link);text-decoration:none}
    a:hover{text-decoration:underline}

    /* Header */
    .top{
      position:sticky; top:0; z-index:30;
      background:var(--bg);
      border-bottom:1px solid var(--border);
    }
    .top-inner{max-width:var(--max); margin:0 auto; padding:12px 20px 0; display:flex; gap:18px; align-items:flex-start}
    .brand{display:flex; align-items:center; gap:10px; padding-top:4px; cursor:pointer; user-select:none}
    .logo{font-size:28px; font-weight:700; letter-spacing:-.2px}
    .logo span:nth-child(1){color:#4285F4;}
    .logo span:nth-child(2){color:#DB4437;}
    .logo span:nth-child(3){color:#F4B400;}
    .logo span:nth-child(4){color:#4285F4;}
    .logo span:nth-child(5){color:#0F9D58;}
    .logo span:nth-child(6){color:#DB4437;}

    .searchbar{flex:1; max-width:720px; position:relative}
    .search{
      width:100%;
      border:1px solid var(--border);
      border-radius:999px;
      padding:12px 44px 12px 44px;
      font-size:16px;
      outline:none;
    }
    .search:focus{border-color:rgba(26,115,232,.35); box-shadow:0 1px 2px rgba(60,64,67,.1),0 1px 3px rgba(60,64,67,.2)}
    .icon{position:absolute; top:50%; transform:translateY(-50%); color:var(--muted); user-select:none}
    .icon.left{left:14px}
    .icon.right{right:14px; cursor:pointer}

    /* Tabs row */
    .tabs{
      max-width:var(--max);
      margin:10px auto 0;
      padding:0 20px 8px;
      display:flex; gap:18px; align-items:center;
      color:var(--muted);
      font-size:13px;
    }
    .tab{padding:8px 0; cursor:pointer; position:relative}
    .tab.active{color:var(--blue)}
    .tab.active::after{
      content:""; position:absolute; left:0; right:0; bottom:-9px; height:3px; background:var(--blue); border-radius:3px;
    }
    .tabs .spacer{flex:1}

    /* Layout */
    .page{max-width:var(--max); margin:0 auto; padding:12px 20px 40px}
    .meta{color:var(--muted); font-size:13px; margin:6px 0 14px}

    .cols{display:grid; grid-template-columns: var(--leftcol) 1fr; gap:36px; align-items:start}
    @media (max-width: 1050px){ .cols{grid-template-columns:1fr} .right{display:none} }

    /* Google-ish “answer blocks” */
    .block{
      border:1px solid var(--border);
      border-radius:16px;
      padding:14px 16px;
      margin:0 0 14px;
    }
    .block h2{margin:0 0 10px; font-size:16px}
    .small{color:var(--muted); font-size:12px}
    .row{display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid #f1f3f4}
    .row:first-of-type{border-top:none}
    .row .idx{width:18px; color:var(--muted)}
    .row .title{font-weight:700}
    .row .sub{color:var(--muted); font-size:12px; margin-top:3px}

    #map{height:220px; border-radius:12px; overflow:hidden; border:1px solid var(--border); margin-top:10px}

    /* Home */
    .home{
      min-height:72vh;
      display:grid;
      place-items:center;
      padding:20px 0 60px;
    }
    .home-inner{width:min(720px, 92vw); text-align:center}
    .home .logo{font-size:78px}
    .home .searchbar{margin:18px auto 0}

    /* Tweak Google CSE to blend in */
    .gsc-control-cse{border:none !important; padding:0 !important; background:transparent !important;}
    .gsc-webResult.gsc-result{border:none !important; padding:10px 0 !important;}
    .gsc-result .gs-title{font-size:18px !important; line-height:1.25 !important;}
    .gsc-result .gs-title a:visited{color:var(--visited) !important;}
    .gsc-url-top, .gsc-url-bottom{color:var(--green) !important;}
    .gsc-result .gs-snippet{color:#4d5156 !important;}
    .gsc-above-wrapper-area{border-bottom:none !important;}
    .gsc-results .gsc-cursor-box{margin-top:12px !important;}
  </style>
</head>

<body>

<!-- HOME VIEW -->
<section class="home" id="home">
  <div class="home-inner">
    <div class="logo" aria-label="Joogle">
      <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>
    <div class="searchbar">
      <div class="icon left">🔎</div>
      <input id="qHome" class="search" placeholder="Search Joogle…" autocomplete="off">
      <div class="icon right" onclick="runSearch(true)">⏎</div>
    </div>
    <div class="small" style="margin-top:14px">Not affiliated with Google.</div>
  </div>
</section>

<!-- RESULTS VIEW -->
<header class="top" id="top" style="display:none">
  <div class="top-inner">
    <div class="brand" onclick="goHome()" title="Home">
      <div class="logo" aria-label="Joogle">
        <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
      </div>
    </div>

    <div class="searchbar">
      <div class="icon left">🔎</div>
      <input id="q" class="search" autocomplete="off">
      <div class="icon right" onclick="runSearch(false)">⏎</div>
    </div>
  </div>

  <nav class="tabs" aria-label="Search tabs">
    <div class="tab active" data-tab="all" onclick="setTab('all')">All</div>
    <div class="tab" data-tab="images" onclick="setTab('images')">Images</div>
    <div class="tab" data-tab="news" onclick="setTab('news')">News</div>
    <div class="tab" data-tab="places" onclick="setTab('places')">Places</div>
    <div class="tab" data-tab="weather" onclick="setTab('weather')">Weather</div>
    <div class="spacer"></div>
    <div class="tab" data-tab="about" onclick="setTab('about')">About</div>
  </nav>
</header>

<main class="page" id="page" style="display:none">
  <div class="meta" id="meta"></div>

  <div class="cols">
    <section class="left" id="left">
      <div id="answers"></div>

      <!-- Google CSE results render here -->
      <div class="gcse-searchresults-only"></div>
    </section>

    <aside class="right" id="right">
      <div id="rightBox"></div>
    </aside>
  </div>
</main>

<!-- Load Google CSE -->
<script>
  const JOOGLE_CX = "427c85c8321db4c63";
  (function(){
    const s=document.createElement("script");
    s.async=true;
    s.src="https://cse.google.com/cse.js?cx="+encodeURIComponent(JOOGLE_CX);
    document.head.appendChild(s);
  })();
</script>

<script>
  const $ = (id)=>document.getElementById(id);
  let state = { tab:"all", q:"", map:null, markers:[], lastPOIs:[] };

  const CATS = [
    {name:"Restaurants", keys:[/restaurant|restaurants|food|pizza|taco|burger|breakfast|lunch|dinner/i], tags:[
      ["amenity","restaurant"],["amenity","fast_food"],["amenity","cafe"],["amenity","food_court"]
    ]},
    {name:"Coffee", keys:[/coffee|cafe|espresso|latte/i], tags:[["amenity","cafe"],["amenity","restaurant"]]},
    {name:"Bars", keys:[/bar|pub|brewery|cocktail/i], tags:[["amenity","bar"],["amenity","pub"],["amenity","biergarten"],["amenity","nightclub"]]},
    {name:"Libraries", keys:[/library|libraries/i], tags:[["amenity","library"]]},
    {name:"Gas", keys:[/gas|fuel|petrol/i], tags:[["amenity","fuel"]]},
    {name:"Live Music", keys:[/concert|concerts|live music|music venue|show tonight|gig/i], tags:[
      ["amenity","music_venue"],["amenity","theatre"],["amenity","arts_centre"],["amenity","nightclub"],
      ["leisure","stadium"],["leisure","sports_centre"]
    ]},
  ];

  function esc(s){ return (s||"").replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
  function goHome(){
    history.pushState({}, "", location.pathname);
    $("home").style.display="";
    $("top").style.display="none";
    $("page").style.display="none";
    $("qHome").focus();
  }
  function goResults(){
    $("home").style.display="none";
    $("top").style.display="";
    $("page").style.display="";
  }

  function setTab(tab){
    state.tab=tab;
    document.querySelectorAll(".tab[data-tab]").forEach(t=>{
      t.classList.toggle("active", t.getAttribute("data-tab")===tab);
    });
    if(state.q) runSearch(false,true);
  }

  function looksNearMe(q){ return /\bnear me\b/i.test(q); }
  function looksWeather(q){ return /\bweather\b/i.test(q) || q.toLowerCase().startsWith("forecast "); }
  function catFor(q){ return CATS.find(c=>c.keys.some(rx=>rx.test(q))) || null; }

  async function nominatim(q){
    const url="https://nominatim.openstreetmap.org/search?format=json&limit=1&q="+encodeURIComponent(q);
    return fetch(url).then(r=>r.json());
  }
  async function openMeteo(lat,lon){
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`;
    return fetch(url).then(r=>r.json());
  }
  async function overpass(lat,lon, tagPairs, radius=3500, limit=6){
    const filter = tagPairs.map(([k,v]) => `["${k}"="${v}"]`).join("");
    const q = `
      [out:json][timeout:25];
      (
        node${filter}(around:${radius},${lat},${lon});
        way${filter}(around:${radius},${lat},${lon});
        relation${filter}(around:${radius},${lat},${lon});
      );
      out center;
    `;
    const r = await fetch("https://overpass-api.de/api/interpreter",{
      method:"POST",
      headers:{ "Content-Type":"application/x-www-form-urlencoded;charset=UTF-8" },
      body:"data="+encodeURIComponent(q)
    });
    const data = await r.json();
    return (data?.elements||[]).slice(0,limit);
  }

  function poiLatLon(el){
    if(el.type==="node") return {lat:el.lat, lon:el.lon};
    if(el.center) return {lat:el.center.lat, lon:el.center.lon};
    return null;
  }
  function formatAddr(tags){
    const parts=[];
    if(tags["addr:housenumber"]) parts.push(tags["addr:housenumber"]);
    if(tags["addr:street"]) parts.push(tags["addr:street"]);
    const l1=parts.join(" ");
    const city=tags["addr:city"]||"";
    const st=tags["addr:state"]||"";
    const pc=tags["addr:postcode"]||"";
    const l2=[city,st,pc].filter(Boolean).join(" ");
    return [l1,l2].filter(Boolean).join(", ");
  }

  function clearMap(){
    if(state.map){
      state.markers.forEach(m=>m.remove());
      state.markers=[];
    }
  }
  function ensureMap(lat,lon){
    if(!state.map){
      state.map = L.map("map").setView([lat,lon],13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
        maxZoom:19, attribution:"&copy; OpenStreetMap contributors"
      }).addTo(state.map);
    } else {
      state.map.setView([lat,lon],13);
    }
    clearMap();
  }

  function renderLocalPack(pois, q, label){
    if(!pois?.length){
      return `
        <div class="block">
          <h2>Places</h2>
          <div class="small">No places found. If you’re in Incognito, allow Location for this site. Or try “restaurants Plano TX”.</div>
        </div>`;
    }
    const rows = pois.map((p,i)=>{
      const t=p.tags||{};
      const name=t.name||t.brand||"Place";
      const addr=formatAddr(t) || label || "";
      return `
        <div class="row" onclick="focusPOI(${i})">
          <div class="idx">${i+1}</div>
          <div>
            <div class="title">${esc(name)}</div>
            <div class="sub">${esc(addr)}</div>
          </div>
        </div>`;
    }).join("");

    return `
      <div class="block" id="localBlock">
        <h2>Places</h2>
        <div class="small">Around: ${esc(label||"your area")} • OpenStreetMap</div>
        ${rows}
        <div id="map"></div>
      </div>`;
  }

  function renderWeather(wx, label){
    const cw=wx?.current_weather;
    if(!cw) return "";
    return `
      <div class="block">
        <h2>Weather</h2>
        <div class="small">${esc(label||"Current conditions")}</div>
        <div style="display:flex;gap:14px;align-items:flex-end;margin-top:10px">
          <div style="font-size:44px;font-weight:700">${Math.round(cw.temperature)}°C</div>
          <div class="small">Wind ${Math.round(cw.windspeed)} km/h</div>
        </div>
        <div class="small" style="margin-top:10px">Data: Open-Meteo</div>
      </div>`;
  }

  window.focusPOI = function(i){
    const p=state.lastPOIs[i];
    if(!p || !state.map) return;
    const ll=poiLatLon(p); if(!ll) return;
    state.map.setView([ll.lat,ll.lon],15);
    const name=p.tags?.name||p.tags?.brand||"Place";
    const m=L.marker([ll.lat,ll.lon]).addTo(state.map).bindPopup(esc(name)).openPopup();
    state.markers.push(m);
  }

  function cseExecute(q){
    // Update URL for shareability + to help CSE state
    const u=new URL(location.href);
    u.searchParams.set("q", q);
    history.replaceState({}, "", u.toString());

    // Execute if possible; otherwise CSE will render from URL param.
    try{
      const el = window.google?.search?.cse?.element?.getElement?.("searchresults-only0");
      if(el?.execute) el.execute(q);
    }catch{}
  }

  async function resolveGeo(q){
    // Try geolocation only when query says near me
    if(looksNearMe(q) && navigator.geolocation){
      const pos = await new Promise((res,rej)=>navigator.geolocation.getCurrentPosition(res,rej,{
        timeout:12000, enableHighAccuracy:false, maximumAge:300000
      })).catch(()=>null);
      if(pos) return {lat:pos.coords.latitude, lon:pos.coords.longitude, label:"Near you"};
    }

    // Otherwise attempt to geocode leftover location text
    const cleaned = q
      .replace(/\bnear me\b/ig,"")
      .replace(/\brestaurants?\b|\bcoffee\b|\bcafe\b|\bbars?\b|\bgas\b|\blibrary\b|\bweather\b|\bforecast\b|\bconcerts?\b|\blive music\b/ig,"")
      .trim();

    if(!cleaned) return null;
    const r = await nominatim(cleaned);
    if(r?.[0]?.lat && r?.[0]?.lon) return {lat:Number(r[0].lat), lon:Number(r[0].lon), label:r[0].display_name};
    return null;
  }

  async function runSearch(fromHome=false, rerender=false){
    const q = (fromHome ? $("qHome").value : $("q").value).trim();
    if(!q) return;

    if(!rerender){
      history.pushState({}, "", `?q=${encodeURIComponent(q)}`);
      state.q=q;
    }

    goResults();
    $("q").value=q;
    $("meta").textContent = `Results for “${q}”`;

    // Answer blocks
    $("answers").innerHTML = "";
    $("rightBox").innerHTML = "";

    const API_BASE = "https://api.joogle.pro";
    const tab = state.tab;
    const wantPlaces = (tab==="places") || (tab==="all" && (looksNearMe(q) || !!catFor(q)));
    const wantWeather = (tab==="weather") || (tab==="all" && looksWeather(q));

    let geo = null;

    if(wantPlaces || wantWeather){
      geo = await resolveGeo(q);
    }

    if(wantWeather && geo){
      const wx = await openMeteo(geo.lat, geo.lon).catch(()=>null);
      if(wx) $("answers").innerHTML += renderWeather(wx, geo.label);
    }

    if(wantPlaces){
      const cat = catFor(q) || CATS[0];
      if(geo){
        const pois = await overpass(geo.lat, geo.lon, cat.tags, 3500, 6).catch(()=>[]);
        state.lastPOIs = pois;
        $("answers").innerHTML += renderLocalPack(pois, q, geo.label);
        setTimeout(()=>{
          if($("map") && geo){
            ensureMap(geo.lat, geo.lon);
            (pois||[]).slice(0,6).forEach((p,idx)=>{
              const ll=poiLatLon(p); if(!ll) return;
              const name=p.tags?.name||p.tags?.brand||"Place";
              const m=L.marker([ll.lat,ll.lon]).addTo(state.map).bindPopup(esc(name));
              state.markers.push(m);
              if(idx===0) m.openPopup();
            });
          }
        }, 50);
      } else {
        $("answers").innerHTML += `
          <div class="block">
            <h2>Places</h2>
            <div class="small">Couldn’t find a location. Try “restaurants Plano TX” or allow location access.</div>
          </div>`;
      }
    }

    // If user is on Images/News/About, we still show web results (CSE) to keep it “Google-like”
    cseExecute(q);
  }

  // Enter keys
  $("qHome").addEventListener("keydown", e=>{ if(e.key==="Enter") runSearch(true); });
  $("q").addEventListener("keydown", e=>{ if(e.key==="Enter") runSearch(false); });

  // Initialize from URL
  function init(){
    const p=new URLSearchParams(location.search);
    const q=p.get("q");
    if(q){
      $("qHome").value=q;
      $("q").value=q;
      state.q=q;
      goResults();
      runSearch(true,true);
    } else {
      goHome();
    }
  }
  window.addEventListener("popstate", init);
  init();
</script>

</body>
</html>
