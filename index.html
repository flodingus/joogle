<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:flex-end;
  letter-spacing:-3px;
  margin-bottom:30px;
}

/* PERFECT SIZE MATCH */
.eye-svg{
  width:0.78em;
  height:0.78em;
  vertical-align:-0.05em;
}

.bounce{ animation:bounce 0.45s ease; }

@keyframes bounce{
  0%{transform:translateY(0);}
  50%{transform:translateY(-14px);}
  100%{transform:translateY(0);}
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{ margin-top:25px; }

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}
button:hover{ background:#f1f3f4; }

.feature-card{
  width:90%;
  max-width:900px;
  margin-top:30px;
}

.weather-card{
  border:1px solid #dadce0;
  border-radius:12px;
  background:#fdf7f9;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.weather-accent{ height:4px;background:#ff9eb5; }

.forecast-row{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.forecast-day{
  font-size:12px;
  text-align:center;
}

.map-container{
  height:380px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #dadce0;
}

.place-list{
  margin-top:15px;
  font-size:14px;
}

.place-item{
  margin-bottom:8px;
  cursor:pointer;
  color:#1a0dab;
}
.place-item:hover{ text-decoration:underline; }

.results{
  margin-top:30px;
  width:90%;
  max-width:800px;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">
  <div class="joogle-logo" id="logo"></div>
  <input class="search-box" id="searchInput" placeholder="Search Joogle..." />
  <div class="buttons">
    <button onclick="search()">Joogle Search</button>
    <button onclick="imFeelingJoogly()">I'm Feeling Joogly</button>
  </div>
  <div class="feature-card" id="featureCard"></div>
  <div class="results" id="results"></div>
</div>

<div class="footer">
Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const WORKER_URL="https://joogle-proxy.flodingus.workers.dev/";

/* ---------------- LOGO + ANIMATION ---------------- */

function initLogo(){
const logo=document.getElementById("logo");

logo.innerHTML=`
<span style="color:#4285F4;">J</span>
<span class="o1" style="color:#EA4335;">o</span>

<svg class="eye-svg" viewBox="0 0 60 60">
  <circle cx="30" cy="30" r="18" fill="white" stroke="#EA4335" stroke-width="4"/>
  <circle class="pupil" cx="30" cy="30" r="6" fill="black"/>
  <circle cx="33" cy="27" r="2" fill="white"/>

  <!-- EYELASHES -->
  <path d="M18 14 Q22 6 26 14" stroke="black" stroke-width="2" fill="none"/>
  <path d="M26 12 Q30 4 34 12" stroke="black" stroke-width="2" fill="none"/>
  <path d="M34 14 Q38 6 42 14" stroke="black" stroke-width="2" fill="none"/>

  <ellipse class="lid" cx="30" cy="30" rx="22" ry="0" fill="#EA4335" opacity="0"/>
</svg>

<span style="color:#4285F4;">g</span>
<span style="color:#34A853;">l</span>
<span style="color:#EA4335;">e</span>
`;

animateLogo();
}

function animateLogo(){
const o1=document.querySelector(".o1");
const eye=document.querySelector(".eye-svg");
const pupil=document.querySelector(".pupil");
const lid=document.querySelector(".lid");

function loop(){
o1.classList.add("bounce");
eye.classList.add("bounce");

setTimeout(()=>{
o1.classList.remove("bounce");
eye.classList.remove("bounce");

setTimeout(()=>{
lid.style.transition="all .3s ease";
lid.setAttribute("ry","22");
lid.style.opacity="1";
pupil.style.transform="scale(0.7)";

setTimeout(()=>{
lid.setAttribute("ry","0");
lid.style.opacity="0";
pupil.style.transform="scale(1)";
},1200);

},300);

},500);
}

setInterval(loop,3200);
}

/* ---------------- SEARCH ---------------- */

async function search(){
const q=document.getElementById("searchInput").value.trim();
if(!q) return;

document.getElementById("featureCard").innerHTML="";
document.getElementById("results").innerHTML="";

const lowerQ=q.toLowerCase();

if(lowerQ.includes("near me")){
await handleNearMe(q);
return;
}

if(lowerQ.includes("weather") || lowerQ.includes("forecast") || lowerQ.includes("temperature")){
await handleWeather(q);
return;
}

const res=await fetch(WORKER_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({q})
});

const data=await res.json();
renderResults(data.organic||[]);
}

function renderResults(results){
document.getElementById("results").innerHTML=
results.map(r=>`
<div style="margin-bottom:20px;">
<a href="${r.link}" target="_blank" style="font-size:18px;color:#1a0dab;text-decoration:none;">${r.title}</a>
<div style="color:#006621;font-size:14px;">${r.link}</div>
<div style="color:#545454;font-size:14px;">${r.snippet||""}</div>
</div>
`).join("");
}

/* ---------------- WEATHER ---------------- */

async function handleWeather(query){
let city=query.toLowerCase()
.replace("weather","")
.replace("forecast","")
.replace("temperature","")
.trim();

if(!city) city="Phoenix";

const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}`);
const geoData=await geo.json();
if(!geoData.results) return;

const lat=geoData.results[0].latitude;
const lon=geoData.results[0].longitude;
const locationLabel=`${geoData.results[0].name}, ${geoData.results[0].admin1}`;

const weather=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&forecast_days=5`
);

const wData=await weather.json();

let forecastHTML="";
for(let i=0;i<wData.daily.time.length;i++){
const day=new Date(wData.daily.time[i]);
const label=day.toLocaleDateString("en-US",{weekday:"short"});
forecastHTML+=`
<div class="forecast-day">
<div>${label}</div>
<div>${Math.round(wData.daily.temperature_2m_max[i])}° / ${Math.round(wData.daily.temperature_2m_min[i])}°</div>
</div>`;
}

document.getElementById("featureCard").innerHTML=`
<div class="weather-card">
<div class="weather-accent"></div>
<div style="padding:20px;">
<div style="font-size:40px;">${Math.round(wData.current_weather.temperature)}°F</div>
<div>${locationLabel}</div>
<div class="forecast-row">${forecastHTML}</div>
</div>
</div>`;
}

/* ---------------- JOOGLE ---------------- */

function imFeelingJoogly(){
if(Math.random()<0.20){
alert("Julie Mode Activated 💕");
}else{
search();
}
}

document.getElementById("searchInput").addEventListener("keydown",e=>{
if(e.key==="Enter") search();
});

initLogo();
</script>
</body>
</html>
