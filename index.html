<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:flex-end;
  letter-spacing:-3px;
  margin-bottom:30px;
}

.bounce{ animation:bounce 0.45s ease; }
@keyframes bounce{
  0%{transform:translateY(0);}
  50%{transform:translateY(-14px);}
  100%{transform:translateY(0);}
}

.eye-svg{
  width:1em;
  height:1em;
  vertical-align:-0.08em;
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{ margin-top:25px; }

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}
button:hover{ background:#f1f3f4; }

.feature-card{
  width:90%;
  max-width:800px;
  margin-top:30px;
}

.weather-card{
  border:1px solid #dadce0;
  border-radius:12px;
  background:#fdf7f9;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.weather-accent{
  height:4px;
  background:#ff9eb5;
}

.weather-content{
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.weather-left{
  display:flex;
  flex-direction:column;
}

.weather-temp{
  font-size:44px;
  font-weight:500;
}

.weather-condition{
  font-size:16px;
  color:#555;
}

.weather-location{
  font-size:14px;
  color:#777;
  margin-top:6px;
}

.weather-right{
  font-size:14px;
  color:#555;
  text-align:right;
}

.results{
  margin-top:30px;
  width:90%;
  max-width:800px;
}

.result{ margin-bottom:28px; }

.result a{
  font-size:18px;
  color:#1a0dab;
  text-decoration:none;
}
.result a:hover{ text-decoration:underline; }

.result .link{
  font-size:14px;
  color:#006621;
}
.result .snippet{
  font-size:14px;
  color:#545454;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">
  <div class="joogle-logo"></div>
  <input class="search-box" id="searchInput" placeholder="Search Joogle..." />
  <div class="buttons">
    <button onclick="search()">Joogle Search</button>
    <button onclick="imFeelingJoogly()">I'm Feeling Joogly</button>
  </div>
  <div class="feature-card" id="featureCard"></div>
  <div class="results" id="results"></div>
</div>

<div class="footer">
Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<script>
const WORKER_URL="https://joogle-proxy.flodingus.workers.dev/";

function createLogo(container){
container.innerHTML=`
<span style="color:#4285F4;">J</span>
<span class="o1" style="color:#EA4335;">o</span>
<svg class="eye-svg" viewBox="0 0 60 60">
<circle cx="30" cy="30" r="19" fill="#EA4335"/>
<circle class="iris" cx="30" cy="30" r="6" fill="black" opacity="0"/>
<ellipse class="lid" cx="30" cy="30" rx="21" ry="0" fill="#EA4335" opacity="0"/>
</svg>
<span style="color:#4285F4;">g</span>
<span style="color:#34A853;">l</span>
<span style="color:#EA4335;">e</span>`;
}

function animateLogo(container){
const o1=container.querySelector(".o1");
const svg=container.querySelector("svg");
const iris=container.querySelector(".iris");
const lid=container.querySelector(".lid");

function loop(){
o1.classList.add("bounce");
svg.classList.add("bounce");
setTimeout(()=>{
o1.classList.remove("bounce");
svg.classList.remove("bounce");
iris.style.opacity="1";
setTimeout(()=>{
lid.style.transition="ry 0.35s ease";
lid.setAttribute("opacity","1");
lid.setAttribute("ry","21");
setTimeout(()=>{ lid.setAttribute("ry","0"); },1100);
setTimeout(()=>{
lid.setAttribute("opacity","0");
iris.style.opacity="0";
},1700);
},200);
},450);
}
setInterval(loop,3000);
}

document.querySelectorAll(".joogle-logo").forEach(el=>{
createLogo(el);
animateLogo(el);
});

async function search(){
const q=document.getElementById("searchInput").value.trim();
if(!q) return;

history.pushState({}, "", "?q="+encodeURIComponent(q));
document.getElementById("results").innerHTML="Searching...";
document.getElementById("featureCard").innerHTML="";

if(q.toLowerCase().includes("weather")){
handleWeather(q);
}

const res=await fetch(WORKER_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({q})
});
const data=await res.json();
renderResults(data.organic||[]);
}

function renderResults(results){
document.getElementById("results").innerHTML=
results.map(r=>`
<div class="result">
<a href="${r.link}" target="_blank">${r.title}</a>
<div class="link">${r.link}</div>
<div class="snippet">${r.snippet||""}</div>
</div>
`).join("");
}

async function handleWeather(query){
document.getElementById("featureCard").innerHTML=
`<div class="weather-card"><div class="weather-accent"></div>
<div class="weather-content">Loading weather...</div></div>`;

let city=query.toLowerCase().replace("weather","").trim();
let lat,lon,locationLabel="";

if(city){
const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}`);
const geoData=await geo.json();
if(!geoData.results){
document.getElementById("featureCard").innerHTML="";
return;
}
lat=geoData.results[0].latitude;
lon=geoData.results[0].longitude;
locationLabel=geoData.results[0].name;
}else{
try{
await new Promise((resolve,reject)=>{
navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude;
lon=pos.coords.longitude;
resolve();
},()=>reject());
});
locationLabel="Your Location";
}catch{
try{
const ip=await fetch("https://ipapi.co/json/");
const ipData=await ip.json();
lat=ipData.latitude;
lon=ipData.longitude;
locationLabel=ipData.city;
}catch{
document.getElementById("featureCard").innerHTML=
`<div class="weather-card"><div class="weather-accent"></div>
<div class="weather-content">Enable location for precise local weather.</div></div>`;
return;
}
}
}

const weather=await fetch(
`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=fahrenheit&windspeed_unit=mph`
);
const wData=await weather.json();

document.getElementById("featureCard").innerHTML=`
<div class="weather-card">
<div class="weather-accent"></div>
<div class="weather-content">
<div class="weather-left">
<div class="weather-temp">${Math.round(wData.current_weather.temperature)}°F</div>
<div class="weather-condition">Weather Code: ${wData.current_weather.weathercode}</div>
<div class="weather-location">${locationLabel}</div>
</div>
<div class="weather-right">
<div>Wind: ${Math.round(wData.current_weather.windspeed)} mph</div>
</div>
</div>
</div>`;
}

document.getElementById("searchInput").addEventListener("keydown",e=>{
if(e.key==="Enter") search();
});

window.onload=()=>{
const params=new URLSearchParams(window.location.search);
const q=params.get("q");
if(q){
document.getElementById("searchInput").value=q;
search();
}
};
</script>
</body>
</html>
