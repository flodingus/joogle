<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Joogle</title>

  <!-- Leaflet for map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root{
      --bg:#ffffff;
      --text:#202124;
      --muted:#5f6368;
      --border:#dadce0;
      --chip:#f1f3f4;
      --link:#1a0dab;
      --visited:#681da8;
      --green:#137333;
      --shadow:0 1px 2px rgba(0,0,0,.08), 0 2px 6px rgba(0,0,0,.06);
      --radius:18px;
      --max:1120px;
    }
    *{box-sizing:border-box}
    body{margin:0;font:14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
    a{color:var(--link);text-decoration:none}
    a:hover{text-decoration:underline}
    .wrap{max-width:var(--max);margin:0 auto;padding:0 16px}
    .topbar{position:sticky;top:0;background:#fff;border-bottom:1px solid var(--border);z-index:10}
    .topbar-inner{display:flex;align-items:center;gap:14px;padding:10px 0}
    .brand{display:flex;align-items:center;gap:10px;min-width:120px}
    .logo{
      font-size:30px;font-weight:700;letter-spacing:-.5px;user-select:none
    }
    .logo span:nth-child(1){color:#4285F4;}
    .logo span:nth-child(2){color:#DB4437;}
    .logo span:nth-child(3){color:#F4B400;}
    .logo span:nth-child(4){color:#4285F4;}
    .logo span:nth-child(5){color:#0F9D58;}
    .logo span:nth-child(6){color:#DB4437;}
    .searchwrap{flex:1;position:relative}
    .search{
      width:100%;
      border:1px solid var(--border);
      border-radius:999px;
      padding:12px 44px 12px 44px;
      outline:none;
      box-shadow:none;
      font-size:16px;
    }
    .search:focus{box-shadow:var(--shadow);border-color:#cfd3d7}
    .icon{
      position:absolute;top:50%;transform:translateY(-50%);
      width:22px;height:22px;color:var(--muted);
      display:grid;place-items:center;
      font-size:16px;
    }
    .icon.left{left:14px}
    .icon.right{right:14px;cursor:pointer}
    .suggest{
      position:absolute;left:0;right:0;top:46px;
      background:#fff;border:1px solid var(--border);border-radius:14px;
      box-shadow:var(--shadow);
      overflow:hidden;display:none;
    }
    .suggest .row{
      padding:10px 14px;cursor:pointer;display:flex;gap:10px;align-items:center;
    }
    .suggest .row:hover{background:#f8f9fa}
    .suggest .hint{color:var(--muted)}
    .tabs{
      display:flex;gap:14px;padding:0 0 10px 0;align-items:center
    }
    .tab{
      padding:8px 10px;border-radius:999px;color:var(--muted);cursor:pointer;
    }
    .tab.active{background:var(--chip);color:var(--text)}
    .meta{color:var(--muted);font-size:13px;margin:10px 0 12px}
    .grid{
      display:grid;grid-template-columns: minmax(0, 1fr) 360px;
      gap:24px;padding:18px 0 40px;
    }
    @media (max-width: 980px){
      .grid{grid-template-columns:1fr}
      .right{display:none}
    }
    .card{
      border:1px solid var(--border);
      border-radius:var(--radius);
      padding:14px 16px;
      margin:0 0 12px;
      box-shadow:none;
      background:#fff;
    }
    .card.soft{background:#fafafa}
    .result{padding:8px 0}
    .cite{color:var(--green);font-size:12px;margin:2px 0}
    .title{font-size:18px;line-height:1.25;margin:0}
    .snippet{color:#3c4043;margin:6px 0 0}
    .chiprow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
    .chip{
      border:1px solid var(--border);
      background:#fff;
      border-radius:999px;
      padding:6px 10px;
      cursor:pointer;
      color:var(--text);
      font-size:13px;
    }
    .chip:hover{background:#f8f9fa}
    .localPackHead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .localGrid{display:grid;grid-template-columns: 1fr 1fr;gap:12px;margin-top:10px}
    @media (max-width: 650px){ .localGrid{grid-template-columns:1fr} }
    .place{
      border:1px solid var(--border);
      border-radius:14px;padding:12px;cursor:pointer;
    }
    .place:hover{background:#f8f9fa}
    .place .name{font-weight:650}
    .place .addr{color:var(--muted);font-size:12px;margin-top:4px}
    .place .tag{display:inline-block;margin-top:8px;font-size:12px;color:var(--muted)}
    #map{height:280px;border-radius:14px;overflow:hidden;border:1px solid var(--border);margin-top:12px}
    .panelTitle{font-weight:700;margin:0 0 10px}
    .kv{display:grid;grid-template-columns: 92px 1fr;gap:10px;margin:10px 0 0;font-size:13px}
    .kv div:nth-child(odd){color:var(--muted)}
    .small{color:var(--muted);font-size:12px}
    .foot{color:var(--muted);font-size:12px;margin-top:14px}
    .loader{
      width:18px;height:18px;border:2px solid #ddd;border-top-color:#888;border-radius:999px;
      display:inline-block;animation:spin 0.8s linear infinite;vertical-align:-3px;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .home{
      min-height:60vh;display:grid;place-items:center;padding:30px 0 50px
    }
    .home .hero{
      width:min(680px, 92vw);text-align:center
    }
    .home .logo{font-size:72px}
    .home .searchwrap{margin-top:18px}
    .home .tabs{justify-content:center}
  </style>
</head>

<body>
  <div class="topbar" id="topbar" style="display:none">
    <div class="wrap">
      <div class="topbar-inner">
        <div class="brand" role="button" tabindex="0" onclick="goHome()">
          <div class="logo" aria-label="Joogle">
            <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
          </div>
        </div>

        <div class="searchwrap">
          <div class="icon left">🔎</div>
          <input id="q" class="search" autocomplete="off" placeholder="Search Joogle…">
          <div class="icon right" title="Search" onclick="runSearch()">⏎</div>

          <div id="suggest" class="suggest" role="listbox" aria-label="Suggestions"></div>
        </div>
      </div>

      <div class="tabs wrap" style="padding-left:0;padding-right:0">
        <div class="tab active" data-tab="all" onclick="setTab('all')">All</div>
        <div class="tab" data-tab="local" onclick="setTab('local')">Places</div>
        <div class="tab" data-tab="weather" onclick="setTab('weather')">Weather</div>
        <div class="tab" data-tab="about" onclick="setTab('about')">About</div>
      </div>
    </div>
  </div>

  <!-- Home -->
  <div class="home" id="home">
    <div class="hero">
      <div class="logo" aria-label="Joogle">
        <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
      </div>

      <div class="searchwrap" style="margin-inline:auto">
        <div class="icon left">🔎</div>
        <input id="qHome" class="search" autocomplete="off" placeholder="Search Joogle…">
        <div class="icon right" title="Search" onclick="runSearch(true)">⏎</div>
        <div id="suggestHome" class="suggest" role="listbox" aria-label="Suggestions"></div>
      </div>

      <div class="tabs" style="margin-top:12px">
        <div class="tab active">All</div>
        <div class="tab">Places</div>
        <div class="tab">Weather</div>
        <div class="tab">About</div>
      </div>

      <div class="foot">Powered by open data (OSM, Open-Meteo, Wikipedia) + DuckDuckGo IA.</div>
    </div>
  </div>

  <!-- Results -->
  <div class="wrap" id="resultsPage" style="display:none">
    <div class="meta" id="meta"></div>

    <div class="grid">
      <main class="left" id="left"></main>
      <aside class="right" id="right"></aside>
    </div>
  </div>

<script>
  // ==========================
  // Config & Helpers
  // ==========================
  const LOCAL_KEYWORDS = [
    "restaurant","coffee","cafe","bar","library","gas","pizza","food","breakfast","lunch","dinner",
    "hotel","motel","pharmacy","hospital","urgent care","gym","bank","atm","park","museum","theater",
    "best","near me","nearby","closest","open now"
  ];

  const state = {
    tab: "all",
    lastQuery: "",
    map: null,
    mapMarkers: [],
    lastGeo: null
  };

  function $(id){ return document.getElementById(id); }
  function esc(s){ return (s||"").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }

  function looksLocal(q){
    const qq = q.toLowerCase();
    return LOCAL_KEYWORDS.some(k => qq.includes(k));
  }
  function looksWeather(q){
    return q.toLowerCase().includes("weather") || q.toLowerCase().startsWith("forecast ");
  }

  // Basic "Google-ish" query chips
  function buildChips(q){
    const base = [
      `what is ${q}`,
      `${q} near me`,
      `${q} hours`,
      `${q} reviews`,
      `${q} directions`,
      `weather ${q}`
    ];
    return base.slice(0, 6);
  }

  // ==========================
  // Suggestions (lightweight)
  // ==========================
  // NOTE: no official free Google-like suggestion API without keys.
  // We'll generate "smart" suggestions + Wikipedia opensearch fallback.
  async function getSuggestions(q){
    const qq = q.trim();
    if(!qq) return [];

    const smart = buildChips(qq).map(t => ({text:t, hint:"Suggested"}));

    // Wikipedia Opensearch (free)
    try{
      const url = "https://en.wikipedia.org/w/api.php?action=opensearch&search=" +
        encodeURIComponent(qq) + "&limit=6&namespace=0&format=json&origin=*";
      const r = await fetch(url);
      const data = await r.json();
      const w = (data?.[1] || []).map(t => ({text:t, hint:"Wikipedia"}));
      // Merge unique
      const seen = new Set();
      const merged = [...w, ...smart].filter(x => {
        const k = x.text.toLowerCase();
        if(seen.has(k)) return false;
        seen.add(k);
        return true;
      });
      return merged.slice(0, 8);
    }catch{
      return smart.slice(0, 8);
    }
  }

  function renderSuggestions(list, boxEl, panelEl){
    if(!list.length){ panelEl.style.display="none"; return; }
    panelEl.innerHTML = list.map((s,i)=>(
      `<div class="row" role="option" data-i="${i}">
         <div>🔎</div>
         <div>
           <div>${esc(s.text)}</div>
           <div class="hint">${esc(s.hint||"")}</div>
         </div>
       </div>`
    )).join("");
    panelEl.style.display="block";

    panelEl.querySelectorAll(".row").forEach(row=>{
      row.addEventListener("mousedown", (e)=>{
        e.preventDefault();
        const i = Number(row.getAttribute("data-i"));
        boxEl.value = list[i].text;
        panelEl.style.display="none";
        runSearch(boxEl.id === "qHome");
      });
    });
  }

  function wireSuggest(inputId, panelId){
    const box = $(inputId);
    const panel = $(panelId);
    let t = null;
    box.addEventListener("input", ()=>{
      clearTimeout(t);
      t = setTimeout(async ()=>{
        const list = await getSuggestions(box.value);
        renderSuggestions(list, box, panel);
      }, 120);
    });
    box.addEventListener("blur", ()=> setTimeout(()=> panel.style.display="none", 120));
    box.addEventListener("focus", async ()=>{
      if(box.value.trim()){
        const list = await getSuggestions(box.value);
        renderSuggestions(list, box, panel);
      }
    });
    box.addEventListener("keydown", (e)=>{
      if(e.key==="Enter"){ panel.style.display="none"; runSearch(inputId==="qHome"); }
      if(e.key==="Escape"){ panel.style.display="none"; }
    });
  }

  // ==========================
  // Tab system
  // ==========================
  function setTab(tab){
    state.tab = tab;
    document.querySelectorAll(".tab").forEach(t=>{
      t.classList.toggle("active", t.getAttribute("data-tab") === tab);
    });
    // Re-render from cached query
    if(state.lastQuery) runSearch(false, true);
  }

  // ==========================
  // Routing: home <-> results
  // ==========================
  function goHome(){
    history.pushState({}, "", location.pathname);
    $("home").style.display = "";
    $("topbar").style.display = "none";
    $("resultsPage").style.display = "none";
    $("qHome").focus();
  }

  function goResults(){
    $("home").style.display = "none";
    $("topbar").style.display = "";
    $("resultsPage").style.display = "";
    $("q").focus();
  }

  // ==========================
  // Data fetchers
  // ==========================
  async function ddgInstantAnswer(q){
    const url = "https://api.duckduckgo.com/?q=" + encodeURIComponent(q) + "&format=json&no_html=1&skip_disambig=1";
    const r = await fetch(url);
    return r.json();
  }

  async function wikiSummary(q){
    // Try a direct page summary based on the first wikipedia suggestion
    // If it fails, we'll just not show panel.
    try{
      const searchUrl = "https://en.wikipedia.org/w/api.php?action=opensearch&search=" +
        encodeURIComponent(q) + "&limit=1&namespace=0&format=json&origin=*";
      const s = await fetch(searchUrl).then(r=>r.json());
      const title = s?.[1]?.[0];
      if(!title) return null;

      const sumUrl = "https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title);
      const sum = await fetch(sumUrl).then(r=>r.json());
      if(sum?.type === "disambiguation") return null;

      return {
        title: sum?.title,
        extract: sum?.extract,
        url: sum?.content_urls?.desktop?.page
      };
    }catch{
      return null;
    }
  }

  async function nominatimSearch(q){
    // IMPORTANT: Nominatim usage policy expects a descriptive User-Agent header.
    // In a static page, we can't set custom headers reliably, so keep volume low.
    const url = "https://nominatim.openstreetmap.org/search?format=json&limit=8&q=" + encodeURIComponent(q);
    const r = await fetch(url);
    return r.json();
  }

  async function openMeteo(lat, lon){
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lon)}&current_weather=true`;
    const r = await fetch(url);
    return r.json();
  }

  // ==========================
  // Renderers
  // ==========================
  function renderWebCard(ddg, q){
    // DuckDuckGo IA isn't a full web index; we'll present it as "Quick web answers".
    const topics = (ddg?.RelatedTopics || [])
      .flatMap(x => x.Topics ? x.Topics : [x])
      .filter(x => x && (x.Text || x.FirstURL))
      .slice(0, 8);

    const abstract = ddg?.AbstractText ? `
      <div class="card soft">
        <div class="small">Quick answer</div>
        <div style="font-size:16px;margin-top:6px">${esc(ddg.AbstractText)}</div>
        ${ddg?.AbstractURL ? `<div class="cite"><a href="${esc(ddg.AbstractURL)}" target="_blank" rel="noopener">${esc(ddg.AbstractURL)}</a></div>` : ""}
      </div>` : "";

    const list = topics.map(t=>{
      const url = t.FirstURL || "";
      const title = (t.Text || "").split(" - ")[0] || t.Text || url;
      const snip = t.Text || "";
      return `
        <div class="result">
          <div class="cite">${esc(url)}</div>
          <h3 class="title"><a href="${esc(url)}" target="_blank" rel="noopener">${esc(title)}</a></h3>
          <div class="snippet">${esc(snip)}</div>
        </div>`;
    }).join("");

    return `
      ${abstract}
      <div class="card">
        <div class="small">Results</div>
        ${list || `<div class="snippet">No quick web answers found. Try a different query.</div>`}
      </div>
    `;
  }

  function renderChips(q){
    const chips = buildChips(q);
    return `
      <div class="card">
        <div class="small">Refine this search</div>
        <div class="chiprow">
          ${chips.map(c => `<div class="chip" onclick="searchChip('${esc(c).replace(/'/g,"&#039;")}')">${esc(c)}</div>`).join("")}
        </div>
      </div>
    `;
  }

  function searchChip(text){
    $("q").value = text;
    runSearch(false);
  }

  function clearMap(){
    if(state.map){
      state.mapMarkers.forEach(m => m.remove());
      state.mapMarkers = [];
      // keep map instance but clear markers
    }
  }

  function ensureMap(lat, lon){
    const mapEl = $("map");
    if(!mapEl) return;

    if(!state.map){
      state.map = L.map(mapEl, { zoomControl: true }).setView([lat, lon], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(state.map);
    } else {
      state.map.setView([lat, lon], 13);
    }
    clearMap();
  }

  function renderLocalPack(places, q){
    if(!places?.length) return "";

    const top = places.slice(0, 4);
    const center = top[0];

    // Build list
    const items = top.map((p, idx)=>{
      const name = (p.display_name || "").split(",")[0] || "Place";
      const addr = p.display_name || "";
      return `
        <div class="place" onclick="focusPlace(${idx})" data-idx="${idx}">
          <div class="name">${esc(name)}</div>
          <div class="addr">${esc(addr)}</div>
          <div class="tag">OpenStreetMap</div>
        </div>
      `;
    }).join("");

    // Map container (rendered after injection)
    const html = `
      <div class="card">
        <div class="localPackHead">
          <div>
            <div class="small">Places</div>
            <div style="font-size:18px;font-weight:700;margin-top:2px">${esc(q)}</div>
          </div>
          <div class="small">Map results</div>
        </div>
        <div class="localGrid">${items}</div>
        <div id="map"></div>
        <div class="foot">Tip: add “near me”, “open now”, or a city name for better results.</div>
      </div>
    `;

    // Save places for focus
    state.lastPlaces = top;
    state.lastGeo = { lat: center.lat, lon: center.lon };
    return html;
  }

  function focusPlace(i){
    const p = state.lastPlaces?.[i];
    if(!p || !state.map) return;
    const lat = Number(p.lat), lon = Number(p.lon);
    state.map.setView([lat, lon], 15);

    // Highlight in UI
    document.querySelectorAll(".place").forEach(el=>{
      el.style.borderColor = "var(--border)";
    });
    const el = document.querySelector(`.place[data-idx="${i}"]`);
    if(el) el.style.borderColor = "#b6bcc2";

    // Popup
    const name = (p.display_name || "").split(",")[0] || "Place";
    const m = L.marker([lat, lon]).addTo(state.map).bindPopup(esc(name)).openPopup();
    state.mapMarkers.push(m);
  }

  function renderWeatherCard(weather, label){
    const cw = weather?.current_weather;
    if(!cw) return "";
    return `
      <div class="card">
        <div class="small">Weather</div>
        <div style="display:flex;gap:16px;align-items:center;margin-top:8px">
          <div style="font-size:34px;font-weight:800">${Math.round(cw.temperature)}°C</div>
          <div>
            <div style="font-weight:700">${esc(label || "Current conditions")}</div>
            <div class="small">Wind: ${Math.round(cw.windspeed)} km/h • Dir: ${Math.round(cw.winddirection)}°</div>
          </div>
        </div>
        <div class="foot">Data: Open-Meteo</div>
      </div>
    `;
  }

  function renderAboutPanel(wiki, q){
    if(!wiki) return `
      <div class="card">
        <div class="panelTitle">About</div>
        <div class="small">No summary found for “${esc(q)}”. Try a more specific query.</div>
      </div>
    `;

    return `
      <div class="card">
        <div class="panelTitle">About</div>
        <div style="font-weight:800;font-size:18px;margin-bottom:8px">${esc(wiki.title)}</div>
        <div class="small">${esc(wiki.extract || "")}</div>
        ${wiki.url ? `<div class="cite" style="margin-top:10px"><a href="${esc(wiki.url)}" target="_blank" rel="noopener">Wikipedia</a></div>` : ""}
      </div>
    `;
  }

  // ==========================
  // Main search
  // ==========================
  async function runSearch(fromHome=false, justRerender=false){
    const box = fromHome ? $("qHome") : $("q");
    const q = (box.value || "").trim();
    if(!q) return;

    // Update URL
    if(!justRerender){
      history.pushState({}, "", `?q=${encodeURIComponent(q)}`);
      state.lastQuery = q;
    }

    // Move into results view
    goResults();
    $("q").value = q;

    // Clear containers
    $("left").innerHTML = `
      <div class="card"><span class="loader"></span> Loading results…</div>
    `;
    $("right").innerHTML = "";

    const started = performance.now();

    // Determine intents
    const intentLocal = looksLocal(q) || state.tab === "local";
    const intentWeather = looksWeather(q) || state.tab === "weather";
    const intentAbout = state.tab === "about";

    // Fetch in parallel (keep it fast)
    const jobs = [];
    jobs.push(ddgInstantAnswer(q));
    jobs.push(wikiSummary(q));

    // Local & weather need geo
    let placesPromise = null;
    if(intentLocal || intentWeather){
      placesPromise = nominatimSearch(q);
      jobs.push(placesPromise);
    }

    let [ddg, wiki, places] = await Promise.all(jobs);

    // If we didn’t request places, ensure variable is null
    if(!(intentLocal || intentWeather)) places = null;

    // Weather: if we have a geo point, fetch weather
    let weather = null;
    if(intentWeather){
      const p0 = places?.[0];
      if(p0?.lat && p0?.lon){
        weather = await openMeteo(p0.lat, p0.lon);
      } else if(state.lastGeo){
        weather = await openMeteo(state.lastGeo.lat, state.lastGeo.lon);
      }
    }

    // Render meta
    const ms = Math.round(performance.now() - started);
    $("meta").textContent = `About ${Math.max(12, Math.round(Math.random()*180))} results (simulated) • ${ms} ms • Query: “${q}”`;

    // Build left column by tab
    let leftHTML = "";
    let rightHTML = "";

    // Right rail (about panel)
    if(wiki){
      rightHTML += renderAboutPanel(wiki, q);
    }else{
      rightHTML += renderAboutPanel(null, q);
    }

    // Weather card prefers right rail too
    if(weather){
      rightHTML = renderWeatherCard(weather, "Current weather") + rightHTML;
    }

    // Local pack (left)
    const showLocal = intentLocal || (state.tab==="all" && looksLocal(q));
    if(showLocal){
      const localHTML = renderLocalPack(places, q);
      if(localHTML) leftHTML += localHTML;
    }

    // Web results (left)
    if(state.tab === "local"){
      if(!places?.length){
        leftHTML += `<div class="card"><div class="small">Places</div><div class="snippet">No places found. Try “${esc(q)} near me” or add a city.</div></div>`;
      }
    } else if(state.tab === "weather"){
      if(!weather){
        leftHTML += `<div class="card"><div class="small">Weather</div><div class="snippet">No weather location found. Try “weather Dallas” or “forecast Chicago”.</div></div>`;
      } else {
        leftHTML += renderWeatherCard(weather, "Current weather");
      }
      // Add some web context too
      leftHTML += renderWebCard(ddg, q);
    } else if(state.tab === "about"){
      leftHTML += `<div class="card soft"><div class="small">About</div><div class="snippet">See the panel on the right for a quick overview. Try a more specific query for richer summaries.</div></div>`;
      leftHTML += renderWebCard(ddg, q);
    } else {
      leftHTML += renderChips(q);
      leftHTML += renderWebCard(ddg, q);
    }

    $("left").innerHTML = leftHTML;
    $("right").innerHTML = rightHTML;

    // After DOM injection, initialize map & markers if local pack shown
    if(showLocal && places?.length){
      const c = places[0];
      ensureMap(Number(c.lat), Number(c.lon));
      // Add markers for top 4
      (state.lastPlaces || []).forEach((p, idx)=>{
        const lat = Number(p.lat), lon = Number(p.lon);
        const name = (p.display_name || "").split(",")[0] || "Place";
        const m = L.marker([lat, lon]).addTo(state.map).bindPopup(esc(name));
        state.mapMarkers.push(m);
        if(idx === 0) m.openPopup();
      });
    } else {
      // If no map in DOM, reset map
      state.map = null;
      state.mapMarkers = [];
    }
  }

  // ==========================
  // Bootstrap: load from URL
  // ==========================
  function initFromURL(){
    const params = new URLSearchParams(location.search);
    const q = params.get("q");
    if(q){
      $("q").value = q;
      $("qHome").value = q;
      runSearch(true);
    } else {
      goHome();
    }
  }

  // Suggestions wiring
  wireSuggest("qHome", "suggestHome");
  wireSuggest("q", "suggest");

  // Keyboard support for search button
  $("qHome").addEventListener("keydown", e=>{ if(e.key==="Enter") runSearch(true); });
  $("q").addEventListener("keydown", e=>{ if(e.key==="Enter") runSearch(false); });

  // Back/forward navigation
  window.addEventListener("popstate", initFromURL);

  // Initialize
  initFromURL();
</script>
</body>
</html>
