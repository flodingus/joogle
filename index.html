<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:baseline;
  letter-spacing:-3px;
  margin-bottom:30px;
}

.twin-o{
  display:inline-block;
  color:#EA4335;
  animation:bounce 1.6s ease-in-out infinite;
}

.twin-o:nth-child(3){
  margin-left:-6px;
}

@keyframes bounce{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-14px); }
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{
  margin-top:25px;
}

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}
button:hover{
  background:#f1f3f4;
}

.feature-card{
  width:90%;
  max-width:900px;
  margin-top:30px;
}

.weather-card{
  border:1px solid #dadce0;
  border-radius:12px;
  background:#fafafa;
  padding:20px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.forecast-row{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.forecast-day{
  text-align:center;
  font-size:13px;
}

.results{
  margin-top:40px;
  width:90%;
  max-width:750px;
}

.results-count{
  color:#70757a;
  font-size:14px;
  margin-bottom:20px;
}

.result-item{
  margin-bottom:32px;
}

.result-header{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:4px;
}

.result-favicon{
  width:16px;
  height:16px;
}

.result-url{
  font-size:14px;
  color:#006621;
}

.result-title{
  font-size:20px;
  color:#1a0dab;
  text-decoration:none;
}

.result-title:hover{
  text-decoration:underline;
}

.result-snippet{
  font-size:14px;
  color:#4d5156;
  margin-top:4px;
  line-height:1.5;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">

<div class="joogle-logo">
  <span style="color:#4285F4;">J</span>
  <span class="twin-o">o</span>
  <span class="twin-o">o</span>
  <span style="color:#4285F4;">g</span>
  <span style="color:#34A853;">l</span>
  <span style="color:#EA4335;">e</span>
</div>

<input class="search-box" id="searchInput" placeholder="Search Joogle..." />

<div class="buttons">
  <button id="searchBtn">Joogle Search</button>
  <button id="jooglyBtn">I'm Feeling Joogly</button>
</div>

<div class="feature-card" id="featureCard"></div>
<div class="results" id="results"></div>

</div>

<div class="footer">
Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<script>

const WORKER_URL="https://joogle-proxy.flodingus.workers.dev/";

async function search(){

  const q=document.getElementById("searchInput").value.trim();
  if(!q) return;

  clearUI();

  const lower=q.toLowerCase();

  if(lower.startsWith("weather") || lower.startsWith("forecast")){
    await handleWeather(q);
    return;
  }

  await runOrganicSearch(q);
}

function clearUI(){
  document.getElementById("featureCard").innerHTML="";
  document.getElementById("results").innerHTML="";
}

async function runOrganicSearch(q){

  try{
    const res=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q})
    });

    const data=await res.json();
    renderResults(data.organic||[], data.search_information?.total_results);
  }catch(err){
    console.error(err);
  }
}

function renderResults(results,total){

  const container=document.getElementById("results");

  let countHTML="";
  if(total){
    countHTML=`<div class="results-count">About ${total.toLocaleString()} results</div>`;
  }

  container.innerHTML =
    countHTML +
    results.map(r=>{

      let domain="";
      try{
        domain=new URL(r.link).hostname;
      }catch(e){}

      return `
      <div class="result-item">
        <div class="result-header">
          <img class="result-favicon"
               src="https://www.google.com/s2/favicons?domain=${domain}"
               alt="">
          <div class="result-url">${domain}</div>
        </div>

        <a class="result-title" href="${r.link}" target="_blank">
          ${r.title}
        </a>

        <div class="result-snippet">
          ${r.snippet || ""}
        </div>
      </div>
      `;
    }).join("");
}

/* ================= WEATHER (LOCKED) ================= */

async function handleWeather(query){

  let location=query.replace(/^(weather|forecast)/i,"").trim();
  if(!location) location="Phoenix AZ";

  let lat=null, lon=null, label="";

  try{
    const geo=await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=5&language=en`
    );
    const geoData=await geo.json();

    if(geoData.results && geoData.results.length){
      const r=geoData.results[0];
      lat=r.latitude;
      lon=r.longitude;
      label=`${r.name}${r.admin1 ? ", "+r.admin1 : ""}`;
    }
  }catch(e){}

  if(!lat){
    try{
      const geo=await fetch(
        `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(location)}`
      );
      const geoData=await geo.json();
      if(geoData.length){
        lat=geoData[0].lat;
        lon=geoData[0].lon;
        label=geoData[0].display_name;
      }
    }catch(e){}
  }

  if(!lat){
    document.getElementById("featureCard").innerHTML=
      `<div class="weather-card">No location found for "${location}"</div>`;
    return;
  }

  const weather=await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&forecast_days=5`
  );

  const wData=await weather.json();

  let forecastHTML="";
  for(let i=0;i<wData.daily.time.length;i++){
    const day=new Date(wData.daily.time[i]);
    const name=day.toLocaleDateString("en-US",{weekday:"short"});
    forecastHTML+=`
      <div class="forecast-day">
        <div><strong>${name}</strong></div>
        <div>${Math.round(wData.daily.temperature_2m_max[i])}°</div>
        <div style="color:#777;">
          ${Math.round(wData.daily.temperature_2m_min[i])}°
        </div>
      </div>
    `;
  }

  document.getElementById("featureCard").innerHTML=`
    <div class="weather-card">
      <div style="font-size:40px;">
        ${Math.round(wData.current_weather.temperature)}°F
      </div>
      <div>${label}</div>
      <div class="forecast-row">
        ${forecastHTML}
      </div>
    </div>
  `;
}

function imFeelingJoogly(){
  const input=document.getElementById("searchInput");
  const randomQueries=[
    "funny cat videos",
    "weather Dallas TX",
    "how to cook steak",
    "best pizza in Phoenix"
  ];
  input.value=randomQueries[Math.floor(Math.random()*randomQueries.length)];
  search();
}

document.getElementById("searchBtn").addEventListener("click",search);
document.getElementById("jooglyBtn").addEventListener("click",imFeelingJoogly);

document.getElementById("searchInput")
  .addEventListener("keydown",e=>{
    if(e.key==="Enter") search();
  });

</script>

</body>
</html>
