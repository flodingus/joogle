<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle</title>

<link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text y='.9em' font-size='90'>💙</text>
</svg>">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#202124;
}

.header{
  display:flex;
  align-items:center;
  padding:15px 24px;
  border-bottom:1px solid #dadce0;
}

.logo{
  font-size:26px;
  font-weight:bold;
  cursor:pointer;
  letter-spacing:-2px;
}

.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.hero{
  height:60vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.heroLogo{
  font-size:100px;
  font-weight:bold;
  letter-spacing:-8px;
}

.heroLogo span:nth-child(1){color:#4285F4}
.heroLogo span:nth-child(2){color:#DB4437}
.heroLogo span:nth-child(3){color:#F4B400}
.heroLogo span:nth-child(4){color:#4285F4}
.heroLogo span:nth-child(5){color:#0F9D58}
.heroLogo span:nth-child(6){color:#DB4437}

.bounce{
  display:inline-block;
  animation:premiumBounce 2.4s infinite cubic-bezier(.28,.84,.42,1);
}

@keyframes premiumBounce{
  0%,100%{transform:translateY(0) scaleX(1) scaleY(1);}
  25%{transform:translateY(-10px) scaleX(1.02) scaleY(.98);}
  40%{transform:translateY(0) scaleX(.97) scaleY(1.03);}
  55%{transform:translateY(-3px) scaleX(1.01) scaleY(.99);}
  70%{transform:translateY(0);}
}

.searchArea{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.searchInput{
  width:400px;
  max-width:90vw;
  padding:10px 18px;
  border-radius:24px;
  border:1px solid #dadce0;
  font-size:16px;
}

.button{
  padding:8px 16px;
  border-radius:20px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  cursor:pointer;
}

.results{
  max-width:900px;
  margin:30px auto;
  padding:0 20px;
}

.card{
  background:#f8f9fa;
  padding:20px;
  border-radius:12px;
}

.error{
  background:#ffecec;
  color:#900;
}

footer{
  text-align:center;
  font-size:12px;
  color:gray;
  padding:20px;
  opacity:.7;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.reload()">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
</div>

<div id="hero" class="hero">
  <div class="heroLogo">
    <span>J</span>
    <span class="bounce">o</span>
    <span class="bounce">o</span>
    <span>g</span>
    <span>l</span>
    <span>e</span>
  </div>

  <form id="searchForm" class="searchArea">
    <input id="searchBox" class="searchInput" placeholder="Search Joogle..." />
    <button class="button" type="submit">Joogle Search</button>
    <button class="button" type="button" onclick="feelingJoogly()">I'm Feeling Joogly</button>
  </form>
</div>

<div id="main" class="results"></div>

<footer>
  Joogle is a private parody made with love and is not affiliated with Google LLC.
</footer>

<script>

const PROXY_URL="https://joogle-proxy.flodingus.workers.dev";

function timeoutFetch(resource, options = {}, timeout = 8000) {
  return Promise.race([
    fetch(resource, options),
    new Promise((_, reject) =>
      setTimeout(() => reject(new Error("Request timed out")), timeout)
    )
  ]);
}

document.getElementById("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  performSearch(searchBox.value.trim());
});

function feelingJoogly(){
  const val=searchBox.value.trim();
  if(val) window.open("https://www.google.com/search?q="+encodeURIComponent(val));
}

async function performSearch(query){
  if(!query) return;

  const q=query.toLowerCase();

  if(q.includes("weather") || q.includes("forecast")){
    handleWeather(query);
    return;
  }

  hero.style.display="none";
  main.innerHTML="Loading...";

  try{
    const res=await timeoutFetch(PROXY_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({q:query})
    });

    const data=await res.json();
    let html="";
    if(data.organic){
      data.organic.forEach(r=>{
        html+=`
        <div>
          <a href="${r.link}" target="_blank">
            <h3>${r.title}</h3>
          </a>
          <p>${r.snippet}</p>
        </div><br>`;
      });
    }
    main.innerHTML=html || "No results.";
  }catch(err){
    main.innerHTML=`<div class="card error">Search failed. Try again.</div>`;
  }
}

async function handleWeather(query){

  hero.style.display="none";
  main.innerHTML="Loading weather...";

  try{

    let city=query.replace(/weather|forecast|in/gi,"").trim();

    if(city){
      await getWeatherByCity(city);
    }else{
      navigator.geolocation.getCurrentPosition(async pos=>{
        await getWeatherByCoords(pos.coords.latitude,pos.coords.longitude);
      },()=>{
        main.innerHTML=`<div class="card error">Location access denied.</div>`;
      });
    }

  }catch(err){
    main.innerHTML=`<div class="card error">Weather service unavailable.</div>`;
  }
}

async function getWeatherByCity(city){

  const geo=await timeoutFetch(
    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}`,
    { headers:{ "Accept":"application/json" } }
  );

  const geoData=await geo.json();

  if(!geoData.length){
    main.innerHTML=`<div class="card error">City not found.</div>`;
    return;
  }

  await getWeatherByCoords(geoData[0].lat,geoData[0].lon,geoData[0].display_name);
}

async function getWeatherByCoords(lat,lon,label){

  const weather=await timeoutFetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`
  );

  const data=await weather.json();

  let html=`
    <div class="card">
      <h2>${label || "Your Location"}</h2>
      <h1>${Math.round(data.current_weather.temperature)}°F</h1>
      <p>Wind: ${data.current_weather.windspeed} mph</p>
      <hr>
  `;

  data.daily.time.forEach((day,i)=>{
    html+=`
      <div style="display:flex;justify-content:space-between">
        <span>${day}</span>
        <span>
          ${Math.round(data.daily.temperature_2m_max[i])}° /
          ${Math.round(data.daily.temperature_2m_min[i])}°
        </span>
      </div>
    `;
  });

  html+="</div>";
  main.innerHTML=html;
}

</script>

</body>
</html>
