<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  overflow-x:hidden;
  transition:all .6s ease;
}

/* Animated Julie Background */
body.julie-active{
  background:linear-gradient(-45deg,#fff0f5,#ffe4ec,#fff5f9,#ffe0f0);
  background-size:400% 400%;
  animation:gradientFlow 12s ease infinite;
}

@keyframes gradientFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* Floating Hearts */
.heart{
  position:fixed;
  bottom:-20px;
  font-size:18px;
  color:#ff4d88;
  animation:floatUp 6s linear infinite;
  opacity:.6;
  pointer-events:none;
}

@keyframes floatUp{
  0%{transform:translateY(0); opacity:.6;}
  100%{transform:translateY(-110vh); opacity:0;}
}

/* LOGO (LOCKED STRUCTURE) */
.logo{
  font-size:104px;
  font-weight:500;
  display:flex;
  align-items:baseline;
  margin-top:120px;
  margin-bottom:30px;
  transition:.5s ease;
}

body.julie-active .logo{
  animation:shimmer 3s ease-in-out infinite;
}

@keyframes shimmer{
  0%{filter:brightness(1);}
  50%{filter:brightness(1.15);}
  100%{filter:brightness(1);}
}

.j{color:#4285F4;}
.g{color:#4285F4;}
.l{color:#34A853;}
.e{color:#EA4335;}

.oo-wrapper{
  display:flex;
  margin:0 6px;
  animation:bounce 1.6s ease-in-out infinite;
}

.o{
  width:54px;
  height:54px;
  border:8px solid #EA4335;
  border-radius:50%;
  background:white;
  position:relative;
  margin:0 -10px;
  transform:scaleX(0.88);
}

.o::after{
  content:"";
  width:9px;
  height:9px;
  background:#c62828;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

@keyframes bounce {
  0%,100% { transform:translateY(0); }
  40% { transform:translateY(-8px); }
  60% { transform:translateY(0); }
}

/* Search */
.search-box{
  width:560px;
  max-width:90vw;
}

.search-box input{
  width:100%;
  padding:14px 20px;
  border-radius:24px;
  border:1px solid #dcdcdc;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  box-shadow:0 1px 6px rgba(32,33,36,.28);
}

.buttons{
  margin-top:28px;
}

.buttons button{
  background:#f8f9fa;
  border:1px solid #f8f9fa;
  padding:10px 18px;
  margin:0 6px;
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
}

/* Julie Panel */
.julie-panel{
  display:none;
  margin-top:40px;
  text-align:center;
  max-width:720px;
  padding:30px;
  border-radius:18px;
  background:white;
  box-shadow:0 20px 50px rgba(255,0,100,0.2);
  animation:fadeIn .6s ease;
}

body.julie-active .julie-panel{
  display:block;
}

.julie-message{
  font-size:26px;
  font-weight:600;
  margin-bottom:25px;
  color:#d63384;
  min-height:40px;
  transition:opacity .4s ease;
}

.julie-image{
  width:100%;
  max-width:650px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
  margin-top:20px;
  display:none;
}

.spotify-embed{
  margin-top:20px;
  border-radius:12px;
  overflow:hidden;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(10px);}
  to{opacity:1; transform:translateY(0);}
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="logo">
  <span class="j">J</span>
  <div class="oo-wrapper">
    <div class="o"></div>
    <div class="o"></div>
  </div>
  <span class="g">g</span>
  <span class="l">l</span>
  <span class="e">e</span>
</div>

<div class="search-box">
  <input id="searchInput" type="text" placeholder="Search Joogle...">
</div>

<div class="buttons">
  <button onclick="performSearch()">Joogle Search</button>
  <button onclick="activateJulieMode()">I'm Feeling Joogly</button>
</div>

<div class="julie-panel">
  <div class="julie-message" id="julieMessage"></div>

  <div class="spotify-embed">
    <iframe style="border-radius:12px"
    src="https://open.spotify.com/embed/search/Every%20Little%20Thing%20She%20Does%20Is%20Magic%20Afghan%20Whigs"
    width="100%" height="80"
    frameBorder="0"
    allowfullscreen=""
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>
  </div>

  <img src="julie-denim.png" class="julie-image" id="julieImage">
</div>

<div class="footer">
  Joogle is a parody project created with love.
</div>

<script>

const loveNotes = [
"Julie, every little thing you do is magic.",
"You make ordinary days feel extraordinary.",
"Somehow, everything is better when you're near.",
"You’re the calm and the spark at the same time.",
"I still get that feeling every time I see you.",
"If magic were real, it would look like you.",
"Denim & dreams never looked so good.",
"You light up rooms without even trying."
];

let messageInterval;

document.getElementById("searchInput")
.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    performSearch();
  }
});

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    deactivateJulieMode();
  }
});

function performSearch(){
  const query = document.getElementById("searchInput").value.trim().toLowerCase();

  if(query.includes("julie")){
    activateJulieMode();
    return;
  }

  window.location.href =
  "https://www.google.com/search?q=" +
  encodeURIComponent(query);
}

function activateJulieMode(){
  document.body.classList.add("julie-active");
  rotateMessages();
  spawnHearts();

  if(Math.random() > 0.4){
    document.getElementById("julieImage").style.display="block";
  }
}

function deactivateJulieMode(){
  document.body.classList.remove("julie-active");
  document.getElementById("julieImage").style.display="none";
  clearInterval(messageInterval);
}

function rotateMessages(){
  updateMessage();
  messageInterval = setInterval(updateMessage,4000);
}

function updateMessage(){
  const randomNote =
  loveNotes[Math.floor(Math.random()*loveNotes.length)];
  const el = document.getElementById("julieMessage");
  el.style.opacity=0;
  setTimeout(()=>{
    el.innerText=randomNote;
    el.style.opacity=1;
  },300);
}

function spawnHearts(){
  setInterval(()=>{
    const heart = document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(14+Math.random()*20)+"px";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
  },600);
}

</script>

</body>
</html>
