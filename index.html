<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
:root {
  --bg:#ffffff;
  --text:#202124;
  --border:#dadce0;
  --link:#1a0dab;
  --card:#f8f9fa;
}

body.dark {
  --bg:#121212;
  --text:#e8e8e8;
  --border:#333;
  --link:#8ab4f8;
  --card:#1e1e1e;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  display:flex;
  align-items:center;
  padding:15px 24px;
  border-bottom:1px solid var(--border);
  gap:15px;
  position:relative;
}

.logo{
  font-size:26px;
  font-weight:bold;
  cursor:pointer;
}

.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.searchInput{
  flex:1;
  padding:10px 18px;
  border-radius:24px;
  border:1px solid var(--border);
  font-size:16px;
  background:var(--bg);
  color:var(--text);
}

.suggestions{
  position:absolute;
  top:60px;
  left:120px;
  right:120px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:12px;
  max-height:250px;
  overflow:auto;
  display:none;
  z-index:999;
}

.suggestionItem{
  padding:10px 15px;
  cursor:pointer;
}

.suggestionItem:hover{
  background:var(--card);
}

button{cursor:pointer;}

.home{
  display:flex;
  justify-content:center;
  align-items:center;
  height:70vh;
  font-size:90px;
  font-weight:bold;
}

.results{
  max-width:900px;
  margin:20px auto;
  padding:0 20px;
}

.summaryCard{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  margin-bottom:25px;
}

.resultItem{margin-bottom:25px;}
.resultItem h3{color:var(--link);margin:0;}

.error{color:red;font-weight:bold;}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.href='/'">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
  <input id="searchBox" class="searchInput" placeholder="Search Joogle...">
  <button id="darkToggle">🌙</button>
  <div id="suggestions" class="suggestions"></div>
</div>

<div class="home" id="homeSection">
  <div>
    <span style="color:#4285F4">J</span>
    <span style="color:#DB4437">o</span>
    <span style="color:#F4B400">o</span>
    <span style="color:#4285F4">g</span>
    <span style="color:#0F9D58">l</span>
    <span style="color:#DB4437">e</span>
  </div>
</div>

<div class="results" id="results"></div>

<script>

const PROXY_URL = "https://joogle-proxy.flodingus.workers.dev";

/* DARK MODE */
document.getElementById("darkToggle").onclick = () => {
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",
    document.body.classList.contains("dark"));
};
if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

/* UI HELPERS */

function showResults(html){
  document.getElementById("homeSection").style.display="none";
  document.getElementById("results").innerHTML=html;
}

function showError(msg){
  showResults(`<div class="error">${msg}</div>`);
}

/* AUTOCOMPLETE (using Serper suggestions endpoint) */

const input = document.getElementById("searchBox");
const suggestionsBox = document.getElementById("suggestions");

input.addEventListener("input", async e=>{
  const q = e.target.value.trim();
  if(q.length < 2){
    suggestionsBox.style.display="none";
    return;
  }

  try{
    const res = await fetch(PROXY_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({q})
    });

    const data = await res.json();
    if(!data.relatedSearches){
      suggestionsBox.style.display="none";
      return;
    }

    suggestionsBox.innerHTML="";
    data.relatedSearches.slice(0,5).forEach(s=>{
      const div=document.createElement("div");
      div.className="suggestionItem";
      div.innerText=s.query;
      div.onclick=()=>{
        input.value=s.query;
        suggestionsBox.style.display="none";
        performSearch(s.query);
      };
      suggestionsBox.appendChild(div);
    });

    suggestionsBox.style.display="block";

  }catch{
    suggestionsBox.style.display="none";
  }
});

/* SEARCH */

async function performSearch(query){

  if(!query) return;

  suggestionsBox.style.display="none";
  showResults("Loading...");

  try{
    const res=await fetch(PROXY_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({q:query})
    });

    const data=await res.json();

    if(!data.organic){
      showError("Search error");
      return;
    }

    let html="";

    // AI-style summary (first result snippet)
    if(data.organic.length > 0){
      html+=`
        <div class="summaryCard">
          <strong>Summary</strong><br><br>
          ${data.organic[0].snippet}
        </div>
      `;
    }

    data.organic.forEach(r=>{
      html+=`
        <div class="resultItem">
          <a href="${r.link}" target="_blank">
            <h3>${r.title}</h3>
          </a>
          <p>${r.snippet}</p>
        </div>`;
    });

    showResults(html);

  }catch(e){
    showError("Search failed");
  }
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    performSearch(input.value.trim());
  }
});
</script>

</body>
</html>
