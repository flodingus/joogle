<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text y='70%' x='50%' text-anchor='middle' font-size='80'>J</text>
</svg>">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#ffffff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.logo{
  font-size:64px;
  font-weight:500;
  display:flex;
  align-items:center;
  gap:4px;
  margin-bottom:30px;
}

.bounce{
  animation:bounce 0.5s ease;
}

@keyframes bounce{
  0%{transform:translateY(0);}
  50%{transform:translateY(-16px);}
  100%{transform:translateY(0);}
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{
  margin-top:25px;
}

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}

button:hover{
  background:#f1f3f4;
}

.results{
  margin-top:40px;
  width:90%;
  max-width:800px;
}

.result{
  margin-bottom:28px;
}

.result a{
  font-size:18px;
  color:#1a0dab;
  text-decoration:none;
}

.result a:hover{
  text-decoration:underline;
}

.result .link{
  font-size:14px;
  color:#006621;
}

.result .snippet{
  font-size:14px;
  color:#545454;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}

.love-page{
  position:fixed;
  inset:0;
  background:linear-gradient(to bottom,#ffffff 0%,#fff5f7 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.8s ease;
}

.love-page.active{
  opacity:1;
  pointer-events:auto;
}

.love-text{
  font-size:28px;
  text-align:center;
  margin-bottom:30px;
}

.play-btn{
  padding:12px 24px;
  border-radius:30px;
  border:none;
  background:#ff9eb5;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="main">

  <div class="logo">
    <span style="color:#4285F4;">J</span>

    <span id="o1" style="color:#EA4335;">o</span>

    <!-- Flirty Eye O -->
    <svg id="eyeSvg" width="60" height="60" viewBox="0 0 60 60">
      <circle id="yellowO" cx="30" cy="30" r="22" fill="#FBBC05"/>
      <circle id="iris" cx="30" cy="30" r="8" fill="black" opacity="0"/>
      <path id="lashes"
        d="M18 12 L20 5 M30 10 L30 2 M42 12 L40 5"
        stroke="black"
        stroke-width="2"
        opacity="0"/>
      <rect id="lid" x="8" y="8" width="44" height="0" fill="#FBBC05"/>
    </svg>

    <span style="color:#4285F4;">g</span>
    <span style="color:#34A853;">l</span>
    <span style="color:#EA4335;">e</span>
  </div>

  <input class="search-box" id="searchInput" placeholder="Search Joogle..." />

  <div class="buttons">
    <button onclick="search()">Joogle Search</button>
    <button onclick="imFeelingJoogly()">I'm Feeling Joogly</button>
  </div>

  <div class="results" id="results"></div>

</div>

<div class="footer">
  Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<div class="love-page" id="lovePage">
  <div class="love-text">
    Out of all the searches in the world…<br>
    you’re my favorite.
  </div>
  <button class="play-btn" onclick="playSong()">Play Something Special</button>
  <button style="margin-top:20px;" onclick="exitLove()">Back to Joogle</button>
</div>

<script>
const WORKER_URL = "https://joogle-proxy.flodingus.workers.dev/";

const o1 = document.getElementById("o1");
const eyeSvg = document.getElementById("eyeSvg");
const iris = document.getElementById("iris");
const lashes = document.getElementById("lashes");
const lid = document.getElementById("lid");

function logoLoop(){

  // Bounce both
  o1.classList.add("bounce");
  eyeSvg.classList.add("bounce");

  setTimeout(()=>{
    o1.classList.remove("bounce");
    eyeSvg.classList.remove("bounce");

    // Transform to eye
    iris.style.transition="opacity 0.3s ease";
    lashes.style.transition="opacity 0.3s ease";
    iris.style.opacity="1";
    lashes.style.opacity="1";

    setTimeout(()=>{
      // Flirty blink
      lid.style.transition="height 0.4s ease";
      lid.setAttribute("height","44");

      setTimeout(()=>{
        lid.setAttribute("height","0");
      },700);

      setTimeout(()=>{
        // Back to normal O
        iris.style.opacity="0";
        lashes.style.opacity="0";
      },1400);

    },300);

  },600);
}

setInterval(logoLoop,3500);

async function search(){
  const q=document.getElementById("searchInput").value.trim();
  if(!q) return;

  history.pushState({}, "", "?q="+encodeURIComponent(q));
  const resultsDiv=document.getElementById("results");
  resultsDiv.innerHTML="Searching...";

  try{
    const res=await fetch(WORKER_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ q })
    });
    const data=await res.json();
    renderResults(data.organic||[]);
  }catch{
    resultsDiv.innerHTML="Search failed.";
  }
}

function renderResults(results){
  const resultsDiv=document.getElementById("results");
  resultsDiv.innerHTML=results.map(r=>`
    <div class="result">
      <a href="${r.link}" target="_blank">${r.title}</a>
      <div class="link">${r.link}</div>
      <div class="snippet">${r.snippet||""}</div>
    </div>
  `).join("");
}

function imFeelingJoogly(){
  if(Math.random()<0.20){
    document.getElementById("lovePage").classList.add("active");
  }else{
    search();
  }
}

function exitLove(){
  document.getElementById("lovePage").classList.remove("active");
}

function playSong(){
  window.open("https://open.spotify.com/search/every%20little%20thing%20is%20magic","_blank");
}

document.getElementById("searchInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") search();
});

window.onload=()=>{
  const params=new URLSearchParams(window.location.search);
  const q=params.get("q");
  if(q){
    document.getElementById("searchInput").value=q;
    search();
  }
};
</script>

</body>
</html>
