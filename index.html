<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
:root{
  --bg:#ffffff;
  --text:#222;
  --card:#ffffff;
  --shadow:rgba(0,0,0,.15);
}

body.dark{
  --bg:#121212;
  --text:#e4e4e4;
  --card:#1e1e1e;
  --shadow:rgba(0,0,0,.6);
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  transition:.4s ease;
}

/* =========================
   LOCKED JOOGLE LOGO
========================= */

.logo{
  font-size:104px;
  font-weight:500;
  display:flex;
  align-items:baseline;
  margin-top:140px;
  margin-bottom:30px;
  transition:.5s ease;
}

.logo.shifted{
  margin-top:40px;
  transform:scale(.9);
}

.j{color:#4285F4;}
.g{color:#4285F4;}
.l{color:#34A853;}
.e{color:#EA4335;}

.oo-wrapper{
  display:flex;
  margin:0 6px;
  animation:bounce 1.6s ease-in-out infinite;
}

.o{
  width:54px;
  height:54px;
  border:8px solid #EA4335;
  border-radius:50%;
  background:#ffffff;
  position:relative;
  margin:0 -10px;
  transform:scaleX(0.88);
}

.o::after{
  content:"";
  width:9px;
  height:9px;
  background:#c62828;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  40%{transform:translateY(-8px);}
  60%{transform:translateY(0);}
}

/* ========================= */

.search-box{
  width:560px;
  max-width:90vw;
}

.search-box input{
  width:100%;
  padding:14px 20px;
  border-radius:24px;
  border:1px solid #ccc;
  font-size:16px;
}

.buttons{
  margin-top:24px;
}

.buttons button{
  background:#f8f9fa;
  border:1px solid #f8f9fa;
  padding:10px 18px;
  margin:0 6px;
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
}

body.dark .buttons button{
  background:#2a2a2a;
  border:1px solid #2a2a2a;
  color:#e4e4e4;
}

.results{
  display:none;
  width:95%;
  max-width:1200px;
  margin-top:30px;
  background:var(--card);
  border-radius:16px;
  box-shadow:0 20px 50px var(--shadow);
  padding:20px;
}

.map-container{
  width:100%;
  height:400px;
  margin-bottom:20px;
  border-radius:12px;
  overflow:hidden;
}

.weather-current{
  font-size:48px;
  font-weight:bold;
  margin:15px 0;
}

.forecast-row{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}

.forecast-day{
  flex:1;
  min-width:100px;
  text-align:center;
  padding:10px;
}

/* Julie Mode */
body.julie-active{
  background:linear-gradient(-45deg,#fff0f5,#ffe4ec,#fff5f9,#ffe0f0);
  background-size:400% 400%;
  animation:gradientFlow 12s ease infinite;
}

@keyframes gradientFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.julie-panel{
  display:none;
  margin-top:30px;
  text-align:center;
  max-width:700px;
}

.julie-panel img{
  max-width:100%;
  border-radius:12px;
  margin-top:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.heart{
  position:fixed;
  bottom:-20px;
  font-size:18px;
  color:#ff4d88;
  animation:floatUp 6s linear infinite;
  opacity:.6;
  pointer-events:none;
}

@keyframes floatUp{
  0%{transform:translateY(0);opacity:.6;}
  100%{transform:translateY(-110vh);opacity:0;}
}

.toggle{
  position:fixed;
  top:20px;
  right:20px;
  cursor:pointer;
  font-size:18px;
  background:var(--card);
  padding:8px 12px;
  border-radius:20px;
  box-shadow:0 5px 15px var(--shadow);
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="toggle" onclick="toggleDark()">🌙</div>

<div class="logo" id="logo">
  <span class="j">J</span>
  <div class="oo-wrapper">
    <div class="o"></div>
    <div class="o"></div>
  </div>
  <span class="g">g</span>
  <span class="l">l</span>
  <span class="e">e</span>
</div>

<div class="search-box">
  <input id="searchInput" type="text" placeholder="Search Joogle...">
</div>

<div class="buttons">
  <button onclick="performSearch()">Joogle Search</button>
  <button onclick="activateJulie()">I'm Feeling Joogly</button>
</div>

<div class="results" id="resultsContainer"></div>

<div class="julie-panel" id="juliePanel">
  <h2 id="julieMessage"></h2>
  <img src="julie-denim.png">
  <iframe style="border-radius:12px;margin-top:15px;"
    src="https://open.spotify.com/embed/track/5nNmj1cLH3r4aA4XDJ2bgY"
    width="100%" height="80"
    frameborder="0"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>
</div>

<div class="footer">Joogle Hybrid Engine – Locked Master</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* DARK MODE */
if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",
    document.body.classList.contains("dark"));
}

document.getElementById("searchInput").addEventListener("keydown", e=>{
  if(e.key==="Enter") performSearch();
  if(e.key==="Escape") exitJulie();
});

function performSearch(){
  const query=document.getElementById("searchInput").value.trim().toLowerCase();

  if(query.match(/julie|christopher|chris/)){
    activateJulie();
    return;
  }

  if(query.match(/restaurant|coffee|gas|library|bar|grocery/)){
    handleNearMe(query);
    return;
  }

  if(query.includes("weather")){
    handleWeather(query);
    return;
  }

  window.location.href="https://www.google.com/search?q="+encodeURIComponent(query);
}

/* WEATHER */
function handleWeather(query){
  const cleaned=query.replace("weather","").trim();
  showResults();

  if(cleaned===""){
    navigator.geolocation.getCurrentPosition(pos=>{
      fetchWeather(pos.coords.latitude,pos.coords.longitude,"Your Location");
    });
  } else {
    fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${cleaned}&count=1`)
    .then(res=>res.json())
    .then(data=>{
      if(!data.results){
        document.getElementById("resultsContainer").innerHTML="Location not found.";
        return;
      }
      const lat=data.results[0].latitude;
      const lon=data.results[0].longitude;
      const name=data.results[0].name;
      fetchWeather(lat,lon,name);
    });
  }
}

function fetchWeather(lat,lon,label){
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`)
  .then(res=>res.json())
  .then(data=>{
    let html=`<h2>Weather for ${label}</h2>
    <div class="weather-current">${Math.round(data.current_weather.temperature)}°F ☀️</div>
    <div class="forecast-row">`;

    for(let i=0;i<5;i++){
      html+=`<div class="forecast-day">
        <div>${data.daily.time[i]}</div>
        <div>${Math.round(data.daily.temperature_2m_max[i])}° / ${Math.round(data.daily.temperature_2m_min[i])}°</div>
      </div>`;
    }

    html+="</div>";
    document.getElementById("resultsContainer").innerHTML=html;
  });
}

/* NEAR ME */
function handleNearMe(query){
  showResults();
  navigator.geolocation.getCurrentPosition(pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;

    fetch(`https://overpass-api.de/api/interpreter?data=[out:json];node[amenity](around:3000,${lat},${lon});out;`)
    .then(res=>res.json())
    .then(data=>{
      renderMap(lat,lon,data.elements);
    });
  });
}

function renderMap(lat,lon,places){
  let html=`<div class="map-container" id="map"></div>`;
  places.slice(0,20).forEach(p=>{
    if(p.tags && p.tags.name){
      html+=`<div><strong>${p.tags.name}</strong></div>`;
    }
  });

  document.getElementById("resultsContainer").innerHTML=html;

  const map=L.map('map').setView([lat,lon],13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap'
  }).addTo(map);

  places.slice(0,20).forEach(p=>{
    if(p.lat && p.lon){
      L.marker([p.lat,p.lon]).addTo(map);
    }
  });
}

/* JULIE */
let heartInterval;
const loveNotes=[
"Julie, every little thing you do is magic.",
"You light up rooms without trying.",
"You’re my favorite search result.",
"Everything is better with you."
];

function activateJulie(){
  hideResults();
  document.body.classList.add("julie-active");
  document.getElementById("juliePanel").style.display="block";
  document.getElementById("julieMessage").innerText=
    loveNotes[Math.floor(Math.random()*loveNotes.length)];

  heartInterval=setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
  },600);
}

function exitJulie(){
  document.body.classList.remove("julie-active");
  document.getElementById("juliePanel").style.display="none";
  clearInterval(heartInterval);
}

/* UI */
function showResults(){
  document.getElementById("resultsContainer").style.display="block";
  document.getElementById("logo").classList.add("shifted");
}

function hideResults(){
  document.getElementById("resultsContainer").style.display="none";
  document.getElementById("logo").classList.remove("shifted");
}

</script>

</body>
</html>
