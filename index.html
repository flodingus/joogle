<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  color:#202124;
}

.header{
  display:flex;
  align-items:center;
  padding:15px 24px;
  border-bottom:1px solid #dadce0;
}

.logo{
  font-size:26px;
  font-weight:bold;
  cursor:pointer;
  margin-right:30px;
}

.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.searchContainer{
  flex:1;
  max-width:650px;
}

.home{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:75vh;
}

.homeLogo{
  font-size:90px;
  font-weight:bold;
  margin-bottom:30px;
}

.homeLogo span:nth-child(1){color:#4285F4}
.homeLogo span:nth-child(2){color:#DB4437}
.homeLogo span:nth-child(3){color:#F4B400}
.homeLogo span:nth-child(4){color:#4285F4}
.homeLogo span:nth-child(5){color:#0F9D58}
.homeLogo span:nth-child(6){color:#DB4437}

.gsc-control-cse{
  border:none !important;
  padding:0 !important;
}

.gsc-search-button{
  display:none !important;
}
</style>

<script async src="https://cse.google.com/cse.js?cx=427c85c8321db4c63"></script>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.href='/'">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
  <div class="searchContainer">
    <input id="manualSearch" type="text" placeholder="Search Joogle..." style="width:100%;padding:10px 18px;border-radius:24px;border:1px solid #dadce0;font-size:16px;">
  </div>
</div>

<div class="home" id="homeSection">
  <div class="homeLogo">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
</div>

<div id="cseResults" style="max-width:900px;margin:20px auto;padding:0 20px;">
  <div class="gcse-searchresults-only"></div>
</div>

<script>

const LOCAL_KEYWORDS = [
  "near me","near","restaurants","restaurant",
  "coffee","gas","concert","concerts",
  "weather","directions","map","closest",
  "pizza","food","bars","library"
];

function shouldRedirect(query){
  const q = query.toLowerCase();
  return LOCAL_KEYWORDS.some(word => q.includes(word));
}

function runSearch(query){

  if(shouldRedirect(query)){
    window.location.href =
      "https://www.google.com/search?q=" + encodeURIComponent(query);
    return;
  }

  document.getElementById("homeSection").style.display="none";

  setTimeout(()=>{
    if(window.google && google.search && google.search.cse){
      google.search.cse.element.getElement("searchresults-only0").execute(query);
    }
  },400);
}

document.getElementById("manualSearch")
.addEventListener("keydown", function(e){
  if(e.key==="Enter"){
    runSearch(this.value.trim());
  }
});

</script>

</body>
</html>
