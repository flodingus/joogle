<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Joogle Preview</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#fff;
  font-family:Arial, Helvetica, sans-serif;
}

.logo{
  font-size:104px;
  font-weight:500;
  display:flex;
  align-items:baseline;
  letter-spacing:-3px;
}

.j{color:#4285F4;}
.o{color:#EA4335; position:relative; display:inline-block;}
.g{color:#4285F4;}
.l{color:#34A853;}
.e{color:#EA4335;}

/* SQUEEZE WITHOUT OVERLAP */
.o.left{ margin-right:-20px; }
.o.right{ margin-left:-20px; }

/* center dots */
.o::after{
  content:"";
  position:absolute;
  width:12px;
  height:12px;
  background:#EA4335;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* SYNCHRONIZED BOUNCE */
@keyframes bounce {
  0%,100% { transform:translateY(0); }
  40% { transform:translateY(-12px); }
  60% { transform:translateY(0); }
}

.o{
  animation:bounce 1.4s ease-in-out infinite;
}
</style>
</head>

<body>

<div class="logo">
  <span class="j">J</span>
  <span class="o left">O</span>
  <span class="o right">O</span>
  <span class="g">g</span>
  <span class="l">l</span>
  <span class="e">e</span>
</div>

</body>
</html>
