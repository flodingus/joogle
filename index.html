<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
:root{
  --bg:#ffffff;
  --text:#222;
  --card:#ffffff;
  --shadow:rgba(0,0,0,.15);
}

body.dark{
  --bg:#121212;
  --text:#e4e4e4;
  --card:#1e1e1e;
  --shadow:rgba(0,0,0,.6);
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  transition:.4s ease;
}

/* =========================
   LOCKED JOOGLE LOGO
========================= */

.logo{
  font-size:104px;
  font-weight:500;
  display:flex;
  align-items:baseline;
  margin-top:140px;
  margin-bottom:30px;
  transition:.5s ease;
}

.logo.shifted{
  margin-top:40px;
  transform:scale(.9);
}

.j{color:#4285F4;}
.g{color:#4285F4;}
.l{color:#34A853;}
.e{color:#EA4335;}

.oo-wrapper{
  display:flex;
  margin:0 6px;
  animation:bounce 1.6s ease-in-out infinite;
}

.o{
  width:54px;
  height:54px;
  border:8px solid #EA4335;
  border-radius:50%;
  background:#ffffff;
  position:relative;
  margin:0 -10px;
  transform:scaleX(0.88);
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  40%{transform:translateY(-8px);}
  60%{transform:translateY(0);}
}

/* ========================= */

.search-box{
  width:560px;
  max-width:90vw;
}

.search-box input{
  width:100%;
  padding:14px 20px;
  border-radius:24px;
  border:1px solid #ccc;
  font-size:16px;
}

.buttons{
  margin-top:24px;
}

.buttons button{
  background:#f8f9fa;
  border:1px solid #f8f9fa;
  padding:10px 18px;
  margin:0 6px;
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
}

body.dark .buttons button{
  background:#2a2a2a;
  border:1px solid #2a2a2a;
  color:#e4e4e4;
}

.results{
  display:none;
  width:95%;
  max-width:1200px;
  margin-top:30px;
  background:var(--card);
  border-radius:16px;
  box-shadow:0 20px 50px var(--shadow);
  padding:20px;
}

.map-container{
  width:100%;
  height:400px;
  margin-bottom:20px;
  border-radius:12px;
  overflow:hidden;
}

.weather-current{
  font-size:48px;
  font-weight:bold;
  margin:15px 0;
}

.forecast-row{
  display:flex;
  justify-content:space-between;
  flex-wrap:wrap;
}

.forecast-day{
  flex:1;
  min-width:100px;
  text-align:center;
  padding:10px;
}

/* Julie Mode */
body.julie-active{
  background:linear-gradient(-45deg,#fff0f5,#ffe4ec,#fff5f9,#ffe0f0);
  background-size:400% 400%;
  animation:gradientFlow 12s ease infinite;
}

@keyframes gradientFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

.julie-panel{
  display:none;
  margin-top:30px;
  text-align:center;
  max-width:700px;
}

.julie-panel img{
  max-width:100%;
  border-radius:12px;
  margin-top:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

.heart{
  position:fixed;
  bottom:-20px;
  font-size:18px;
  color:#ff4d88;
  animation:floatUp 6s linear infinite;
  opacity:.6;
  pointer-events:none;
}

@keyframes floatUp{
  0%{transform:translateY(0);opacity:.6;}
  100%{transform:translateY(-110vh);opacity:0;}
}

.toggle{
  position:fixed;
  top:20px;
  right:20px;
  cursor:pointer;
  font-size:18px;
  background:var(--card);
  padding:8px 12px;
  border-radius:20px;
  box-shadow:0 5px 15px var(--shadow);
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="toggle" onclick="toggleDark()">🌙</div>

<div class="logo" id="logo">
  <span class="j">J</span>
  <div class="oo-wrapper">
    <div class="o"></div>
    <div class="o"></div>
  </div>
  <span class="g">g</span>
  <span class="l">l</span>
  <span class="e">e</span>
</div>

<!-- Everything else below remains EXACTLY the same -->
