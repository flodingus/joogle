<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle Pro</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#ffffff;
  --text:#202124;
  --border:#dadce0;
  --link:#1a0dab;
  --card:#f8f9fa;
}
body.dark{
  --bg:#121212;
  --text:#e8e8e8;
  --border:#333;
  --link:#8ab4f8;
  --card:#1e1e1e;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* HEADER */
.header{
  display:flex;
  align-items:center;
  padding:15px 24px;
  border-bottom:1px solid var(--border);
  gap:10px;
}
.logo{
  font-size:26px;
  font-weight:bold;
  cursor:pointer;
}
.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.searchInput{
  flex:1;
  padding:10px 18px;
  border-radius:24px;
  border:1px solid var(--border);
  font-size:16px;
  background:var(--bg);
  color:var(--text);
}

.button{
  padding:8px 14px;
  border-radius:20px;
  border:1px solid var(--border);
  background:var(--card);
  cursor:pointer;
  transition:all .2s ease;
}
.button:hover{
  transform:translateY(-1px);
}

/* HERO */
.homeHero{
  height:60vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  transition:opacity .4s ease, transform .4s ease;
}
.heroLogo{
  font-size:100px;
  font-weight:bold;
  letter-spacing:-7px;
  cursor:pointer;
  transition:transform .2s ease;
  animation:glowPulse 3s infinite ease-in-out;
  user-select:none;
}
.heroLogo span:nth-child(1){color:#4285F4}
.heroLogo span:nth-child(2){color:#DB4437}
.heroLogo span:nth-child(3){color:#F4B400}
.heroLogo span:nth-child(4){color:#4285F4}
.heroLogo span:nth-child(5){color:#0F9D58}
.heroLogo span:nth-child(6){color:#DB4437}

.bounce{
  display:inline-block;
  animation:premiumBounce 2s infinite cubic-bezier(.28,.84,.42,1);
  transform-origin:bottom center;
}

@keyframes premiumBounce{
  0%{transform:translateY(0) scale(1,1);}
  15%{transform:translateY(-14px) scale(1.02,.98);}
  30%{transform:translateY(0) scale(.92,1.08);}
  40%{transform:translateY(-6px) scale(1.01,.99);}
  55%{transform:translateY(0) scale(.97,1.03);}
  70%{transform:translateY(-2px) scale(1,.995);}
  100%{transform:translateY(0) scale(1,1);}
}

@keyframes glowPulse{
  0%,100%{filter:drop-shadow(0 0 0px rgba(66,133,244,0));}
  50%{filter:drop-shadow(0 0 15px rgba(66,133,244,0.35));}
}

/* RESULTS */
.results{
  max-width:1000px;
  margin:20px auto;
  padding:0 20px;
}

.summaryCard{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}
.resultItem{margin-bottom:20px;}
.resultItem h3{color:var(--link);margin:0;}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.reload()">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>

  <form id="searchForm" style="flex:1;display:flex;gap:8px;">
    <input id="searchBox" class="searchInput" placeholder="Search Joogle...">
    <button class="button" type="submit">Search</button>
  </form>

  <button id="voiceBtn" class="button">🎙</button>
  <button id="darkToggle" class="button">🌙</button>
</div>

<div id="homeHero" class="homeHero">
  <div class="heroLogo">
    <span>J</span>
    <span class="bounce">o</span>
    <span class="bounce">o</span>
    <span>g</span>
    <span>l</span>
    <span>e</span>
  </div>

  <div style="margin-top:20px;display:flex;gap:10px;">
    <button id="searchBtnHero" class="button">Search Joogle</button>
    <button id="jooglyBtn" class="button">I'm Feeling Joogly</button>
  </div>
</div>

<div class="results" id="main"></div>

<script>
const PROXY_URL="https://joogle-proxy.flodingus.workers.dev";

/* DARK MODE */
document.getElementById("darkToggle").onclick=()=>{
  document.body.classList.toggle("dark");
};

/* FORM SUBMIT */
document.getElementById("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  performSearch(document.getElementById("searchBox").value);
});

document.getElementById("searchBtnHero").onclick=()=>{
  performSearch(document.getElementById("searchBox").value);
};

/* I'M FEELING JOOGLE */
document.getElementById("jooglyBtn").onclick=async()=>{
  const q=document.getElementById("searchBox").value || "random";
  const res=await fetch(PROXY_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({q})
  });
  const data=await res.json();
  if(data.organic && data.organic.length>0){
    window.location.href=data.organic[0].link;
  }
};

/* SEARCH */
async function performSearch(query){
  if(!query) return;

  const hero=document.getElementById("homeHero");
  hero.style.opacity="0";
  hero.style.transform="translateY(-20px)";
  setTimeout(()=>hero.style.display="none",400);

  document.getElementById("main").innerHTML="Loading...";

  const res=await fetch(PROXY_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({q:query})
  });

  const data=await res.json();

  let html="";
  if(data.organic){
    html+=`<div class="summaryCard">${data.organic[0].snippet}</div>`;
    data.organic.forEach(r=>{
      html+=`
        <div class="resultItem">
          <a href="${r.link}" target="_blank">
          <h3>${r.title}</h3></a>
          <p>${r.snippet}</p>
        </div>`;
    });
  }
  document.getElementById("main").innerHTML=html;
}
</script>

</body>
</html>
