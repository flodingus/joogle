<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  color:#202124;
}
.header{
  display:flex;
  align-items:center;
  padding:15px 24px;
  border-bottom:1px solid #dadce0;
}
.logo{
  font-size:26px;
  font-weight:bold;
  cursor:pointer;
  margin-right:30px;
}
.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}
.searchInput{
  flex:1;
  max-width:650px;
  padding:10px 18px;
  border-radius:24px;
  border:1px solid #dadce0;
  font-size:16px;
}
.home{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:75vh;
}
.homeLogo{
  font-size:90px;
  font-weight:bold;
  margin-bottom:30px;
}
.homeLogo span:nth-child(1){color:#4285F4}
.homeLogo span:nth-child(2){color:#DB4437}
.homeLogo span:nth-child(3){color:#F4B400}
.homeLogo span:nth-child(4){color:#4285F4}
.homeLogo span:nth-child(5){color:#0F9D58}
.homeLogo span:nth-child(6){color:#DB4437}
.results{
  max-width:900px;
  margin:20px auto;
  padding:0 20px;
}
.resultItem{
  margin-bottom:28px;
}
.resultItem h3{
  color:#1a0dab;
  margin:0;
}
.resultItem p{
  color:#4d5156;
  font-size:14px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.href='/'">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
  <input id="searchBox" class="searchInput" placeholder="Search Joogle...">
</div>

<div class="home" id="homeSection">
  <div class="homeLogo">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
</div>

<div class="results" id="results"></div>

<script>

const PROXY_URL = "https://joogle-proxy.flodingus.workers.dev/";

async function performSearch(query){
  if(!query) return;

  document.getElementById("homeSection").style.display="none";
  document.getElementById("results").innerHTML = "Loading...";

  const response = await fetch(PROXY_URL, {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({ q: query })
  });

  const data = await response.json();

  const resultsDiv = document.getElementById("results");
  resultsDiv.innerHTML = "";

  if(data.organic){
    data.organic.forEach(result => {

      const div = document.createElement("div");
      div.className = "resultItem";

      div.innerHTML = `
        <a href="${result.link}" target="_blank">
          <h3>${result.title}</h3>
        </a>
        <p>${result.snippet}</p>
      `;

      resultsDiv.appendChild(div);
    });
  } else {
    resultsDiv.innerHTML = "No results found.";
  }
}

document.addEventListener("DOMContentLoaded", function(){

  const input = document.getElementById("searchBox");

  input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      const query = input.value.trim();
      if(!query) return;
      window.history.pushState({}, "", "?q=" + encodeURIComponent(query));
      performSearch(query);
    }
  });

  const urlParams = new URLSearchParams(window.location.search);
  const q = urlParams.get("q");

  if(q){
    input.value = q;
    performSearch(q);
  }

});
</script>

</body>
</html>
