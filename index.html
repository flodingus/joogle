<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
:root{
  --bg:#ffffff;
  --text:#222;
  --card:#ffffff;
  --shadow:rgba(0,0,0,.15);
}

body.dark{
  --bg:#121212;
  --text:#e4e4e4;
  --card:#1e1e1e;
  --shadow:rgba(0,0,0,.6);
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  transition:.4s ease;
}

/* Julie Background */
body.julie-active{
  background:linear-gradient(-45deg,#fff0f5,#ffe4ec,#fff5f9,#ffe0f0);
  background-size:400% 400%;
  animation:gradientFlow 12s ease infinite;
}

@keyframes gradientFlow{
  0%{background-position:0% 50%}
  50%{background-position:100% 50%}
  100%{background-position:0% 50%}
}

/* Logo */
.logo{
  font-size:104px;
  font-weight:500;
  display:flex;
  align-items:baseline;
  margin-top:140px;
  margin-bottom:30px;
  transition:.5s ease;
}

.logo.shifted{
  margin-top:40px;
  transform:scale(.9);
}

.j{color:#4285F4;}
.g{color:#4285F4;}
.l{color:#34A853;}
.e{color:#EA4335;}

.oo-wrapper{
  display:flex;
  margin:0 6px;
  animation:bounce 1.6s ease-in-out infinite;
}

.o{
  width:54px;
  height:54px;
  border:8px solid #EA4335;
  border-radius:50%;
  background:white;
  position:relative;
  margin:0 -10px;
  transform:scaleX(0.88);
}

@keyframes bounce{
  0%,100%{transform:translateY(0);}
  40%{transform:translateY(-8px);}
  60%{transform:translateY(0);}
}

/* Search */
.search-box{
  width:560px;
  max-width:90vw;
}

.search-box input{
  width:100%;
  padding:14px 20px;
  border-radius:24px;
  border:1px solid #ccc;
  font-size:16px;
}

/* Results */
.results{
  display:none;
  width:95%;
  max-width:1200px;
  margin-top:30px;
  background:var(--card);
  border-radius:16px;
  box-shadow:0 20px 50px var(--shadow);
  padding:20px;
  animation:fadeIn .4s ease forwards;
}

@keyframes fadeIn{
  from{opacity:0; transform:translateY(15px);}
  to{opacity:1; transform:translateY(0);}
}

/* Map */
.map-container{
  width:100%;
  height:400px;
  margin-bottom:20px;
  border-radius:12px;
  overflow:hidden;
}

/* Julie Panel */
.julie-panel{
  display:none;
  margin-top:30px;
  text-align:center;
  max-width:700px;
}

.julie-panel img{
  max-width:100%;
  border-radius:12px;
  margin-top:15px;
  box-shadow:0 10px 30px rgba(0,0,0,.25);
}

/* Hearts */
.heart{
  position:fixed;
  bottom:-20px;
  font-size:18px;
  color:#ff4d88;
  animation:floatUp 6s linear infinite;
  opacity:.6;
  pointer-events:none;
}

@keyframes floatUp{
  0%{transform:translateY(0);opacity:.6;}
  100%{transform:translateY(-110vh);opacity:0;}
}

/* Dark Toggle */
.toggle{
  position:fixed;
  top:20px;
  right:20px;
  cursor:pointer;
  font-size:18px;
  background:var(--card);
  padding:8px 12px;
  border-radius:20px;
  box-shadow:0 5px 15px var(--shadow);
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="toggle" onclick="toggleDark()">🌙</div>

<div class="logo" id="logo">
  <span class="j">J</span>
  <div class="oo-wrapper">
    <div class="o"></div>
    <div class="o"></div>
  </div>
  <span class="g">g</span>
  <span class="l">l</span>
  <span class="e">e</span>
</div>

<div class="search-box">
  <input id="searchInput" type="text" placeholder="Search Joogle...">
</div>

<div class="results" id="resultsContainer"></div>

<div class="julie-panel" id="juliePanel">
  <h2 id="julieMessage"></h2>
  <img src="julie-denim.png">
  <iframe id="spotifyFrame"
    style="border-radius:12px;margin-top:15px;"
    src="https://open.spotify.com/embed/track/5nNmj1cLH3r4aA4XDJ2bgY?utm_source=generator"
    width="100%" height="80" frameborder="0"
    allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
  </iframe>
</div>

<div class="footer">Joogle Hybrid Engine – Phase 4 Complete</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

/* DARK MODE */
if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

function toggleDark(){
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",
    document.body.classList.contains("dark"));
}

document.getElementById("searchInput").addEventListener("keydown", e=>{
  if(e.key==="Enter") performSearch();
  if(e.key==="Escape") exitJulie();
});

const loveNotes=[
"Julie, every little thing you do is magic.",
"You light up rooms without trying.",
"You’re my favorite search result.",
"Everything is better with you."
];

function performSearch(){
  const query=document.getElementById("searchInput").value.trim().toLowerCase();

  if(query.match(/julie|christopher|chris/)){
    activateJulie();
    return;
  }

  if(query.match(/restaurant|coffee|gas|library|bar|grocery/)){
    handleNearMe();
    return;
  }

  if(query.includes("weather")){
    document.getElementById("resultsContainer").innerHTML="<h2>Weather Active (Phase 2 engine assumed)</h2>";
    showResults();
    return;
  }

  window.location.href="https://www.google.com/search?q="+encodeURIComponent(query);
}

/* JULIE MODE */
let heartInterval;

function activateJulie(){
  hideResults();
  document.body.classList.add("julie-active");
  document.getElementById("juliePanel").style.display="block";
  document.getElementById("julieMessage").innerText=
    loveNotes[Math.floor(Math.random()*loveNotes.length)];

  heartInterval=setInterval(()=>{
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerHTML="❤";
    heart.style.left=Math.random()*100+"vw";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
  },600);
}

function exitJulie(){
  document.body.classList.remove("julie-active");
  document.getElementById("juliePanel").style.display="none";
  clearInterval(heartInterval);
}

/* NEAR ME placeholder */
function handleNearMe(){
  showResults();
  document.getElementById("resultsContainer").innerHTML="<h2>Near Me Active</h2>";
}

/* UI */
function showResults(){
  document.getElementById("resultsContainer").style.display="block";
  document.getElementById("logo").classList.add("shifted");
}

function hideResults(){
  document.getElementById("resultsContainer").style.display="none";
  document.getElementById("logo").classList.remove("shifted");
}

</script>

</body>
</html>
