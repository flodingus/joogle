<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#202124;
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  flex:1;
}

.logo{
  font-size:80px;
  font-weight:bold;
  margin-bottom:20px;
}

.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.search{
  width:600px;
  max-width:90%;
  padding:14px 20px;
  font-size:16px;
  border:1px solid #dadce0;
  border-radius:999px;
  outline:none;
}

.search:focus{
  box-shadow:0 0 0 2px rgba(66,133,244,.3);
}

.buttons{
  margin-top:20px;
}

button{
  margin:0 6px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}

button:hover{
  background:#f1f3f4;
}
footer{
  text-align:center;
  padding:20px;
  font-size:12px;
  color:#5f6368;
}
</style>
</head>

<body>

<div class="center">

  <div class="logo">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>

  <form id="searchForm">
    <input id="searchInput" class="search" type="text" placeholder="Search Joogle..." autocomplete="off">
  </form>

  <div class="buttons">
    <button onclick="doSearch()">Joogle Search</button>
    <button onclick="doSearch(true)">I'm Feeling Lucky</button>
  </div>

</div>

<footer>
  Joogle is a parody search engine. Results powered by Google.
</footer>

<script>
function doSearch(lucky=false){
  const query = document.getElementById("searchInput").value.trim();
  if(!query) return;

  if(lucky){
    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query) + "&btnI=1";
  }else{
    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query);
  }
}

document.getElementById("searchForm").addEventListener("submit", function(e){
  e.preventDefault();
  doSearch();
});
</script>

</body>
</html>
