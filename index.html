<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle</title>

<link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text y='.9em' font-size='90'>💙</text>
</svg>">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#202124;
  transition:all .6s ease;
}

.header{
  padding:15px 24px;
  border-bottom:1px solid #dadce0;
}

.logo{
  font-size:26px;
  font-weight:bold;
  letter-spacing:-2px;
  cursor:pointer;
}

.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.hero{
  height:60vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.heroLogo{
  font-size:100px;
  font-weight:bold;
  letter-spacing:-8px;
}

.heroLogo span:nth-child(1){color:#4285F4}
.heroLogo span:nth-child(2){color:#DB4437}
.heroLogo span:nth-child(3){color:#F4B400}
.heroLogo span:nth-child(4){color:#4285F4}
.heroLogo span:nth-child(5){color:#0F9D58}
.heroLogo span:nth-child(6){color:#DB4437}

.bounce{
  display:inline-block;
  animation:premiumBounce 2.4s infinite cubic-bezier(.28,.84,.42,1);
}

@keyframes premiumBounce{
  0%,100%{transform:translateY(0) scaleX(1) scaleY(1);}
  25%{transform:translateY(-10px) scaleX(1.02) scaleY(.98);}
  40%{transform:translateY(0) scaleX(.96) scaleY(1.05);}
  55%{transform:translateY(-4px) scaleX(1.01) scaleY(.99);}
  70%{transform:translateY(0);}
}

.searchArea{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.searchInput{
  width:420px;
  max-width:90vw;
  padding:12px 18px;
  border-radius:24px;
  border:1px solid #dadce0;
  font-size:16px;
}

.button{
  padding:10px 16px;
  border-radius:20px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  cursor:pointer;
}

.results{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

.resultItem{
  margin-bottom:24px;
}

.resultItem h3{
  margin:0;
  color:#1a0dab;
}

/* JULIE CINEMATIC MODE */

.julieMode{
  background:linear-gradient(135deg,#ffdde1,#ee9ca7);
  overflow:hidden;
}

.loveContainer{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  animation:fadeIn 1.5s ease;
  text-align:center;
}

.loveMessage{
  font-size:48px;
  font-weight:bold;
  color:white;
  text-shadow:0 0 20px rgba(255,255,255,0.8);
  animation:glow 2s infinite alternate;
}

.loveNote{
  font-size:22px;
  margin-top:25px;
  color:white;
}

.signature{
  margin-top:30px;
  opacity:.8;
  color:white;
}

@keyframes glow{
  from{ text-shadow:0 0 10px rgba(255,255,255,0.6);}
  to{ text-shadow:0 0 30px rgba(255,255,255,1);}
}

@keyframes fadeIn{
  from{opacity:0;transform:scale(0.95);}
  to{opacity:1;transform:scale(1);}
}

/* floating hearts */

.heart{
  position:absolute;
  bottom:-50px;
  font-size:24px;
  animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
  0%{transform:translateY(0);opacity:1;}
  100%{transform:translateY(-110vh);opacity:0;}
}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.reload()">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
</div>

<div id="hero" class="hero">
  <div class="heroLogo">
    <span>J</span>
    <span class="bounce">o</span>
    <span class="bounce">o</span>
    <span>g</span>
    <span>l</span>
    <span>e</span>
  </div>

  <form id="searchForm" class="searchArea">
    <input id="searchBox" class="searchInput" placeholder="Search Joogle..." />
    <button class="button" type="submit">Joogle Search</button>
    <button class="button" type="button" onclick="feelingJoogly()">I'm Feeling Joogly</button>
  </form>
</div>

<div id="main" class="results"></div>

<script>

document.getElementById("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  performSearch(searchBox.value.trim());
});

function feelingJoogly(){
  const val=searchBox.value.trim();
  if(val) window.open("https://www.google.com/search?q="+encodeURIComponent(val));
}

function spawnHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.style.left=Math.random()*100+"vw";
  heart.style.animationDuration=(4+Math.random()*4)+"s";
  heart.innerHTML="💙";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),8000);
}

async function performSearch(query){

  if(!query) return;
  const q=query.toLowerCase();

  if(q.includes("julie")){

    document.body.classList.add("julieMode");
    hero.style.display="none";

    const notes=[
      "You are my favorite thing to Joogle.",
      "If loving you was a search, I'd never hit enter.",
      "You are my homepage.",
      "You are my favorite result.",
      "Every search ends with you."
    ];

    const randomNote=notes[Math.floor(Math.random()*notes.length)];

    main.innerHTML=`
      <div class="loveContainer">
        <div class="loveMessage">💙 Julie 💙</div>
        <div class="loveNote">${randomNote}</div>
        <div class="signature">— Love, always.</div>
        <audio autoplay loop>
          <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b63c9b2a.mp3?filename=romantic-piano-110624.mp3" type="audio/mpeg">
        </audio>
      </div>
    `;

    setInterval(spawnHeart,500);
    return;
  }

  main.innerHTML="Search disabled in this demo build.";
}

</script>

</body>
</html>
