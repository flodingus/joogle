<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family: Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  justify-content:center;
  align-items:center;
}

/* LOGO */
.logo{
  font-size:96px;
  font-weight:500;
  display:flex;
  align-items:baseline;
  letter-spacing:-4px;
  margin-bottom:30px;
}

/* Google colors */
.j{color:#4285F4;}
.o{color:#EA4335;}
.g{color:#4285F4;}
.l{color:#34A853;}
.e{color:#EA4335;}

/* Cleavage squeeze */
.o.left{
  transform:scaleX(0.88);
  display:inline-block;
  margin-right:-6px;
}

.o.right{
  transform:scaleX(0.88);
  display:inline-block;
  margin-left:-6px;
}

/* SEARCH */
.search-box{
  width:560px;
  max-width:90vw;
}

.search-box input{
  width:100%;
  padding:14px 20px;
  border-radius:24px;
  border:1px solid #dcdcdc;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  box-shadow:0 1px 6px rgba(32,33,36,.28);
  border-color:rgba(223,225,229,0);
}

/* BUTTONS */
.buttons{
  margin-top:28px;
}

.buttons button{
  background:#f8f9fa;
  border:1px solid #f8f9fa;
  padding:10px 18px;
  margin:0 6px;
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
}

.buttons button:hover{
  border:1px solid #dadce0;
  box-shadow:0 1px 1px rgba(0,0,0,.1);
}

/* FOOTER */
.footer{
  position:absolute;
  bottom:20px;
  font-size:13px;
  color:#777;
}

/* Mobile */
@media(max-width:600px){
  .logo{font-size:64px;}
}
</style>
</head>

<body>

<div class="logo">
  <span class="j">J</span>
  <span class="o left">O</span>
  <span class="o right">O</span>
  <span class="g">g</span>
  <span class="l">l</span>
  <span class="e">e</span>
</div>

<div class="search-box">
  <input type="text" placeholder="Search Joogle...">
</div>

<div class="buttons">
  <button>Joogle Search</button>
  <button>I'm Feeling Joogly</button>
</div>

<div class="footer">
  Joogle is a parody project created with love.
</div>

</body>
</html>
