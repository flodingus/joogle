<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Joogle</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  margin:0;
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  text-align:center;
  transition:background .4s ease;
}

/* ========================= */
/* 🔒 LOCKED LOGO — DO NOT TOUCH */
/* ========================= */

.logo {
  margin-top:120px;
  font-size:90px;
  font-weight:bold;
  letter-spacing:-4px;
}

.logo .j { color:#4285F4; }
.logo .g { color:#4285F4; }
.logo .l { color:#34A853; }
.logo .e { color:#EA4335; }

.o-wrap {
  display:inline-block;
  position:relative;
  width:110px;
  height:72px;
  margin:0 -10px;
}

.o {
  width:68px;
  height:68px;
  border:8px solid #EA4335;
  border-radius:50%;
  position:absolute;
  top:0;
  background:white;
}

.o.left { left:0; }
.o.right { left:42px; }

/* ========================= */

.search-box {
  margin-top:40px;
}

input {
  width:500px;
  max-width:90%;
  padding:15px;
  border-radius:25px;
  border:1px solid #ccc;
  font-size:16px;
}

.buttons {
  margin-top:20px;
}

button {
  padding:10px 20px;
  margin:5px;
  border:none;
  background:#f8f9fa;
  border-radius:5px;
  cursor:pointer;
}

button:hover {
  background:#e8e8e8;
}

#weatherBox {
  margin-top:40px;
  font-size:18px;
}

.julie-mode {
  background:linear-gradient(to bottom, #ffd6e8, #fff);
}

.julie-panel {
  margin:50px auto;
  max-width:700px;
  background:white;
  padding:40px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
  display:none;
}

.julie-note {
  font-size:26px;
  color:#d63384;
  margin-bottom:20px;
}

.spotify-embed {
  margin-top:20px;
}

.julie-img {
  width:100%;
  border-radius:15px;
  margin-top:20px;
}

.heart {
  position:fixed;
  font-size:20px;
  animation:float 6s linear infinite;
  pointer-events:none;
}

@keyframes float {
  from { transform:translateY(100vh); opacity:1; }
  to { transform:translateY(-10vh); opacity:0; }
}
</style>
</head>
<body>

<div class="logo">
  <span class="j">J</span>
  <span class="o-wrap">
    <div class="o left"></div>
    <div class="o right"></div>
  </span>
  <span class="g">g</span>
  <span class="l">l</span>
  <span class="e">e</span>
</div>

<div class="search-box">
  <input id="searchInput" placeholder="Search Joogle...">
</div>

<div class="buttons">
  <button onclick="handleSearch()">Joogle Search</button>
  <button onclick="activateJulieMode()">I'm Feeling Joogly</button>
</div>

<div id="weatherBox"></div>

<div class="julie-panel" id="juliePanel">
  <div class="julie-note" id="julieNote"></div>

  <div class="spotify-embed">
    <iframe style="border-radius:12px"
      src="https://open.spotify.com/embed/track/2qG3T0rV8kCzFZp2uF5nKf"
      width="100%" height="80"
      frameborder="0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture">
    </iframe>
  </div>

  <img src="80sjulie.png" class="julie-img">
</div>

<script>
const loveNotes = [
"You make ordinary days feel extraordinary.",
"Denim & dreams never looked so good.",
"I still get butterflies.",
"You are magic.",
"You are my favorite hello."
];

document.getElementById("searchInput").addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    handleSearch();
  }
});

function handleSearch() {
  if(document.body.classList.contains("julie-mode")) return;

  const query = document.getElementById("searchInput").value.trim();
  if(!query) return;

  if(query.toLowerCase() === "weather"){
    detectWeather();
    return;
  }

  if(query.toLowerCase().includes("weather")){
    getWeatherFromQuery(query);
    return;
  }

  window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query);
}

function activateJulieMode() {
  document.body.classList.add("julie-mode");
  document.getElementById("juliePanel").style.display = "block";
  document.getElementById("julieNote").innerText =
    loveNotes[Math.floor(Math.random()*loveNotes.length)];

  spawnHearts();
}

function spawnHearts(){
  for(let i=0;i<15;i++){
    const heart=document.createElement("div");
    heart.className="heart";
    heart.innerText="❤";
    heart.style.left=Math.random()*100+"vw";
    heart.style.animationDuration=(3+Math.random()*3)+"s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),6000);
  }
}

async function detectWeather(){
  if(!navigator.geolocation) return;

  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;

    const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min&current_weather=true&timezone=auto`);
    const data=await res.json();
    showWeather(data,"Your Location");
  });
}

async function getWeatherFromQuery(query){
  const location=query.replace("weather","").trim();

  const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${location}`);
  const geoData=await geo.json();
  if(!geoData.results) return;

  const {latitude,longitude,name,country}=geoData.results[0];

  const res=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max,temperature_2m_min&current_weather=true&timezone=auto`);
  const data=await res.json();
  showWeather(data,name+", "+country);
}

function showWeather(data,location){
  let html=`<h3>Weather for ${location}</h3>`;
  html+=`<p>Current: ${data.current_weather.temperature}°C</p>`;
  html+="<h4>5 Day Forecast:</h4>";

  for(let i=0;i<5;i++){
    html+=`<p>Day ${i+1}: High ${data.daily.temperature_2m_max[i]}°C / Low ${data.daily.temperature_2m_min[i]}°C</p>`;
  }

  document.getElementById("weatherBox").innerHTML=html;
}
</script>

</body>
</html>
