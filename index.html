<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Joogle</title>

  <!-- Performance -->
  <link rel="preconnect" href="https://cse.google.com" />
  <link rel="preconnect" href="https://www.google.com" />
  <link rel="preconnect" href="https://suggestqueries.google.com" />
  <link rel="preconnect" href="https://nominatim.openstreetmap.org" />
  <link rel="preconnect" href="https://api.open-meteo.com" />
  <link rel="preconnect" href="https://overpass-api.de" />
  <link rel="preconnect" href="https://tile.openstreetmap.org" />

  <!-- Leaflet (open-source map library) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root{
      --bg:#fff; --text:#202124; --muted:#5f6368; --card:#fff; --border:#dfe1e5;
      --shadow:0 1px 6px rgba(32,33,36,.28);
      --btn:#f8f9fa; --btnText:#3c4043; --btnBorder:#dadce0;
      --hover:rgba(60,64,67,.08);
      --link:#1a0dab; --visited:#681da8;
    }
    body.dark{
      --bg:#202124; --text:#e8eaed; --muted:#9aa0a6; --card:#303134; --border:#5f6368;
      --shadow:0 1px 10px rgba(0,0,0,.6);
      --btn:#303134; --btnText:#e8eaed; --btnBorder:#5f6368;
      --hover:rgba(232,234,237,.08);
      --link:#8ab4f8; --visited:#c58af9;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    .topbar{height:56px;display:flex;justify-content:flex-end;align-items:center;padding:0 16px}
    .icon-btn{width:38px;height:38px;border-radius:999px;border:0;background:transparent;color:var(--text);cursor:pointer}
    .icon-btn:hover{background:var(--hover)}
    .wrap{max-width:980px;margin:0 auto;padding:0 16px 40px}

    .logo{text-align:center;font-size:84px;font-weight:700;letter-spacing:-1px;margin-top:56px;user-select:none}
    .logo span:nth-child(1){color:#4285f4}
    .logo span:nth-child(2){color:#ea4335}
    .logo span:nth-child(3){color:#fbbc05}
    .logo span:nth-child(4){color:#4285f4}
    .logo span:nth-child(5){color:#34a853}
    .logo span:nth-child(6){color:#ea4335}

    form.search-area{margin-top:22px;position:relative}
    .searchbar{
      display:flex;align-items:center;gap:10px;width:100%;
      padding:12px 14px;border-radius:999px;border:1px solid var(--border);
      background:var(--card);transition:.15s;
    }
    .searchbar:hover,.searchbar:focus-within{box-shadow:var(--shadow);border-color:transparent}
    input[type="search"]{
      flex:1;border:0;outline:0;font-size:16px;background:transparent;color:var(--text);min-width:0
    }

    #suggestions{
      position:absolute;left:0;right:0;top:54px;
      background:var(--card);border:1px solid var(--border);border-top:none;
      border-radius:0 0 20px 20px;overflow:hidden;box-shadow:var(--shadow);
      z-index:50;display:none;
    }
    .sugg{padding:10px 16px;cursor:pointer}
    .sugg:hover{background:var(--hover)}

    .actions{margin-top:16px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    .btn{
      padding:10px 16px;border-radius:4px;border:1px solid var(--btnBorder);
      background:var(--btn);color:var(--btnText);cursor:pointer;font-size:14px
    }
    .btn:hover{box-shadow:0 1px 1px rgba(0,0,0,.1)}

    .module{
      margin-top:18px;
      background:var(--card);
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow:0 1px 2px rgba(0,0,0,.06);
      padding:14px;
      display:none;
    }
    .module.show{display:block}
    .module h2{margin:0 0 8px;font-size:16px}
    .statusline{margin-top:8px;color:var(--muted);font-size:13px;min-height:18px}

    .pill-link{
      display:inline-block;
      padding:10px 12px;
      border-radius:999px;
      border:1px solid var(--btnBorder);
      background:var(--btn);
      color:var(--btnText);
      text-decoration:none;
      font-size:14px;
      cursor:pointer;
    }
    .pill-link:hover{box-shadow:0 1px 1px rgba(0,0,0,.1)}

    /* Weather */
    .weather-grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:10px}
    @media (min-width: 720px){ .weather-grid{grid-template-columns: 1.1fr .9fr;} }
    .weather-main{
      display:flex;align-items:center;justify-content:space-between;gap:12px;
      padding:10px;border:1px solid var(--border);border-radius:12px;
    }
    .weather-loc{font-weight:700;font-size:14px;margin-bottom:2px}
    .weather-desc{color:var(--muted);font-size:13px}
    .weather-temp{font-size:36px;font-weight:700;white-space:nowrap}
    .weather-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;color:var(--muted);font-size:13px}
    .wxchip{border:1px solid var(--border);border-radius:999px;padding:4px 10px}

    .forecast{
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px;
    }
    .forecast-title{font-weight:700;font-size:14px;margin:0 0 8px}
    .forecast-row{
      display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);
      font-size:13px;color:var(--text);
    }
    .forecast-row:first-of-type{border-top:0}
    .fmuted{color:var(--muted)}

    .hourly{
      margin-top:10px;border:1px solid var(--border);border-radius:12px;padding:10px;overflow:auto
    }
    .hourly-title{font-weight:700;font-size:14px;margin:0 0 8px}
    .hourly-strip{display:flex;gap:10px;min-width:max-content;padding-bottom:4px}
    .hour{border:1px solid var(--border);border-radius:12px;padding:8px 10px;min-width:92px;text-align:center}
    .hour .t{font-size:12px;color:var(--muted);margin-bottom:6px;white-space:nowrap}
    .hour .icon{font-size:18px;margin-bottom:4px}
    .hour .temp{font-weight:700;font-size:14px}
    .hour .pop{font-size:12px;color:var(--muted);margin-top:4px}

    /* Local (Map + List) */
    .local-grid{display:grid;grid-template-columns: 1fr; gap:10px; margin-top:10px}
    @media (min-width: 900px){ .local-grid{grid-template-columns: 1.2fr .8fr;} }
    #localMap{height:420px;border:1px solid var(--border);border-radius:12px;overflow:hidden}
    @media (min-width: 900px){ #localMap{height:520px;} }
    .placesPanel{border:1px solid var(--border);border-radius:12px;padding:10px;max-height:520px;overflow:auto}
    .placeCard{
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px;
      cursor:pointer;
      margin-bottom:10px;
    }
    .placeCard:hover{background:var(--hover)}
    .placeName{font-weight:700;margin-bottom:4px}
    .placeMeta{color:var(--muted);font-size:13px;line-height:1.35}
    .badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:2px 8px;font-size:12px;color:var(--muted);margin-right:6px;margin-top:6px}

    /* CSE polish */
    #resultsWrap{margin-top:18px}
    .gsc-search-box{display:none !important;}
    .gsc-control-cse{padding:0 !important;border:0 !important;background:transparent !important}
    .gsc-webResult.gsc-result{
      background:var(--card) !important;border:1px solid var(--border) !important;border-radius:14px !important;
      padding:14px 16px !important;margin-bottom:12px !important;transition:.18s;
    }
    .gsc-webResult.gsc-result:hover{box-shadow:var(--shadow) !important}
    a.gs-title, a.gs-title:link{color:var(--link) !important;text-decoration:none !important}
    a.gs-title:visited{color:var(--visited) !important}
    .gs-snippet{color:var(--text) !important;opacity:.92}
    .gs-visibleUrl{color:var(--muted) !important}

    @media (max-width:480px){
      .logo{font-size:64px;margin-top:40px}
      #suggestions{top:52px}
      .weather-temp{font-size:32px}
      .hour{min-width:86px}
    }
  </style>
</head>

<body>
  <div class="topbar">
    <button class="icon-btn" id="darkToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  </div>

  <div class="wrap">
    <div class="logo" aria-label="Joogle">
      <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>

    <!-- Bulletproof core search -->
    <form class="search-area" id="searchForm" method="GET" action="/">
      <div class="searchbar">
        <input id="q" name="q" type="search" placeholder="Search the web" autocomplete="off" spellcheck="false" />
      </div>

      <div id="suggestions" role="listbox" aria-label="Suggestions"></div>

      <div class="actions">
        <button class="btn" type="submit">Joogle Search</button>
        <button class="btn" type="button" id="luckyBtn">I’m Feeling Joogly</button>
      </div>

      <!-- WEATHER -->
      <div class="module" id="weatherModule">
        <h2>Weather</h2>

        <div class="weather-grid">
          <div>
            <div class="weather-main">
              <div style="min-width:0">
                <div class="weather-loc" id="wxLoc">—</div>
                <div class="weather-desc" id="wxDesc">—</div>
                <div class="weather-meta" id="wxMeta"></div>
              </div>
              <div class="weather-temp" id="wxTemp">—</div>
            </div>

            <div class="statusline" id="wxStatus"></div>

            <div class="hourly">
              <div class="hourly-title">Next 12 hours</div>
              <div class="hourly-strip" id="wxHourly"></div>
            </div>
          </div>

          <div class="forecast">
            <div class="forecast-title">Next 3 days</div>
            <div id="wxForecast"></div>
          </div>
        </div>

        <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
          <a class="pill-link" id="wxOpen" target="_blank" rel="noopener">Open full forecast</a>
        </div>
      </div>

      <!-- LOCAL MAP + PLACES (OpenStreetMap/Overpass) -->
      <div class="module" id="localModule">
        <h2 id="localTitle">Nearby</h2>

        <div class="local-grid">
          <div id="localMap"></div>
          <div class="placesPanel">
            <div class="statusline" id="localStatus">—</div>
            <div id="placesList"></div>
            <div style="margin-top:10px; display:flex; gap:10px; flex-wrap:wrap;">
              <button class="btn" type="button" id="useMyLocationBtn">Use my location</button>
              <a class="pill-link" id="openMapsBtn" target="_blank" rel="noopener">Open in OSM</a>
            </div>
          </div>
        </div>
      </div>

      <!-- Web results -->
      <div id="resultsWrap">
        <div id="cse-results"></div>
      </div>
    </form>
  </div>

  <script>
    /*****************
     * CONFIG
     *****************/
    const CX = "427c85c8321db4c63";

    // Hide junk domains from web results
    const BLOCKED_DOMAINS = ["pinterest.","quora.","brainly.","answers.com","chegg.","coursehero.","scribd.com"];

    // Overpass endpoints (fallback if one is slow/busy)
    const OVERPASS_ENDPOINTS = [
      "https://overpass-api.de/api/interpreter",
      "https://lz4.overpass-api.de/api/interpreter",
      "https://z.overpass-api.de/api/interpreter"
    ];

    // OSM tile layer (fine for light use; if you grow, switch to a hosted tile provider)
    const OSM_TILES = "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png";

    /*****************
     * DARK MODE
     *****************/
    const darkToggle = document.getElementById("darkToggle");
    function setDark(on){
      document.body.classList.toggle("dark", !!on);
      localStorage.setItem("joogle_dark", on ? "1" : "0");
      darkToggle.textContent = on ? "☀️" : "🌙";
    }
    setDark(localStorage.getItem("joogle_dark") === "1");
    darkToggle.addEventListener("click", ()=>setDark(!document.body.classList.contains("dark")));

    /*****************
     * QUERY HYDRATE
     *****************/
    const qEl = document.getElementById("q");
    const params = new URLSearchParams(location.search);
    const queryFromUrl = (params.get("q") || "").trim();
    if(queryFromUrl) qEl.value = queryFromUrl;

    /*****************
     * LUCKY
     *****************/
    document.getElementById("luckyBtn").addEventListener("click", ()=>{
      const q = qEl.value.trim();
      if(!q){ qEl.focus(); return; }
      location.href = "https://www.google.com/search?q=" + encodeURIComponent(q) + "&btnI=1";
    });

    /*****************
     * SUGGESTIONS
     *****************/
    const suggestions = document.getElementById("suggestions");
    let suggAbort = null, suggTimer = null;

    function closeSuggestions(){ suggestions.style.display="none"; suggestions.innerHTML=""; }
    function openSuggestions(){ if(suggestions.children.length) suggestions.style.display="block"; }

    qEl.addEventListener("input", ()=>{
      const q = qEl.value.trim();
      clearTimeout(suggTimer);
      if(!q){ closeSuggestions(); return; }

      suggTimer = setTimeout(async ()=>{
        try{
          if(suggAbort) suggAbort.abort();
          suggAbort = new AbortController();
          const url = "https://suggestqueries.google.com/complete/search?client=firefox&q=" + encodeURIComponent(q);
          const res = await fetch(url, { signal: suggAbort.signal });
          const data = await res.json();
          const list = (data && data[1]) ? data[1].slice(0,8) : [];

          suggestions.innerHTML="";
          list.forEach(text=>{
            const div = document.createElement("div");
            div.className="sugg";
            div.textContent=text;
            div.addEventListener("mousedown",(e)=>e.preventDefault());
            div.addEventListener("click", ()=>{
              qEl.value = text;
              closeSuggestions();
              document.getElementById("searchForm").requestSubmit();
            });
            suggestions.appendChild(div);
          });
          openSuggestions();
        }catch(e){}
      }, 120);
    });

    document.addEventListener("click",(e)=>{
      if(!document.querySelector(".search-area").contains(e.target)) closeSuggestions();
    });
    qEl.addEventListener("keydown",(e)=>{ if(e.key==="Escape") closeSuggestions(); });

    /*****************
     * CSE RENDER
     *****************/
    window.__gcse = {
      callback: function(){
        try{
          google.search.cse.element.render({
            div: "cse-results",
            tag: "searchresults-only",
            attributes: { queryParameterName: "q" }
          });
        }catch(e){}
      }
    };
    (function loadCSE(){
      const s = document.createElement("script");
      s.async = true;
      s.src = "https://cse.google.com/cse.js?cx=" + encodeURIComponent(CX);
      document.head.appendChild(s);
    })();

    /*****************
     * SPAM FILTER (web results)
     *****************/
    function filterResults(){
      document.querySelectorAll(".gsc-webResult.gsc-result, .gsc-result").forEach(el=>{
        const a = el.querySelector("a");
        if(!a || !a.href) return;
        const href = a.href.toLowerCase();
        if(BLOCKED_DOMAINS.some(d => href.includes(d))) el.style.display="none";
      });
    }
    new MutationObserver(()=>filterResults()).observe(document.documentElement,{childList:true,subtree:true});

    /*****************
     * CLEAN #gsc HASH
     *****************/
    (function cleanGscHash(){
      const strip = () => {
        if (location.hash && location.hash.startsWith("#gsc.")) {
          history.replaceState({}, "", location.pathname + location.search);
        }
      };
      window.addEventListener("hashchange", strip);
      strip();
    })();

    /*****************
     * WEATHER (Open-Meteo + Nominatim) + hourly + humidity + precip prob
     *****************/
    const weatherModule = document.getElementById("weatherModule");
    const wxLoc = document.getElementById("wxLoc");
    const wxDesc = document.getElementById("wxDesc");
    const wxTemp = document.getElementById("wxTemp");
    const wxMeta = document.getElementById("wxMeta");
    const wxForecast = document.getElementById("wxForecast");
    const wxStatus = document.getElementById("wxStatus");
    const wxOpen = document.getElementById("wxOpen");
    const wxHourly = document.getElementById("wxHourly");

    function isWeatherQuery(q){
      return /\b(weather|forecast)\b/i.test(q);
    }
    function parseWeatherPlace(q){
      let s = q.trim();
      s = s.replace(/^\s*(weather|forecast)\s*/i, "");
      s = s.replace(/^\s*(in|for|at)\s+/i, "");
      return s.trim();
    }

    function wxCodeToText(code){
      const map = new Map([
        [0,"Clear sky"],[1,"Mainly clear"],[2,"Partly cloudy"],[3,"Overcast"],
        [45,"Fog"],[48,"Rime fog"],
        [51,"Light drizzle"],[53,"Moderate drizzle"],[55,"Dense drizzle"],
        [56,"Freezing drizzle"],[57,"Dense freezing drizzle"],
        [61,"Slight rain"],[63,"Moderate rain"],[65,"Heavy rain"],
        [66,"Freezing rain"],[67,"Heavy freezing rain"],
        [71,"Slight snow"],[73,"Moderate snow"],[75,"Heavy snow"],
        [77,"Snow grains"],
        [80,"Rain showers"],[81,"Heavy showers"],[82,"Violent showers"],
        [85,"Snow showers"],[86,"Heavy snow showers"],
        [95,"Thunderstorm"],[96,"Thunderstorm w/ hail"],[99,"Thunderstorm w/ heavy hail"]
      ]);
      return map.get(code) || "Weather";
    }
    function codeToEmoji(code){
      if(code === 0) return "☀️";
      if(code >= 1 && code <= 3) return "⛅";
      if(code === 45 || code === 48) return "🌫️";
      if((code >= 51 && code <= 57) || (code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return "🌧️";
      if((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return "🌨️";
      if(code >= 95) return "⛈️";
      return "🌡️";
    }
    function chip(label, value){
      const span = document.createElement("span");
      span.className = "wxchip";
      span.textContent = `${label}: ${value}`;
      return span;
    }
    function fmtDay(isoDate){
      try{
        const d = new Date(isoDate + "T00:00:00");
        return d.toLocaleDateString(undefined, { weekday: "short" });
      }catch{ return isoDate; }
    }
    function fmtHour(isoDT){
      try{
        const d = new Date(isoDT);
        return d.toLocaleTimeString(undefined, { hour: "numeric" });
      }catch{ return isoDT; }
    }
    async function geocodePlace(place){
      const url = new URL("https://nominatim.openstreetmap.org/search");
      url.searchParams.set("q", place);
      url.searchParams.set("format", "json");
      url.searchParams.set("limit", "1");
      url.searchParams.set("addressdetails", "1");
      const res = await fetch(url.toString(), { headers: { "Accept": "application/json" } });
      if(!res.ok) throw new Error("Geocode failed");
      const data = await res.json();
      if(!Array.isArray(data) || !data.length) throw new Error("No geocode results");
      return { lat: Number(data[0].lat), lon: Number(data[0].lon), label: data[0].display_name };
    }
    async function getBrowserLocation(){
      return new Promise((resolve, reject)=>{
        if(!navigator.geolocation) return reject(new Error("No geolocation"));
        navigator.geolocation.getCurrentPosition(
          (pos)=>resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, label: "Your location" }),
          (err)=>reject(err),
          { enableHighAccuracy:false, timeout:8000 }
        );
      });
    }
    async function fetchWeather(lat, lon){
      const url = new URL("https://api.open-meteo.com/v1/forecast");
      url.searchParams.set("latitude", lat);
      url.searchParams.set("longitude", lon);
      url.searchParams.set("current", "temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m");
      url.searchParams.set("hourly", "temperature_2m,weather_code,precipitation_probability");
      url.searchParams.set("daily", "weather_code,temperature_2m_max,temperature_2m_min");
      url.searchParams.set("temperature_unit", "fahrenheit");
      url.searchParams.set("wind_speed_unit", "mph");
      url.searchParams.set("timezone", "auto");
      url.searchParams.set("forecast_days", "3");
      const res = await fetch(url.toString(), { headers: { "Accept": "application/json" } });
      if(!res.ok) throw new Error("Weather fetch failed");
      return await res.json();
    }

    async function renderWeatherForQuery(fullQuery){
      if(!isWeatherQuery(fullQuery)) { weatherModule.classList.remove("show"); return; }

      weatherModule.classList.add("show");
      wxStatus.textContent = "Loading weather…";
      wxForecast.innerHTML = "";
      wxMeta.innerHTML = "";
      wxHourly.innerHTML = "";
      wxTemp.textContent = "—";
      wxDesc.textContent = "—";
      wxLoc.textContent = "—";
      wxOpen.href = "https://www.google.com/search?q=" + encodeURIComponent(fullQuery);

      const placeRaw = parseWeatherPlace(fullQuery);
      let loc;

      try{
        if(/\bnear me\b/i.test(fullQuery) || !placeRaw || placeRaw.toLowerCase()==="near me" || placeRaw.toLowerCase()==="nearby"){
          loc = await getBrowserLocation();
        } else {
          loc = await geocodePlace(placeRaw);
        }
      }catch{
        wxStatus.textContent = "Couldn’t determine location for this weather search.";
        return;
      }

      wxLoc.textContent = loc.label;

      try{
        const wx = await fetchWeather(loc.lat, loc.lon);

        const cur = wx.current || {};
        wxDesc.textContent = `${codeToEmoji(cur.weather_code)} ${wxCodeToText(cur.weather_code)}`;
        wxTemp.textContent = (typeof cur.temperature_2m === "number") ? `${Math.round(cur.temperature_2m)}°F` : "—";

        if(typeof cur.apparent_temperature === "number") wxMeta.appendChild(chip("Feels like", `${Math.round(cur.apparent_temperature)}°F`));
        if(typeof cur.wind_speed_10m === "number") wxMeta.appendChild(chip("Wind", `${Math.round(cur.wind_speed_10m)} mph`));
        if(typeof cur.relative_humidity_2m === "number") wxMeta.appendChild(chip("Humidity", `${Math.round(cur.relative_humidity_2m)}%`));

        // Hourly strip
        const h = wx.hourly || {};
        const times = h.time || [];
        const temps = h.temperature_2m || [];
        const codes = h.weather_code || [];
        const pops  = h.precipitation_probability || [];

        const now = new Date();
        let startIdx = 0;
        for(let i=0;i<times.length;i++){
          const dt = new Date(times[i]);
          if(dt >= now){ startIdx = i; break; }
        }
        if(typeof pops[startIdx] === "number"){
          wxMeta.appendChild(chip("Precip", `${Math.round(pops[startIdx])}%`));
        }

        for(let i=startIdx;i<Math.min(times.length, startIdx + 12);i++){
          const box = document.createElement("div");
          box.className = "hour";
          const t = fmtHour(times[i]);
          const temp = (typeof temps[i] === "number") ? `${Math.round(temps[i])}°` : "—";
          const ico = codeToEmoji(codes[i]);
          const pop = (typeof pops[i] === "number") ? `${Math.round(pops[i])}%` : "—";
          box.innerHTML = `
            <div class="t">${t}</div>
            <div class="icon">${ico}</div>
            <div class="temp">${temp}</div>
            <div class="pop">💧 ${pop}</div>
          `;
          wxHourly.appendChild(box);
        }

        // Daily forecast
        const daily = wx.daily || {};
        const days = daily.time || [];
        const maxs = daily.temperature_2m_max || [];
        const mins = daily.temperature_2m_min || [];
        const dcodes = daily.weather_code || [];

        for(let i=0;i<Math.min(3, days.length);i++){
          const row = document.createElement("div");
          row.className = "forecast-row";
          const emo = codeToEmoji(dcodes[i]);
          const hi = (typeof maxs[i] === "number") ? `${Math.round(maxs[i])}°` : "—";
          const lo = (typeof mins[i] === "number") ? `${Math.round(mins[i])}°` : "—";
          row.innerHTML = `
            <div class="fmuted">${fmtDay(days[i])}</div>
            <div>${emo} <span class="fmuted">${wxCodeToText(dcodes[i])}</span></div>
            <div><strong>${hi}</strong> <span class="fmuted">/ ${lo}</span></div>
          `;
          wxForecast.appendChild(row);
        }

        wxStatus.textContent = "";
      }catch{
        wxStatus.textContent = "Couldn’t load weather right now.";
      }
    }

    /*****************
     * LOCAL SEARCH (Leaflet + Overpass) keyword detection
     *****************/
    const localModule = document.getElementById("localModule");
    const localTitle = document.getElementById("localTitle");
    const localStatus = document.getElementById("localStatus");
    const placesList = document.getElementById("placesList");
    const useMyLocationBtn = document.getElementById("useMyLocationBtn");
    const openMapsBtn = document.getElementById("openMapsBtn");

    let leafletMap = null;
    let markersLayer = null;

    function isNearMeQuery(q){
      return /\bnear me\b/i.test(q) || /\bnearby\b/i.test(q);
    }

    // Detect what the user is trying to find (extend whenever you want)
    function detectLocalIntent(q){
      const s = q.toLowerCase();

      // Order matters (more specific first)
      const rules = [
        { key: "gas", label: "Gas stations", tags: ['amenity=fuel'] },
        { key: "grocery", label: "Grocery stores", tags: ['shop=supermarket'] },
        { key: "pharmacy", label: "Pharmacies", tags: ['amenity=pharmacy'] },
        { key: "hotel", label: "Hotels", tags: ['tourism=hotel'] },
        { key: "bar", label: "Bars", tags: ['amenity=bar'] },
        { key: "coffee", label: "Coffee", tags: ['amenity=cafe'] },
        { key: "cafe", label: "Cafes", tags: ['amenity=cafe'] },
        { key: "library", label: "Libraries", tags: ['amenity=library'] },
        { key: "restaurant", label: "Restaurants", tags: ['amenity=restaurant'] },
        { key: "pizza", label: "Pizza", tags: ['amenity=restaurant','cuisine=pizza'] },
        { key: "burger", label: "Burgers", tags: ['amenity=restaurant','cuisine=burger'] },
        { key: "tacos", label: "Tacos", tags: ['amenity=restaurant','cuisine=mexican'] },
        { key: "food", label: "Food", tags: ['amenity=restaurant'] },
      ];

      // Trigger local pack if query contains any local intent keyword
      for(const r of rules){
        if(s.includes(r.key)) return r;
      }
      return null;
    }

    function stripIntentAndLocationWords(q, intentKey){
      // Try to leave a place name for geocoding when NOT "near me"
      // Examples:
      // "restaurants in chicago" -> "chicago"
      // "coffee dallas tx" -> "dallas tx"
      let s = q.toLowerCase();

      // remove "near me/nearby"
      s = s.replace(/\bnear me\b/g, "").replace(/\bnearby\b/g, "");

      // remove intent keyword(s)
      if(intentKey) s = s.replace(new RegExp("\\b" + intentKey + "s?\\b","g"), "");

      // remove generic words
      s = s.replace(/\b(best|top|good|open|now|closest|cheap|near|around|find|show|places|place)\b/g, "");
      s = s.replace(/\b(in|at|for|by)\b/g, " ");

      // collapse
      s = s.replace(/\s+/g, " ").trim();
      return s;
    }

    function ensureLeafletReady(){
      return !!window.L;
    }

    function resetMap(){
      const el = document.getElementById("localMap");
      el.innerHTML = ""; // hard reset container
      leafletMap = null;
      markersLayer = null;
    }

    function initMap(lat, lon, zoom=14){
      if(!ensureLeafletReady()){
        localStatus.textContent = "Map library failed to load.";
        return null;
      }

      resetMap();
      leafletMap = L.map("localMap").setView([lat, lon], zoom);

      L.tileLayer(OSM_TILES, {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }).addTo(leafletMap);

      markersLayer = L.layerGroup().addTo(leafletMap);
      return leafletMap;
    }

    function setLocalVisible(on){
      localModule.classList.toggle("show", !!on);
    }

    function osmLink(lat, lon, zoom=16){
      return `https://www.openstreetmap.org/#map=${zoom}/${lat}/${lon}`;
    }

    async function tryOverpassFetch(postBody){
      for(const endpoint of OVERPASS_ENDPOINTS){
        try{
          const res = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
            body: "data=" + encodeURIComponent(postBody)
          });
          if(!res.ok) throw new Error("Overpass HTTP " + res.status);
          return await res.json();
        }catch(e){
          // try next endpoint
        }
      }
      throw new Error("All Overpass endpoints failed");
    }

    function elementLatLon(el){
      if(typeof el.lat === "number" && typeof el.lon === "number") return { lat: el.lat, lon: el.lon };
      if(el.center && typeof el.center.lat === "number" && typeof el.center.lon === "number") return { lat: el.center.lat, lon: el.center.lon };
      return null;
    }

    function tag(el, key){
      return (el.tags && el.tags[key]) ? el.tags[key] : "";
    }

    function formatAddress(el){
      const hn = tag(el, "addr:housenumber");
      const st = tag(el, "addr:street");
      const city = tag(el, "addr:city");
      const parts = [];
      const line1 = [hn, st].filter(Boolean).join(" ");
      if(line1) parts.push(line1);
      if(city) parts.push(city);
      return parts.join(", ");
    }

    function badgesFor(el){
      const out = [];
      const cuisine = tag(el, "cuisine");
      const brand = tag(el, "brand");
      const fuel = tag(el, "fuel");
      const shop = tag(el, "shop");
      const amenity = tag(el, "amenity");
      if(cuisine) out.push("Cuisine: " + cuisine);
      if(brand) out.push(brand);
      if(fuel) out.push("Fuel: " + fuel);
      if(shop) out.push("Shop: " + shop);
      if(amenity) out.push("Amenity: " + amenity);
      return out.slice(0, 3);
    }

    async function renderLocalPack({ query, intent, center, centerLabel }){
      setLocalVisible(true);
      localTitle.textContent = `${intent.label}${centerLabel ? " — " + centerLabel : ""}`;
      localStatus.textContent = "Loading nearby results from OpenStreetMap…";
      placesList.innerHTML = "";

      const map = initMap(center.lat, center.lon, 14);
      if(!map) return;

      openMapsBtn.href = osmLink(center.lat, center.lon, 15);

      // You marker (if this is "my location")
      if(centerLabel === "Your location"){
        L.marker([center.lat, center.lon]).addTo(map).bindPopup("You are here").openPopup();
      }

      // Overpass query:
      // Use nwr (node/way/relation) with around radius
      const R = 3000;
      const filters = intent.tags
        .map(kv => {
          const [k,v] = kv.split("=");
          return `["${k}"="${v}"]`;
        })
        .join("");

      const ql = `
        [out:json][timeout:25];
        (
          node${filters}(around:${R},${center.lat},${center.lon});
          way${filters}(around:${R},${center.lat},${center.lon});
          relation${filters}(around:${R},${center.lat},${center.lon});
        );
        out center tags 30;
      `.trim();

      let data;
      try{
        data = await tryOverpassFetch(ql);
      }catch(e){
        localStatus.textContent = "Overpass is busy right now — try again in a minute.";
        return;
      }

      const items = (data.elements || [])
        .map(el => ({ el, ll: elementLatLon(el) }))
        .filter(x => x.ll && tag(x.el,"name"))
        .slice(0, 30);

      if(!items.length){
        localStatus.textContent = "No nearby results found in OpenStreetMap data for that query.";
        return;
      }

      localStatus.textContent = `Showing ${items.length} results nearby`;

      // Markers + list
      const bounds = [];
      items.forEach((item, idx) => {
        const name = tag(item.el, "name");
        const addr = formatAddress(item.el);
        const website = tag(item.el, "website") || tag(item.el,"contact:website");

        const m = L.marker([item.ll.lat, item.ll.lon]).addTo(markersLayer);
        m.bindPopup(`
          <div style="font-family:Arial,Helvetica,sans-serif;font-size:13px;max-width:260px">
            <div style="font-weight:700;margin-bottom:4px">${name}</div>
            <div style="color:#5f6368">${addr || ""}</div>
            ${website ? `<div style="margin-top:6px"><a href="${website}" target="_blank" rel="noopener">Website</a></div>` : ""}
          </div>
        `);

        bounds.push([item.ll.lat, item.ll.lon]);

        const card = document.createElement("div");
        card.className = "placeCard";
        const badgeHtml = badgesFor(item.el).map(b => `<span class="badge">${b}</span>`).join("");
        card.innerHTML = `
          <div class="placeName">${idx+1}. ${name}</div>
          <div class="placeMeta">${addr || "—"}</div>
          <div>${badgeHtml}</div>
        `;
        card.addEventListener("click", ()=>{
          map.setView([item.ll.lat, item.ll.lon], 16);
          m.openPopup();
        });
        placesList.appendChild(card);
      });

      // Fit view
      try{
        if(bounds.length){
          map.fitBounds(bounds, { padding: [30,30] });
        }
      }catch{}
    }

    async function resolveLocalCenter(query, intent){
      // If near me/nearby => use geolocation
      if(isNearMeQuery(query)){
        const loc = await getBrowserLocation();
        return { center: { lat: loc.lat, lon: loc.lon }, label: "Your location" };
      }

      // Otherwise attempt to geocode a place in the query
      const maybePlace = stripIntentAndLocationWords(query, intent.key);
      if(maybePlace){
        try{
          const g = await geocodePlace(maybePlace);
          return { center: { lat: g.lat, lon: g.lon }, label: maybePlace };
        }catch{}
      }

      // If no place parsed, we’ll require location permission
      const loc = await getBrowserLocation();
      return { center: { lat: loc.lat, lon: loc.lon }, label: "Your location" };
    }

    async function maybeShowLocalPack(query){
      const intent = detectLocalIntent(query);
      if(!intent){ setLocalVisible(false); return; }

      // stash key so we can retry via the button
      maybeShowLocalPack.lastIntent = intent;
      maybeShowLocalPack.lastQuery = query;

      setLocalVisible(true);
      localTitle.textContent = intent.label;
      localStatus.textContent = "Preparing map…";
      placesList.innerHTML = "";

      // Handle missing Leaflet (rare)
      if(!ensureLeafletReady()){
        localStatus.textContent = "Map library failed to load.";
        return;
      }

      try{
        const resolved = await resolveLocalCenter(query, intent);
        await renderLocalPack({
          query,
          intent,
          center: resolved.center,
          centerLabel: resolved.label
        });
      }catch(e){
        localStatus.textContent = "Location permission denied — click “Use my location” to try again.";
      }
    }

    useMyLocationBtn.addEventListener("click", async ()=>{
      const q = maybeShowLocalPack.lastQuery || queryFromUrl || "";
      const intent = maybeShowLocalPack.lastIntent || detectLocalIntent(q);
      if(!intent){ localStatus.textContent = "No local query detected."; return; }
      try{
        const loc = await getBrowserLocation();
        await renderLocalPack({
          query: q,
          intent,
          center: { lat: loc.lat, lon: loc.lon },
          centerLabel: "Your location"
        });
      }catch{
        localStatus.textContent = "Location permission denied.";
      }
    });

    /*****************
     * INIT: run modules for current query
     *****************/
    (function init(){
      if(!queryFromUrl) return;

      // Weather module only if query includes "weather"/"forecast"
      renderWeatherForQuery(queryFromUrl);

      // Local module only if local intent detected
      // (restaurants/coffee/gas/library/etc.)
      // Wait a tick for Leaflet (defer) to be ready on slower devices
      setTimeout(()=>maybeShowLocalPack(queryFromUrl), 0);
    })();
  </script>
</body>
