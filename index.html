<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Joogle</title>

  <!-- Speed: warm up connections used by Programmable Search -->
  <link rel="preconnect" href="https://cse.google.com" />
  <link rel="preconnect" href="https://www.google.com" />
  <link rel="dns-prefetch" href="//cse.google.com" />
  <link rel="dns-prefetch" href="//www.google.com" />

  <style>
    :root{
      --bg:#fff;
      --text:#202124;
      --muted:#5f6368;
      --card:#fff;
      --cardBorder:#dfe1e5;
      --shadow:0 1px 6px rgba(32,33,36,.28);
      --shadowHover:0 2px 12px rgba(0,0,0,.18);
      --pill:#f1f3f4;
      --pillText:#202124;
      --btn:#f8f9fa;
      --btnText:#3c4043;
      --btnBorder:#dadce0;
      --link:#1a0dab;
      --visited:#681da8;
      --danger:#d93025;
    }
    body.dark{
      --bg:#202124;
      --text:#e8eaed;
      --muted:#9aa0a6;
      --card:#202124;
      --cardBorder:#3c4043;
      --shadow:0 1px 10px rgba(0,0,0,.55);
      --shadowHover:0 2px 18px rgba(0,0,0,.65);
      --pill:#303134;
      --pillText:#e8eaed;
      --btn:#303134;
      --btnText:#e8eaed;
      --btnBorder:#5f6368;
      --link:#8ab4f8;
      --visited:#c58af9;
      --danger:#f28b82;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; }
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      color:var(--text);
      background:var(--bg);
    }

    .topbar{
      height:56px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding:0 16px;
      gap:10px;
    }

    .icon-btn{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      width:38px;
      height:38px;
      border-radius:999px;
      border:1px solid transparent;
      background:transparent;
      color:var(--text);
      cursor:pointer;
    }
    .icon-btn:hover{
      background:rgba(60,64,67,.08);
      border-color:rgba(60,64,67,.08);
    }
    body.dark .icon-btn:hover{
      background:rgba(232,234,237,.08);
      border-color:rgba(232,234,237,.08);
    }

    .wrap{
      max-width: 720px;
      margin: 0 auto;
      padding: 0 16px 40px;
    }

    .logo{
      margin-top: 70px;
      text-align:center;
      font-size: 84px;
      font-weight: 700;
      letter-spacing:-1px;
      line-height:1;
      user-select:none;
    }
    .logo span{ display:inline-block; }
    .logo .b1{ color:#4285f4;}
    .logo .b2{ color:#ea4335;}
    .logo .b3{ color:#fbbc05;}
    .logo .b4{ color:#4285f4;}
    .logo .b5{ color:#34a853;}
    .logo .b6{ color:#ea4335;}

    .search-area{ margin-top: 26px; position:relative; }
    .searchbar{
      width:100%;
      display:flex;
      align-items:center;
      gap:10px;
      padding: 12px 14px;
      border-radius:999px;
      border:1px solid var(--cardBorder);
      background:var(--card);
      box-shadow:none;
      transition: box-shadow .15s ease, border-color .15s ease;
    }
    .searchbar:hover,
    .searchbar:focus-within{
      box-shadow: var(--shadow);
      border-color: transparent;
    }

    .mag{ width:18px; height:18px; opacity:.65; flex:0 0 auto; }
    input[type="search"]{
      flex: 1;
      border:0;
      outline:0;
      font-size:16px;
      background:transparent;
      color:var(--text);
      padding: 2px 0;
      min-width: 0;
    }
    input[type="search"]::-webkit-search-cancel-button{ display:none; }

    .kbd-hint{
      flex:0 0 auto;
      font-size:12px;
      color:var(--muted);
      background:var(--pill);
      color:var(--pillText);
      border:1px solid var(--cardBorder);
      padding:2px 8px;
      border-radius:6px;
      user-select:none;
    }

    /* Suggestions dropdown (Google-like) */
    #suggestions{
      position:absolute;
      left:0;
      right:0;
      top: 54px;
      border:1px solid var(--cardBorder);
      border-top:none;
      background:var(--card);
      border-radius: 0 0 20px 20px;
      overflow:hidden;
      box-shadow: var(--shadow);
      z-index: 50;
      display:none;
    }
    .sugg-row{
      padding: 10px 16px;
      cursor:pointer;
      display:flex;
      gap:10px;
      align-items:center;
      font-size:16px;
      color:var(--text);
    }
    .sugg-row:hover{ background: rgba(60,64,67,.08); }
    body.dark .sugg-row:hover{ background: rgba(232,234,237,.08); }
    .sugg-ico{ width:16px; height:16px; opacity:.6; flex:0 0 auto; }

    .actions{
      margin-top: 26px;
      display:flex;
      justify-content:center;
      gap: 12px;
      flex-wrap:wrap;
    }
    .btn{
      padding: 10px 16px;
      border-radius: 4px;
      border:1px solid var(--btnBorder);
      background:var(--btn);
      color:var(--btnText);
      font-size: 14px;
      cursor:pointer;
      user-select:none;
    }
    .btn:hover{ box-shadow: 0 1px 1px rgba(0,0,0,.1); border-color:rgba(0,0,0,.15); }
    body.dark .btn:hover{ border-color:#7b8187; }

    .hint{
      margin-top: 18px;
      text-align:center;
      color:var(--muted);
      font-size: 13px;
    }

    /* Results container spacing */
    #resultsWrap{
      margin-top: 26px;
    }

    /* Better result cards styling for Programmable Search */
    /* These selectors are intentionally broad because Google renders inside its own markup */
    .gsc-control-cse, .gsc-control-cse *{
      font-family: Arial, Helvetica, sans-serif !important;
    }
    .gsc-control-cse{
      padding: 0 !important;
      border: 0 !important;
      background: transparent !important;
      color: var(--text) !important;
    }
    .gsc-results .gsc-cursor-box{
      text-align:center !important;
    }

    .gsc-webResult.gsc-result{
      background: var(--card) !important;
      border: 1px solid var(--cardBorder) !important;
      border-radius: 14px !important;
      padding: 14px 16px !important;
      margin-bottom: 12px !important;
      transition: transform .06s ease, box-shadow .18s ease;
    }
    .gsc-webResult.gsc-result:hover{
      box-shadow: var(--shadowHover) !important;
      transform: translateY(-1px);
    }

    /* Title/link colors */
    a.gs-title, a.gs-title:link, a.gs-title:visited{
      color: var(--link) !important;
      text-decoration:none !important;
    }
    a.gs-title:visited{
      color: var(--visited) !important;
    }
    .gs-bidi-start-align.gs-snippet{
      color: var(--text) !important;
      opacity: .92;
    }
    .gs-visibleUrl, .gs-visibleUrl-short{
      color: var(--muted) !important;
    }

    /* Search box in results (hide it; we provide our own) */
    .gsc-search-box{ display:none !important; }

    /* Make the top padding not huge */
    .gsc-results-wrapper-visible{ padding-top: 0 !important; }

    /* Dark mode polish for Google result controls */
    body.dark .gsc-control-cse .gsc-above-wrapper-area,
    body.dark .gsc-control-cse .gsc-resultsHeader,
    body.dark .gsc-control-cse .gsc-results{
      color: var(--text) !important;
    }

    .toast{
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card);
      border: 1px solid var(--cardBorder);
      box-shadow: var(--shadow);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 999px;
      font-size: 13px;
      display:none;
      z-index: 9999;
      max-width: calc(100vw - 24px);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    @media (max-width:480px){
      .logo{ font-size: 64px; margin-top: 48px; }
      .searchbar{ padding: 11px 12px; }
      #suggestions{ top: 52px; }
      .kbd-hint{ display:none; }
    }
  </style>
</head>

<body>
  <div class="topbar">
    <button class="icon-btn" id="darkToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  </div>

  <div class="wrap">
    <div class="logo" aria-label="Joogle">
      <span class="b1">J</span><span class="b2">o</span><span class="b3">o</span><span class="b4">g</span><span class="b5">l</span><span class="b6">e</span>
    </div>

    <div class="search-area">
      <div class="searchbar" id="searchbar">
        <svg class="mag" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 21.5 21.5 20l-6-6zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
        </svg>

        <input id="q" type="search" autocomplete="off" autocapitalize="none" spellcheck="false"
               placeholder="Search the web" aria-label="Search" />

        <div class="kbd-hint" title="Press Enter">Enter</div>
      </div>

      <div id="suggestions" role="listbox" aria-label="Suggestions"></div>

      <div class="actions">
        <button class="btn" id="searchBtn">Joogle Search</button>
        <button class="btn" id="luckyBtn">I’m Feeling Joogly</button>
      </div>

      <div class="hint">Tip: type to get suggestions • Enter to search • Esc to close suggestions</div>

      <div id="resultsWrap">
        <!-- Programmable Search results will render here -->
        <div class="gcse-searchresults-only"></div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    /********************
     * CONFIG
     ********************/
    const CX = "427c85c8321db4c63"; // your engine id (without "cx=")

    // "Hide spam domains automatically" list (edit to taste)
    const BLOCKED_DOMAINS = [
      "pinterest.",
      "quora.",
      "answers.com",
      "brainly.",
      "chegg.",
      "coursehero.",
      "wikihow.com",
      "scribd.com"
    ];

    // Optional: hide results with these words in title/snippet (lightweight spam filter)
    const BLOCKED_KEYWORDS = [
      "coupon",
      "promo code",
      "free download",
      "crack"
    ];

    /********************
     * DARK MODE
     ********************/
    const darkToggle = document.getElementById("darkToggle");
    function setDarkMode(on){
      document.body.classList.toggle("dark", on);
      localStorage.setItem("joogle_dark", on ? "1" : "0");
      darkToggle.textContent = on ? "☀️" : "🌙";
    }
    setDarkMode(localStorage.getItem("joogle_dark") === "1");
    darkToggle.addEventListener("click", () => setDarkMode(!document.body.classList.contains("dark")));

    /********************
     * TOAST
     ********************/
    const toast = document.getElementById("toast");
    let toastTimer = null;
    function showToast(msg){
      toast.textContent = msg;
      toast.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.style.display = "none", 2200);
    }

    /********************
     * LOAD PROGRAMMABLE SEARCH (FAST-ish)
     ********************/
    (function loadCSE(){
      const s = document.createElement("script");
      s.async = true;
      s.src = "https://cse.google.com/cse.js?cx=" + encodeURIComponent(CX);
      document.head.appendChild(s);
    })();

    /********************
     * SEARCH + "I'M FEELING JOOGY"
     ********************/
    const q = document.getElementById("q");
    const searchBtn = document.getElementById("searchBtn");
    const luckyBtn = document.getElementById("luckyBtn");
    const suggestions = document.getElementById("suggestions");

    // Safest way to trigger results-only widget:
    // update the URL param 'q' and let CSE pick it up (works reliably across versions)
    function runSearch(query){
      const url = new URL(window.location.href);
      if(query && query.trim()){
        url.searchParams.set("q", query.trim());
      } else {
        url.searchParams.delete("q");
      }
      history.replaceState({}, "", url.toString());
      // CSE listens to the URL param; forcing a hash change nudges re-render in stubborn cases
      window.dispatchEvent(new Event("popstate"));
      showToast("Searching: " + query.trim());
    }

    function feelingJoogly(){
      const query = q.value.trim();
      if(!query){
        showToast("Type something first 🙂");
        q.focus();
        return;
      }
      // Google "I'm Feeling Lucky" behavior
      window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(query) + "&btnI=1";
    }

    searchBtn.addEventListener("click", () => {
      closeSuggestions();
      runSearch(q.value);
    });
    luckyBtn.addEventListener("click", () => {
      closeSuggestions();
      feelingJoogly();
    });

    q.addEventListener("keydown", (e) => {
      if(e.key === "Enter"){
        e.preventDefault();
        closeSuggestions();
        runSearch(q.value);
      }
      if(e.key === "Escape"){
        closeSuggestions();
      }
    });

    /********************
     * INSTANT SUGGESTIONS (Google-style)
     ********************/
    let suggAbort = null;
    let suggDebounce = null;

    function openSuggestions(){
      if(suggestions.children.length > 0){
        suggestions.style.display = "block";
        // round the searchbar bottom corners to match dropdown
        document.getElementById("searchbar").style.borderBottomLeftRadius = "20px";
        document.getElementById("searchbar").style.borderBottomRightRadius = "20px";
      }
    }
    function closeSuggestions(){
      suggestions.style.display = "none";
      suggestions.innerHTML = "";
      document.getElementById("searchbar").style.borderBottomLeftRadius = "999px";
      document.getElementById("searchbar").style.borderBottomRightRadius = "999px";
    }

    function makeSuggRow(text){
      const row = document.createElement("div");
      row.className = "sugg-row";
      row.setAttribute("role","option");
      row.innerHTML = `
        <svg class="sugg-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79L20 21.5 21.5 20l-6-6z"/>
        </svg>
        <span></span>
      `;
      row.querySelector("span").textContent = text;
      row.addEventListener("mousedown", (e) => {
        // prevent input blur before click
        e.preventDefault();
      });
      row.addEventListener("click", () => {
        q.value = text;
        closeSuggestions();
        runSearch(text);
      });
      return row;
    }

    async function fetchSuggestions(query){
      if(suggAbort) suggAbort.abort();
      suggAbort = new AbortController();

      // This endpoint returns JSON in a simple array form with client=firefox
      const url = "https://suggestqueries.google.com/complete/search?client=firefox&q=" + encodeURIComponent(query);
      const res = await fetch(url, { signal: suggAbort.signal, mode: "cors" });
      const data = await res.json();
      return Array.isArray(data) ? (data[1] || []) : [];
    }

    q.addEventListener("input", () => {
      const query = q.value.trim();
      clearTimeout(suggDebounce);

      if(!query){
        closeSuggestions();
        return;
      }

      suggDebounce = setTimeout(async () => {
        try{
          const list = await fetchSuggestions(query);
          suggestions.innerHTML = "";
          list.slice(0, 8).forEach(item => suggestions.appendChild(makeSuggRow(item)));
          openSuggestions();
        }catch(err){
          // ignore aborts
        }
      }, 120);
    });

    // Close suggestions on outside click
    document.addEventListener("click", (e) => {
      const area = document.querySelector(".search-area");
      if(!area.contains(e.target)) closeSuggestions();
    });

    /********************
     * INITIALIZE FROM URL (?q=)
     ********************/
    (function hydrateFromUrl(){
      const params = new URLSearchParams(window.location.search);
      const initial = params.get("q");
      if(initial){
        q.value = initial;
      }
    })();

    /********************
     * HIDE SPAM DOMAINS AUTOMATICALLY
     * (Runs after results render)
     ********************/
    function shouldHideResult(el){
      const a = el.querySelector("a");
      if(!a || !a.href) return false;

      const href = a.href.toLowerCase();
      if(BLOCKED_DOMAINS.some(d => href.includes(d))) return true;

      const text = (el.textContent || "").toLowerCase();
      if(BLOCKED_KEYWORDS.some(k => text.includes(k))) return true;

      return false;
    }

    function filterResults(){
      const results = document.querySelectorAll(".gsc-webResult.gsc-result, .gsc-result");
      results.forEach(el => {
        if(shouldHideResult(el)){
          el.style.display = "none";
        }
      });
    }

    // Observe DOM changes so we can filter whenever results update
    const observer = new MutationObserver(() => filterResults());
    observer.observe(document.documentElement, { subtree:true, childList:true });

  </script>
</body>
</html>
