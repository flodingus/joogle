<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Joogle</title>

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  margin:0;
  background:#fff;
  color:#202124;
}
.center{
  height:80vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
.logo{
  font-size:72px;
  font-weight:bold;
}
.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

input{
  width:520px;
  max-width:90vw;
  padding:14px;
  border-radius:25px;
  border:1px solid #dadce0;
  font-size:16px;
}

.results{
  max-width:900px;
  margin:auto;
  padding:20px;
}

.result{
  margin-bottom:18px;
}

.result a{
  font-size:20px;
  color:#1a0dab;
  text-decoration:none;
}
.result a:hover{text-decoration:underline}

.snippet{color:#4d5156}
</style>
</head>

<body>

<div class="center" id="home">
  <div class="logo">
    <span>J</span><span>o</span><span>o</span>
    <span>g</span><span>l</span><span>e</span>
  </div>

  <input id="q" placeholder="Search Joogle…" autofocus>
</div>

<div class="results" id="results" style="display:none"></div>

<script>

const input = document.getElementById("q");
const resultsDiv = document.getElementById("results");
const home = document.getElementById("home");

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") search(input.value);
});

async function search(q){

  if(!q.trim()) return;

  home.style.display="none";
  resultsDiv.style.display="block";
  resultsDiv.innerHTML="Searching...";

  try{

    // DuckDuckGo instant answers (FREE)
    const url =
      "https://api.duckduckgo.com/?q="
      + encodeURIComponent(q)
      + "&format=json&no_html=1";

    const res = await fetch(url);
    const data = await res.json();

    let html="";

    if(data.AbstractText){
      html+=`
      <div class="result">
        <b>${data.Heading}</b>
        <div class="snippet">${data.AbstractText}</div>
      </div>`;
    }

    const topics =
      (data.RelatedTopics||[])
      .flatMap(x=>x.Topics?x.Topics:[x])
      .slice(0,10);

    topics.forEach(t=>{
      if(!t.FirstURL) return;

      html+=`
      <div class="result">
        <a href="${t.FirstURL}" target="_blank">
          ${t.Text.split(" - ")[0]}
        </a>
        <div class="snippet">${t.Text}</div>
      </div>`;
    });

    if(!html){
      html="<p>No instant results found. Try another search.</p>";
    }

    resultsDiv.innerHTML=html;

  }catch(e){
    resultsDiv.innerHTML="Search failed.";
  }
}

</script>
</body>
</html>
