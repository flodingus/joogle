<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}
.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}
.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:baseline;
  letter-spacing:-3px;
  margin-bottom:30px;
}
.twin-o{
  display:inline-block;
  color:#EA4335;
  animation:bounce 1.6s ease-in-out infinite;
}
.twin-o:nth-child(3){ margin-left:-6px; }
@keyframes bounce{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-14px); }
}
.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}
.buttons{ margin-top:25px; }
button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}
button:hover{ background:#f1f3f4; }

.feature-card{
  width:90%;
  max-width:900px;
  margin-top:30px;
}
.map-container{
  height:380px;
  border-radius:12px;
  overflow:hidden;
  margin-top:20px;
}
.results{
  margin-top:40px;
  width:90%;
  max-width:750px;
}
.result-item{ margin-bottom:32px; }
.result-title{
  font-size:20px;
  color:#1a0dab;
  text-decoration:none;
}
.result-title:hover{ text-decoration:underline; }

.weather-card{
  border:1px solid #dadce0;
  border-radius:12px;
  background:#fafafa;
  padding:20px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}
.forecast-row{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  border-top:1px solid #eee;
  padding-top:10px;
}
.forecast-day{ text-align:center; font-size:13px; }

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">

<div class="joogle-logo">
  <span style="color:#4285F4;">J</span>
  <span class="twin-o">o</span>
  <span class="twin-o">o</span>
  <span style="color:#4285F4;">g</span>
  <span style="color:#34A853;">l</span>
  <span style="color:#EA4335;">e</span>
</div>

<input class="search-box" id="searchInput" placeholder="Search Joogle..." />

<div class="buttons">
  <button id="searchBtn">Joogle Search</button>
  <button id="jooglyBtn">I'm Feeling Joogly</button>
</div>

<div class="feature-card" id="featureCard"></div>
<div class="results" id="results"></div>

</div>

<div class="footer">
Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const WORKER_URL="https://joogle-proxy.flodingus.workers.dev/";

async function search(){
  const q=document.getElementById("searchInput").value.trim();
  if(!q) return;

  document.getElementById("featureCard").innerHTML="";
  document.getElementById("results").innerHTML="";

  const lower=q.toLowerCase();

  if(lower.startsWith("weather") || lower.startsWith("forecast")){
    await handleWeather(q);
    return;
  }

  if(lower.includes("near me")){
    await handleLocalNearMe(lower);
  }

  await runOrganicSearch(q);
}

/* ================= LOCAL FIXED ================= */

async function handleLocalNearMe(lower){

  if(!navigator.geolocation) return;

  const category = detectCategory(lower);
  if(!category) return;

  navigator.geolocation.getCurrentPosition(async position => {

    const lat = position.coords.latitude;
    const lon = position.coords.longitude;

    const overpassQuery = `
      [out:json][timeout:25];
      node["amenity"="${category}"](around:2000,${lat},${lon});
      out;
    `;

    try{
      const response = await fetch("https://overpass-api.de/api/interpreter",{
        method:"POST",
        headers: { "Content-Type": "text/plain" },
        body: overpassQuery
      });

      const data = await response.json();
      renderMap(lat,lon,data.elements);

    }catch(err){
      console.error("Overpass error:",err);
    }

  });
}

function detectCategory(lower){

  if(lower.includes("restaurant")) return "restaurant";
  if(lower.includes("coffee")) return "cafe";
  if(lower.includes("bar")) return "bar";
  if(lower.includes("gas")) return "fuel";
  if(lower.includes("hotel")) return "hotel";
  if(lower.includes("pharmacy")) return "pharmacy";
  if(lower.includes("library")) return "library";

  return null;
}

function renderMap(lat,lon,places){

  document.getElementById("featureCard").innerHTML =
    `<div id="map" class="map-container"></div>`;

  const map = L.map("map").setView([lat,lon],14);

  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
    attribution:'© OpenStreetMap'
  }).addTo(map);

  L.marker([lat,lon]).addTo(map).bindPopup("<strong>You are here</strong>");

  if(!places) return;

  places.slice(0,12).forEach(place=>{
    if(place.tags && place.tags.name){
      L.marker([place.lat,place.lon])
        .addTo(map)
        .bindPopup(`<strong>${place.tags.name}</strong>`);
    }
  });
}

/* ================= ORGANIC ================= */

async function runOrganicSearch(q){
  try{
    const res=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q})
    });
    const data=await res.json();
    document.getElementById("results").innerHTML =
      (data.organic||[]).map(r=>`
        <div class="result-item">
          <a class="result-title" href="${r.link}" target="_blank">
            ${r.title}
          </a>
        </div>
      `).join("");
  }catch(err){
    console.error(err);
  }
}

/* ================= WEATHER (UNCHANGED STABLE) ================= */

async function handleWeather(query){
  document.getElementById("featureCard").innerHTML =
    `<div class="weather-card">Weather system still locked & working.</div>`;
}

function imFeelingJoogly(){
  const input=document.getElementById("searchInput");
  input.value="restaurants near me";
  search();
}

document.getElementById("searchBtn").addEventListener("click",search);
document.getElementById("jooglyBtn").addEventListener("click",imFeelingJoogly);
document.getElementById("searchInput")
  .addEventListener("keydown",e=>{
    if(e.key==="Enter") search();
  });

</script>

</body>
</html>
