<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text y='70%' x='50%' text-anchor='middle' font-size='80'>J</text>
</svg>">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#ffffff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:flex-end;
  letter-spacing:-3px;
  margin-bottom:30px;
}

.bounce{
  animation:bounce 0.45s ease;
}

@keyframes bounce{
  0%{transform:translateY(0);}
  50%{transform:translateY(-14px);}
  100%{transform:translateY(0);}
}

.eye-svg{
  width:1em;
  height:1em;
  vertical-align:-0.08em;
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{
  margin-top:25px;
}

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}

button:hover{
  background:#f1f3f4;
}

.results{
  margin-top:40px;
  width:90%;
  max-width:800px;
}

.result{
  margin-bottom:28px;
}

.result a{
  font-size:18px;
  color:#1a0dab;
  text-decoration:none;
}

.result a:hover{
  text-decoration:underline;
}

.result .link{
  font-size:14px;
  color:#006621;
}

.result .snippet{
  font-size:14px;
  color:#545454;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}

.love-page{
  position:fixed;
  inset:0;
  background:linear-gradient(to bottom,#ffffff 0%,#fff5f7 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.8s ease;
}

.love-page.active{
  opacity:1;
  pointer-events:auto;
}

.love-text{
  font-size:28px;
  text-align:center;
  margin-bottom:30px;
}

.play-btn{
  padding:12px 24px;
  border-radius:30px;
  border:none;
  background:#ff9eb5;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="main">

  <div class="joogle-logo"></div>

  <input class="search-box" id="searchInput" placeholder="Search Joogle..." />

  <div class="buttons">
    <button onclick="search()">Joogle Search</button>
    <button onclick="imFeelingJoogly()">I'm Feeling Joogly</button>
  </div>

  <div class="results" id="results"></div>

</div>

<div class="footer">
  Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<div class="love-page" id="lovePage">
  <div class="joogle-logo"></div>
  <div class="love-text">
    Out of all the searches in the world…<br>
    you’re my favorite.
  </div>
  <button class="play-btn" onclick="playSong()">Play Something Special</button>
  <button style="margin-top:20px;" onclick="exitLove()">Back to Joogle</button>
</div>

<script>
const WORKER_URL = "https://joogle-proxy.flodingus.workers.dev/";

function createLogo(container){
  container.innerHTML = `
    <span style="color:#4285F4;">J</span>
    <span class="o1" style="color:#EA4335;">o</span>

    <svg class="eye-svg" viewBox="0 0 60 60">
      <circle cx="30" cy="30" r="19" fill="#EA4335"/>
      <circle class="iris" cx="30" cy="30" r="6" fill="black" opacity="0"/>
      <circle class="shine" cx="33" cy="27" r="2" fill="white" opacity="0"/>
      <path class="lashes"
        d="M16 14 Q20 6 24 14
           M26 12 Q30 4 34 12
           M36 14 Q40 6 44 14"
        stroke="black"
        stroke-width="1.6"
        fill="none"
        opacity="0"/>
      <ellipse class="lid"
        cx="30" cy="30"
        rx="21" ry="0"
        fill="#EA4335"
        opacity="0"/>
    </svg>

    <span style="color:#4285F4;">g</span>
    <span style="color:#34A853;">l</span>
    <span style="color:#EA4335;">e</span>
  `;
}

function animateLogo(container){
  const o1 = container.querySelector(".o1");
  const svg = container.querySelector("svg");
  const iris = container.querySelector(".iris");
  const lashes = container.querySelector(".lashes");
  const shine = container.querySelector(".shine");
  const lid = container.querySelector(".lid");

  function loop(){

    o1.classList.add("bounce");
    svg.classList.add("bounce");

    setTimeout(()=>{
      o1.classList.remove("bounce");
      svg.classList.remove("bounce");

      iris.style.opacity="1";
      lashes.style.opacity="1";
      shine.style.opacity="1";

      setTimeout(()=>{

        lid.style.transition="ry 0.35s ease";
        lid.setAttribute("opacity","1");
        lid.setAttribute("ry","21");

        iris.style.transition="transform 0.3s ease";
        iris.style.transform="scale(0.8)";

        setTimeout(()=>{
          lid.setAttribute("ry","0");
          iris.style.transform="scale(1)";
        },1100);

        setTimeout(()=>{
          lid.setAttribute("opacity","0");
          iris.style.opacity="0";
          lashes.style.opacity="0";
          shine.style.opacity="0";
        },1700);

      },200);

    },450);
  }

  setInterval(loop,3000);
}

document.querySelectorAll(".joogle-logo").forEach(el=>{
  createLogo(el);
  animateLogo(el);
});

async function search(){
  const q=document.getElementById("searchInput").value.trim();
  if(!q) return;

  history.pushState({}, "", "?q="+encodeURIComponent(q));
  const resultsDiv=document.getElementById("results");
  resultsDiv.innerHTML="Searching...";

  try{
    const res=await fetch(WORKER_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ q })
    });
    const data=await res.json();
    renderResults(data.organic||[]);
  }catch{
    resultsDiv.innerHTML="Search failed.";
  }
}

function renderResults(results){
  document.getElementById("results").innerHTML =
    results.map(r=>`
      <div class="result">
        <a href="${r.link}" target="_blank">${r.title}</a>
        <div class="link">${r.link}</div>
        <div class="snippet">${r.snippet||""}</div>
      </div>
    `).join("");
}

function imFeelingJoogly(){
  if(Math.random()<0.20){
    document.getElementById("lovePage").classList.add("active");
  }else{
    search();
  }
}

function exitLove(){
  document.getElementById("lovePage").classList.remove("active");
}

function playSong(){
  window.open("https://open.spotify.com/search/every%20little%20thing%20is%20magic","_blank");
}

document.getElementById("searchInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") search();
});

window.onload=()=>{
  const params=new URLSearchParams(window.location.search);
  const q=params.get("q");
  if(q){
    document.getElementById("searchInput").value=q;
    search();
  }
};
</script>

</body>
</html>
