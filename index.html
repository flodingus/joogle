<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
:root {
  --bg:#ffffff;
  --text:#202124;
  --border:#dadce0;
  --link:#1a0dab;
}

body.dark {
  --bg:#121212;
  --text:#e8e8e8;
  --border:#333;
  --link:#8ab4f8;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  display:flex;
  align-items:center;
  padding:15px 24px;
  border-bottom:1px solid var(--border);
  gap:15px;
}

.logo{
  font-size:26px;
  font-weight:bold;
  cursor:pointer;
}

.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.searchInput{
  flex:1;
  padding:10px 18px;
  border-radius:24px;
  border:1px solid var(--border);
  font-size:16px;
  background:var(--bg);
  color:var(--text);
}

button{cursor:pointer;}

.home{
  display:flex;
  justify-content:center;
  align-items:center;
  height:70vh;
  font-size:90px;
  font-weight:bold;
}

.results{
  max-width:900px;
  margin:20px auto;
  padding:0 20px;
}

.resultItem{margin-bottom:25px;}
.resultItem h3{color:var(--link);margin:0;}

pre{
  background:#000;
  color:#0f0;
  padding:15px;
  border-radius:10px;
  overflow:auto;
}

.error{
  color:red;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.href='/'">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
  <input id="searchBox" class="searchInput" placeholder="Search Joogle...">
  <button id="darkToggle">🌙</button>
</div>

<div class="home" id="homeSection">
  <div>
    <span style="color:#4285F4">J</span>
    <span style="color:#DB4437">o</span>
    <span style="color:#F4B400">o</span>
    <span style="color:#4285F4">g</span>
    <span style="color:#0F9D58">l</span>
    <span style="color:#DB4437">e</span>
  </div>
</div>

<div class="results" id="results"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const PROXY_URL = "https://joogle-proxy.flodingus.workers.dev";

/* ================= STATE ================= */

const state = {
  loading:false
};

/* ================= UI ================= */

function showHome(){
  document.getElementById("homeSection").style.display="flex";
  document.getElementById("results").innerHTML="";
}

function showResults(html){
  document.getElementById("homeSection").style.display="none";
  document.getElementById("results").innerHTML=html;
}

function showLoading(){
  showResults("<p>Loading...</p>");
}

function showError(msg){
  showResults(`<div class="error">${msg}</div>`);
}

/* ================= DARK MODE ================= */

document.getElementById("darkToggle").onclick = () => {
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",
    document.body.classList.contains("dark"));
};

if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

/* ================= COMMAND ROUTER ================= */

async function routeQuery(query){

  if(!query) return;

  if(query.startsWith("=")){
    return handleCalculator(query);
  }

  if(query.toLowerCase().includes("weather")){
    return handleWeather();
  }

  if(query.toLowerCase().includes("near me")){
    return handleNearby(query);
  }

  return handleSearch(query);
}

/* ================= FEATURES ================= */

function handleCalculator(q){
  try{
    const result = eval(q.substring(1));
    showResults(`<h2>${result}</h2>`);
  }catch{
    showError("Invalid calculation");
  }
}

async function handleWeather(){
  if(!navigator.geolocation){
    showError("Geolocation not supported");
    return;
  }

  showLoading();

  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const {latitude,longitude}=pos.coords;

      const res=await fetch(
        `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`
      );

      const data=await res.json();

      let html=`<h2>${data.current_weather.temperature}°F</h2>`;
      data.daily.temperature_2m_max.forEach((max,i)=>{
        html+=`<div>Day ${i+1}: ${max}°F / ${data.daily.temperature_2m_min[i]}°F</div>`;
      });

      showResults(html);

    }catch(e){
      showError("Weather error");
    }
  });
}

async function handleNearby(query){

  if(!navigator.geolocation){
    showError("Geolocation not supported");
    return;
  }

  showLoading();

  navigator.geolocation.getCurrentPosition(async pos=>{
    try{
      const {latitude,longitude}=pos.coords;
      const type=query.split(" ")[0];

      const overpass=`
        [out:json];
        node["amenity"="${type}"](around:3000,${latitude},${longitude});
        out;
      `;

      const response=await fetch(
        "https://overpass-api.de/api/interpreter",
        {method:"POST",body:overpass}
      );

      const data=await response.json();

      let html=`<div id="map" style="height:400px;border-radius:12px;"></div>`;

      showResults(html);

      const map=L.map('map').setView([latitude,longitude],14);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

      L.marker([latitude,longitude]).addTo(map)
        .bindPopup("You are here").openPopup();

      data.elements.slice(0,10).forEach(p=>{
        L.marker([p.lat,p.lon]).addTo(map)
          .bindPopup(p.tags.name||"Unnamed");
      });

    }catch(e){
      showError("Map error");
    }
  });
}

async function handleSearch(query){

  showLoading();

  try{
    const res=await fetch(PROXY_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({q:query})
    });

    const data=await res.json();

    if(!data.organic){
      showError("Search error");
      return;
    }

    let html="";
    data.organic.forEach(r=>{
      html+=`
        <div class="resultItem">
          <a href="${r.link}" target="_blank">
            <h3>${r.title}</h3>
          </a>
          <p>${r.snippet}</p>
        </div>`;
    });

    showResults(html);

  }catch(e){
    showError("Search failed");
  }
}

/* ================= INIT ================= */

document.getElementById("searchBox")
.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    routeQuery(e.target.value.trim());
  }
});
</script>

</body>
</html>
