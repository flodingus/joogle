<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:Arial;background:#fff;color:#202124}
.center{display:grid;place-items:center;min-height:75vh}
.logo{font-size:70px;font-weight:bold}
.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}
.search{width:600px;max-width:90%;padding:12px 20px;border-radius:999px;border:1px solid #dadce0;font-size:16px}
.results{max-width:900px;margin:20px auto;padding:0 16px}
.card{border:1px solid #dadce0;border-radius:12px;padding:12px;margin-bottom:10px}
#map{height:300px;border-radius:12px;margin-top:12px}
.error{color:red;font-weight:bold}
</style>
</head>

<body>

<div class="center" id="home">
  <div>
    <div class="logo">
      <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>
    <input id="searchInput" class="search" placeholder="Search Joogle...">
  </div>
</div>

<div class="results" id="results" style="display:none"></div>

<script>
const API = "https://api.joogle.pro";
const input = document.getElementById("searchInput");
const resultsDiv = document.getElementById("results");
const home = document.getElementById("home");

let map = null;

function showResults(){
  home.style.display="none";
  resultsDiv.style.display="block";
}

async function fetchJSON(url){
  const res = await fetch(url);
  if(!res.ok){
    throw new Error("API returned " + res.status);
  }
  return res.json();
}

async function runSearch(query){
  if(!query) return;

  showResults();

  resultsDiv.innerHTML = "Searching...";

  try{
    const geo = await fetchJSON(API + "/geo");
    const lat = geo.geo.latitude;
    const lon = geo.geo.longitude;

    const places = await fetchJSON(
      API + `/places?cat=restaurant&lat=${lat}&lon=${lon}`
    );

    if(!places.items || places.items.length === 0){
      resultsDiv.innerHTML = "<div class='error'>No results found.</div>";
      return;
    }

    let html = "";

    places.items.slice(0,10).forEach(p=>{
      html += `
        <div class="card">
          <b>${p.name || "Business"}</b><br>
          ${p.address?.street || ""} ${p.address?.city || ""}
        </div>
      `;
    });

    html += `<div id="map"></div>`;

    resultsDiv.innerHTML = html;

    if(!map){
      map = L.map("map").setView([lat,lon],13);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
        maxZoom:19
      }).addTo(map);
    }

    places.items.slice(0,20).forEach(p=>{
      if(p.lat && p.lon){
        L.marker([p.lat,p.lon]).addTo(map);
      }
    });

  }catch(err){
    resultsDiv.innerHTML = "<div class='error'>Error: " + err.message + "</div>";
  }
}

// ENTER key
input.addEventListener("keydown", e=>{
  if(e.key === "Enter"){
    runSearch(input.value);
  }
});

// Instant typing
let timer=null;
input.addEventListener("input", e=>{
  clearTimeout(timer);
  timer = setTimeout(()=>{
    runSearch(input.value);
  }, 400);
});
</script>

</body>
</html>
