<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:baseline;
  letter-spacing:-3px;
  margin-bottom:30px;
}

/* 🔒 LOCKED TWIN-O FORMAT */
.twin-o{
  display:inline-block;
  position:relative;
  color:#EA4335;
  animation:bounce 1.6s ease-in-out infinite;
}

.twin-o:nth-child(3){
  margin-left:-6px;
}

.twin-o::after{
  content:"";
  position:absolute;
  left:50%;
  top:30%;
  transform:translateX(-50%);
  width:2px;
  height:40%;
  background:linear-gradient(
    to bottom,
    rgba(0,0,0,0.15),
    rgba(0,0,0,0)
  );
  border-radius:2px;
}

@keyframes bounce{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-14px); }
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{ margin-top:25px; }

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}
button:hover{ background:#f1f3f4; }

.feature-card{
  width:90%;
  max-width:900px;
  margin-top:30px;
}

.weather-card{
  border:1px solid #dadce0;
  border-radius:12px;
  background:#fdf7f9;
  overflow:hidden;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
  padding:20px;
}

.weather-accent{
  height:4px;
  background:#ff9eb5;
  margin:-20px -20px 20px -20px;
}

.forecast-row{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.forecast-day{
  text-align:center;
  font-size:13px;
}

.results{
  margin-top:30px;
  width:90%;
  max-width:800px;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">

  <div class="joogle-logo">
    <span style="color:#4285F4;">J</span>
    <span class="twin-o">o</span>
    <span class="twin-o">o</span>
    <span style="color:#4285F4;">g</span>
    <span style="color:#34A853;">l</span>
    <span style="color:#EA4335;">e</span>
  </div>

  <input class="search-box" id="searchInput" placeholder="Search Joogle..." />

  <div class="buttons">
    <button onclick="search()">Joogle Search</button>
    <button onclick="imFeelingJoogly()">I'm Feeling Joogly</button>
  </div>

  <div class="feature-card" id="featureCard"></div>
  <div class="results" id="results"></div>

</div>

<div class="footer">
Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<script>
const WORKER_URL="https://joogle-proxy.flodingus.workers.dev/";

async function search(){
  const q=document.getElementById("searchInput").value.trim();
  if(!q) return;

  document.getElementById("featureCard").innerHTML="";
  document.getElementById("results").innerHTML="";

  const lower=q.toLowerCase();

  if(lower.startsWith("weather") || lower.startsWith("forecast")){
    await handleWeather(q);
    return;
  }

  const res=await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({q})
  });

  const data=await res.json();
  renderResults(data.organic||[]);
}

function renderResults(results){
  document.getElementById("results").innerHTML=
  results.map(r=>`
    <div style="margin-bottom:20px;">
      <a href="${r.link}" target="_blank"
         style="font-size:18px;color:#1a0dab;text-decoration:none;">
         ${r.title}
      </a>
      <div style="color:#006621;font-size:14px;">${r.link}</div>
      <div style="color:#545454;font-size:14px;">${r.snippet||""}</div>
    </div>
  `).join("");
}

/* ================= INTELLIGENT WEATHER ================= */

async function handleWeather(query){

  let location=query.replace(/weather|forecast/i,"").trim();

  // AUTO GEOLOCATION
  if(!location){
    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(async pos=>{
        await fetchWeather(pos.coords.latitude,pos.coords.longitude,"Your Location");
      });
      return;
    }else{
      location="Phoenix AZ";
    }
  }

  const geo=await fetch(
    `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=5`
  );

  const geoData=await geo.json();

  if(!geoData.results){
    document.getElementById("featureCard").innerHTML=
      "<div>No location found.</div>";
    return;
  }

  // MULTIPLE MATCHES
  if(geoData.results.length>1){
    let optionsHTML=geoData.results.map(r=>`
      <div style="cursor:pointer;padding:8px;border-bottom:1px solid #eee;"
        onclick="fetchWeather(${r.latitude},${r.longitude},'${r.name}, ${r.admin1 || ""}')">
        ${r.name}, ${r.admin1 || ""} ${r.country}
      </div>
    `).join("");

    document.getElementById("featureCard").innerHTML=
      `<div class="weather-card">
         <strong>Select a location:</strong>
         ${optionsHTML}
       </div>`;
    return;
  }

  const r=geoData.results[0];
  await fetchWeather(r.latitude,r.longitude,`${r.name}, ${r.admin1 || ""}`);
}

async function fetchWeather(lat,lon,label){

  const weather=await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&forecast_days=5`
  );

  const wData=await weather.json();

  let forecastHTML="";
  for(let i=0;i<wData.daily.time.length;i++){
    const day=new Date(wData.daily.time[i]);
    const name=day.toLocaleDateString("en-US",{weekday:"short"});
    forecastHTML+=`
      <div class="forecast-day">
        <div><strong>${name}</strong></div>
        <div>${Math.round(wData.daily.temperature_2m_max[i])}°</div>
        <div style="color:#777;">
          ${Math.round(wData.daily.temperature_2m_min[i])}°
        </div>
      </div>
    `;
  }

  document.getElementById("featureCard").innerHTML=`
    <div class="weather-card">
      <div class="weather-accent"></div>
      <div style="font-size:40px;">
        ${Math.round(wData.current_weather.temperature)}°F
      </div>
      <div>${label}</div>
      <div class="forecast-row">
        ${forecastHTML}
      </div>
    </div>
  `;
}

function imFeelingJoogly(){
  const input=document.getElementById("searchInput");
  const randomQueries=[
    "funny cat videos",
    "why is the sky blue",
    "best pizza near me",
    "weather phoenix az",
    "how to get rich"
  ];
  input.value=randomQueries[Math.floor(Math.random()*randomQueries.length)];
  search();
}

document.getElementById("searchInput").addEventListener("keydown",e=>{
  if(e.key==="Enter") search();
});
</script>

</body>
</html>
