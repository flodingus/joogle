<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:flex-end;
  letter-spacing:-3px;
  margin-bottom:30px;
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{ margin-top:25px; }

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}

.feature-card{
  width:90%;
  max-width:800px;
  margin-top:30px;
}

.map-container{
  height:350px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #dadce0;
}

.place-list{
  margin-top:15px;
  font-size:14px;
}

.place-item{
  margin-bottom:8px;
}

.results{
  margin-top:30px;
  width:90%;
  max-width:800px;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">
  <div class="joogle-logo">Joogle</div>
  <input class="search-box" id="searchInput" placeholder="Search Joogle..." />
  <div class="buttons">
    <button onclick="search()">Joogle Search</button>
  </div>
  <div class="feature-card" id="featureCard"></div>
  <div class="results" id="results"></div>
</div>

<div class="footer">
Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const WORKER_URL="https://joogle-proxy.flodingus.workers.dev/";

const categories={
restaurant:"restaurant",
coffee:"cafe",
gas:"fuel",
bar:"bar",
library:"library"
};

async function search(){
const q=document.getElementById("searchInput").value.trim();
if(!q) return;

document.getElementById("featureCard").innerHTML="";
document.getElementById("results").innerHTML="Searching...";

if(q.toLowerCase().includes("near me")){
await handleNearMe(q);
}

const res=await fetch(WORKER_URL,{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({q})
});
const data=await res.json();
renderResults(data.organic||[]);
}

function renderResults(results){
document.getElementById("results").innerHTML=
results.map(r=>`
<div style="margin-bottom:20px;">
<a href="${r.link}" target="_blank" style="font-size:18px;color:#1a0dab;text-decoration:none;">${r.title}</a>
<div style="color:#006621;font-size:14px;">${r.link}</div>
<div style="color:#545454;font-size:14px;">${r.snippet||""}</div>
</div>
`).join("");
}

async function handleNearMe(query){
let type=null;
for(const key in categories){
if(query.toLowerCase().includes(key)){
type=categories[key];
}
}
if(!type) return;

let lat,lon;

try{
await new Promise((resolve,reject)=>{
navigator.geolocation.getCurrentPosition(pos=>{
lat=pos.coords.latitude;
lon=pos.coords.longitude;
resolve();
},()=>reject());
});
}catch{
const ip=await fetch("https://ipapi.co/json/");
const ipData=await ip.json();
lat=ipData.latitude;
lon=ipData.longitude;
}

document.getElementById("featureCard").innerHTML=
`<div class="map-container" id="map"></div>
<div class="place-list" id="placeList">Loading places...</div>`;

const map=L.map("map").setView([lat,lon],14);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
attribution:"© OpenStreetMap"
}).addTo(map);

L.marker([lat,lon]).addTo(map).bindPopup("You are here").openPopup();

const overpass=`
[out:json];
node
["amenity"="${type}"]
(around:1500,${lat},${lon});
out;
`;

const response=await fetch("https://overpass-api.de/api/interpreter",{
method:"POST",
body:overpass
});
const data=await response.json();

let listHTML="";
data.elements.slice(0,10).forEach(place=>{
if(place.tags && place.tags.name){
L.marker([place.lat,place.lon]).addTo(map)
.bindPopup(place.tags.name);
listHTML+=`<div class="place-item">${place.tags.name}</div>`;
}
});

document.getElementById("placeList").innerHTML=listHTML||"No places found.";
}

document.getElementById("searchInput").addEventListener("keydown",e=>{
if(e.key==="Enter") search();
});
</script>

</body>
</html>
