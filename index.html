<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle Pro</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<style>
:root {
  --bg:#ffffff;
  --text:#202124;
  --border:#dadce0;
  --link:#1a0dab;
  --card:#f8f9fa;
}

body.dark {
  --bg:#121212;
  --text:#e8e8e8;
  --border:#333;
  --link:#8ab4f8;
  --card:#1e1e1e;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  display:flex;
  align-items:center;
  padding:15px 24px;
  border-bottom:1px solid var(--border);
  gap:15px;
  position:relative;
}

.logo{
  font-size:26px;
  font-weight:bold;
  cursor:pointer;
}

.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.searchInput{
  flex:1;
  padding:10px 18px;
  border-radius:24px;
  border:1px solid var(--border);
  font-size:16px;
  background:var(--bg);
  color:var(--text);
}

.suggestions{
  position:absolute;
  top:60px;
  left:120px;
  right:120px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:12px;
  display:none;
  z-index:999;
}

.suggestionItem{
  padding:10px;
  cursor:pointer;
}

.suggestionItem:hover{
  background:var(--card);
}

.home{
  display:flex;
  justify-content:center;
  align-items:center;
  height:70vh;
  font-size:90px;
  font-weight:bold;
}

.results{
  max-width:900px;
  margin:20px auto;
  padding:0 20px;
}

.summaryCard{
  background:var(--card);
  padding:20px;
  border-radius:12px;
  margin-bottom:25px;
}

.resultItem{margin-bottom:25px;}
.resultItem h3{color:var(--link);margin:0;}

.trending{
  margin-top:10px;
  font-size:14px;
}

.trending span{
  margin-right:10px;
  cursor:pointer;
  color:var(--link);
}

#palette{
  position:fixed;
  top:20%;
  left:50%;
  transform:translateX(-50%);
  width:400px;
  background:var(--bg);
  border:1px solid var(--border);
  border-radius:12px;
  padding:15px;
  display:none;
  z-index:2000;
}

.weatherCard{
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  color:white;
  padding:20px;
  border-radius:16px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.href='/'">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
  <input id="searchBox" class="searchInput" placeholder="Search Joogle...">
  <button id="voiceBtn">🎙</button>
  <button id="darkToggle">🌙</button>
  <div id="suggestions" class="suggestions"></div>
</div>

<div class="home" id="homeSection">Joogle</div>
<div class="results" id="results"></div>

<div id="palette">
  <input id="paletteInput" placeholder="Command..." style="width:100%;padding:8px;">
</div>

<script>
const PROXY_URL = "https://joogle-proxy.flodingus.workers.dev";

/* DARK MODE */
document.getElementById("darkToggle").onclick = ()=>{
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",
    document.body.classList.contains("dark"));
};
if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

/* TRENDING */
const trendingTerms=["Weather","News","Restaurants near me","Sports","Stock market"];
function showTrending(){
  const home=document.getElementById("homeSection");
  home.innerHTML="Joogle<br><div class='trending'>Trending: "+
    trendingTerms.map(t=>`<span onclick="performSearch('${t}')">${t}</span>`).join("")
    +"</div>";
}
showTrending();

/* VOICE SEARCH */
document.getElementById("voiceBtn").onclick=()=>{
  const rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.onresult=e=>{
    const text=e.results[0][0].transcript;
    document.getElementById("searchBox").value=text;
    performSearch(text);
  };
  rec.start();
};

/* COMMAND PALETTE */
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key==="k"){
    document.getElementById("palette").style.display="block";
    document.getElementById("paletteInput").focus();
  }
});

/* AUTOCOMPLETE */
const input=document.getElementById("searchBox");
const suggestions=document.getElementById("suggestions");

input.addEventListener("input",async e=>{
  const q=e.target.value;
  if(q.length<2){ suggestions.style.display="none"; return; }

  const res=await fetch(PROXY_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({q})
  });
  const data=await res.json();

  if(!data.relatedSearches){ suggestions.style.display="none"; return; }

  suggestions.innerHTML="";
  data.relatedSearches.slice(0,5).forEach(s=>{
    const div=document.createElement("div");
    div.className="suggestionItem";
    div.innerText=s.query;
    div.onclick=()=>performSearch(s.query);
    suggestions.appendChild(div);
  });

  suggestions.style.display="block";
});

/* SEARCH */
async function performSearch(query){
  suggestions.style.display="none";
  document.getElementById("homeSection").style.display="none";
  document.getElementById("results").innerHTML="Loading...";

  if(query.toLowerCase().includes("weather")){
    return showWeather();
  }

  if(query.toLowerCase().includes("near me")){
    return showNearby(query);
  }

  const res=await fetch(PROXY_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({q:query})
  });
  const data=await res.json();

  let html="";
  if(data.organic && data.organic.length>0){
    html+=`<div class="summaryCard">${data.organic[0].snippet}</div>`;
    data.organic.forEach(r=>{
      html+=`<div class="resultItem">
        <a href="${r.link}" target="_blank">
        <h3>${r.title}</h3></a>
        <p>${r.snippet}</p>
      </div>`;
    });
  }
  document.getElementById("results").innerHTML=html;
}

/* WEATHER WITH HOURLY CHART */
async function showWeather(){
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude,longitude}=pos.coords;
    const res=await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&hourly=temperature_2m&temperature_unit=fahrenheit&timezone=auto`
    );
    const data=await res.json();

    document.getElementById("results").innerHTML=
      `<div class="weatherCard">
        <h2>Weather</h2>
        <canvas id="weatherChart"></canvas>
      </div>`;

    new Chart(document.getElementById("weatherChart"),{
      type:"line",
      data:{
        labels:data.hourly.time.slice(0,12),
        datasets:[{
          label:"Temp °F",
          data:data.hourly.temperature_2m.slice(0,12)
        }]
      }
    });
  });
}

/* NEAR ME MAP */
async function showNearby(query){
  navigator.geolocation.getCurrentPosition(async pos=>{
    const {latitude,longitude}=pos.coords;
    const mapHTML=`<div id="map" style="height:400px"></div>`;
    document.getElementById("results").innerHTML=mapHTML;

    const map=L.map('map').setView([latitude,longitude],14);

    L.tileLayer(
      document.body.classList.contains("dark") ?
      'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png' :
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
    ).addTo(map);

    L.marker([latitude,longitude]).addTo(map)
      .bindPopup("You are here").openPopup();
  });
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") performSearch(input.value);
});
</script>

</body>
</html>
