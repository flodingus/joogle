<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Joogle</title>

<link rel="preconnect" href="https://cse.google.com">
<link rel="preconnect" href="https://www.google.com">

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#202124;
  margin:0;
  text-align:center;
}
body.dark{
  background:#202124;
  color:#e8eaed;
}

.logo{
  font-size:80px;
  margin-top:80px;
  font-weight:bold;
}
.logo span:nth-child(1){color:#4285f4}
.logo span:nth-child(2){color:#ea4335}
.logo span:nth-child(3){color:#fbbc05}
.logo span:nth-child(4){color:#4285f4}
.logo span:nth-child(5){color:#34a853}
.logo span:nth-child(6){color:#ea4335}

.searchbox{
  margin:25px auto;
  width:90%;
  max-width:600px;
  position:relative;
}

input{
  width:100%;
  padding:14px;
  border-radius:30px;
  border:1px solid #dfe1e5;
  font-size:16px;
  outline:none;
}
input:focus{
  box-shadow:0 1px 6px rgba(32,33,36,.28);
}

#suggestions{
  position:absolute;
  width:100%;
  background:white;
  border:1px solid #ddd;
  border-top:none;
  text-align:left;
  z-index:999;
}
body.dark #suggestions{
  background:#303134;
}

.suggestion{
  padding:10px;
  cursor:pointer;
}
.suggestion:hover{
  background:#f1f3f4;
}

.buttons{
  margin-top:20px;
}
button{
  margin:5px;
  padding:10px 16px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  cursor:pointer;
}
body.dark button{
  background:#303134;
  color:white;
}

#darkToggle{
  position:absolute;
  right:20px;
  top:20px;
  cursor:pointer;
}

.gsc-result{
  border-radius:12px !important;
  padding:12px !important;
}
.gsc-result:hover{
  box-shadow:0 2px 12px rgba(0,0,0,.15);
}
.gsc-search-box{display:none !important;}
</style>

<script>
const CX="427c85c8321db4c63";

/* ---------- DARK MODE ---------- */
function setDark(on){
  document.body.classList.toggle("dark",on);
  localStorage.setItem("dark",on);
}
window.onload=()=>setDark(localStorage.getItem("dark")==="true");

/* ---------- LOAD GOOGLE CSE ---------- */
window.__gcse={
 callback:function(){
   const params=new URLSearchParams(location.search);
   const q=params.get("q");
   if(q) runSearch(q);
 }
};

(function(){
  const s=document.createElement("script");
  s.async=true;
  s.src="https://cse.google.com/cse.js?cx="+CX;
  document.head.appendChild(s);
})();
</script>
</head>

<body>

<button id="darkToggle" onclick="setDark(!document.body.classList.contains('dark'))">🌙</button>

<div class="logo">
<span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
</div>

<div class="searchbox">
<input id="searchBox" placeholder="Search the web">
<div id="suggestions"></div>
</div>

<div class="buttons">
<button onclick="runSearch()">Joogle Search</button>
<button onclick="feelingJoogly()">I'm Feeling Joogly</button>
</div>

<div class="gcse-searchresults-only"></div>

<script>
const input=document.getElementById("searchBox");
const suggestions=document.getElementById("suggestions");

/* ---------- SEARCH EXECUTION (FIXED) ---------- */
function getCSE(){
  try{
    return google.search.cse.element.getElement('searchresults-only0');
  }catch(e){return null;}
}

function runSearch(val){
  const query=(val||input.value).trim();
  if(!query)return;

  const url=new URL(location);
  url.searchParams.set("q",query);
  history.replaceState({},'',url);

  const start=Date.now();

  function wait(){
    const el=getCSE();
    if(el){
      el.execute(query);
      return;
    }
    if(Date.now()-start<5000)
      requestAnimationFrame(wait);
    else
      location.href="?q="+encodeURIComponent(query);
  }
  wait();
}

/* ENTER KEY */
input.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    e.preventDefault();
    runSearch();
  }
});

/* ---------- I'M FEELING JOOGY ---------- */
function feelingJoogly(){
  const q=input.value.trim();
  if(!q)return;
  location.href=
   "https://www.google.com/search?q="+encodeURIComponent(q)+"&btnI=1";
}

/* ---------- GOOGLE SUGGESTIONS ---------- */
input.addEventListener("input",async()=>{
  const q=input.value;
  if(!q){suggestions.innerHTML="";return;}

  const res=await fetch(
    "https://suggestqueries.google.com/complete/search?client=firefox&q="+encodeURIComponent(q)
  );
  const data=await res.json();

  suggestions.innerHTML="";
  data[1].slice(0,8).forEach(text=>{
    const div=document.createElement("div");
    div.className="suggestion";
    div.textContent=text;
    div.onclick=()=>{
      input.value=text;
      suggestions.innerHTML="";
      runSearch(text);
    };
    suggestions.appendChild(div);
  });
});

/* ---------- SPAM FILTER ---------- */
const blocked=["pinterest.","quora.","brainly.","answers.com"];

new MutationObserver(()=>{
 document.querySelectorAll(".gsc-result").forEach(r=>{
   const a=r.querySelector("a");
   if(!a)return;
   if(blocked.some(d=>a.href.includes(d)))
     r.style.display="none";
 });
}).observe(document.body,{childList:true,subtree:true});
</script>

</body>
</html>
