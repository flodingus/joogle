<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text y='70%' x='50%' text-anchor='middle' font-size='80'>J</text>
</svg>">

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  background:#ffffff;
  transition: background 0.6s ease;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.logo{
  font-size:64px;
  font-weight:500;
  margin-bottom:30px;
  display:flex;
}

.o{
  display:inline-block;
}

.bounce{
  animation:bounce 0.6s ease;
}

@keyframes bounce{
  0%{transform:translateY(0);}
  50%{transform:translateY(-12px);}
  100%{transform:translateY(0);}
}

.eye{
  position:relative;
}

.eye::after{
  content:'';
  position:absolute;
  width:100%;
  height:100%;
  background:black;
  border-radius:50%;
  top:0;
  left:0;
  transform:scaleY(0);
  transform-origin:center;
  transition:transform 0.4s ease;
}

.eye.wink::after{
  transform:scaleY(1);
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{
  margin-top:25px;
}

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}

button:hover{
  background:#f1f3f4;
}

.results{
  margin-top:40px;
  width:90%;
  max-width:800px;
}

.result{
  margin-bottom:28px;
}

.result a{
  font-size:18px;
  color:#1a0dab;
  text-decoration:none;
}

.result a:hover{
  text-decoration:underline;
}

.result .link{
  font-size:14px;
  color:#006621;
}

.result .snippet{
  font-size:14px;
  color:#545454;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}

.love-page{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:linear-gradient(to bottom, #ffffff 0%, #fff5f7 100%);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.8s ease;
}

.love-page.active{
  opacity:1;
  pointer-events:auto;
}

.love-text{
  font-size:28px;
  text-align:center;
  margin-bottom:30px;
}

.play-btn{
  padding:12px 24px;
  border-radius:30px;
  border:none;
  background:#ff9eb5;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="main">
  <div class="logo" id="logo">
    J
    <span class="o" id="o1">o</span>
    <span class="o" id="o2">o</span>
    g l e
  </div>

  <input class="search-box" id="searchInput" placeholder="Search Joogle..." />

  <div class="buttons">
    <button onclick="search()">Joogle Search</button>
    <button onclick="imFeelingJoogly()">I'm Feeling Joogly</button>
  </div>

  <div class="results" id="results"></div>
</div>

<div class="footer">
  Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<div class="love-page" id="lovePage">
  <div class="love-text">
    Out of all the searches in the world…<br>
    you’re my favorite.
  </div>
  <button class="play-btn" onclick="playSong()">Play Something Special</button>
  <button style="margin-top:20px;" onclick="exitLove()">Back to Joogle</button>
</div>

<script>
const WORKER_URL = "https://joogle-proxy.flodingus.workers.dev/";

const o1 = document.getElementById("o1");
const o2 = document.getElementById("o2");
const resultsDiv = document.getElementById("results");
const input = document.getElementById("searchInput");
const lovePage = document.getElementById("lovePage");

function logoLoop(){
  o1.classList.add("bounce");
  o2.classList.add("bounce");

  setTimeout(()=>{
    o2.classList.add("eye");
    setTimeout(()=>{
      o2.classList.add("wink");
      setTimeout(()=>{
        o2.classList.remove("wink");
        setTimeout(()=>{
          o2.classList.remove("eye");
          o1.classList.remove("bounce");
          o2.classList.remove("bounce");
        },300);
      },300);
    },300);
  },800);
}
setInterval(logoLoop,6500);

async function search(){
  const q = input.value.trim();
  if(!q) return;

  history.pushState({}, "", "?q=" + encodeURIComponent(q));
  resultsDiv.innerHTML = "Searching...";

  try{
    const res = await fetch(WORKER_URL,{
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body:JSON.stringify({ q })
    });
    const data = await res.json();
    renderResults(data.organic || []);
  }catch(e){
    resultsDiv.innerHTML = "Search failed.";
  }
}

function renderResults(results){
  resultsDiv.innerHTML = results.map(r=>`
    <div class="result">
      <a href="${r.link}" target="_blank">${r.title}</a>
      <div class="link">${r.link}</div>
      <div class="snippet">${r.snippet || ""}</div>
    </div>
  `).join("");
}

function imFeelingJoogly(){
  if(Math.random()<0.20){
    lovePage.classList.add("active");
  }else{
    search();
  }
}

function exitLove(){
  lovePage.classList.remove("active");
}

function playSong(){
  window.open("https://open.spotify.com/search/every%20little%20thing%20is%20magic","_blank");
}

input.addEventListener("keydown",e=>{
  if(e.key==="Enter") search();
});

window.onload=()=>{
  const params=new URLSearchParams(window.location.search);
  const q=params.get("q");
  if(q){
    input.value=q;
    search();
  }
};
</script>

</body>
</html>
