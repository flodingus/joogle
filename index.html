<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle</title>

<style>
:root {
  --bg:#ffffff;
  --text:#202124;
  --border:#dadce0;
  --link:#1a0dab;
}

body.dark {
  --bg:#121212;
  --text:#e8e8e8;
  --border:#333;
  --link:#8ab4f8;
}

body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:var(--bg);
  color:var(--text);
}

.header{
  display:flex;
  align-items:center;
  padding:15px 24px;
  border-bottom:1px solid var(--border);
  gap:15px;
}

.logo{
  font-size:26px;
  font-weight:bold;
  cursor:pointer;
}

.searchInput{
  flex:1;
  max-width:650px;
  padding:10px 18px;
  border-radius:24px;
  border:1px solid var(--border);
  font-size:16px;
  background:var(--bg);
  color:var(--text);
}

button{
  cursor:pointer;
}

.home{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:75vh;
}

.homeLogo{
  font-size:90px;
  font-weight:bold;
  margin-bottom:30px;
}

.results{
  max-width:900px;
  margin:20px auto;
  padding:0 20px;
}

.resultItem{
  margin-bottom:28px;
}

.resultItem h3{
  color:var(--link);
  margin:0;
}

pre{
  background:#000;
  color:#0f0;
  padding:15px;
  overflow:auto;
}

iframe{
  border-radius:12px;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.href='/'">Joogle</div>
  <input id="searchBox" class="searchInput" placeholder="Search Joogle...">
  <button id="darkToggle">🌙</button>
</div>

<div class="home" id="homeSection">
  <div class="homeLogo">Joogle</div>
</div>

<div class="results" id="results"></div>

<script>

const PROXY_URL = "https://joogle-proxy.flodingus.workers.dev/";

/* ================= DARK MODE ================= */

const toggle = document.getElementById("darkToggle");

toggle.onclick = () => {
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",
    document.body.classList.contains("dark"));
};

if(localStorage.getItem("darkMode") === "true"){
  document.body.classList.add("dark");
}

/* ================= UTILITIES ================= */

function showResults(html){
  document.getElementById("homeSection").style.display="none";
  document.getElementById("results").innerHTML = html;
}

function displayRaw(text){
  showResults(`<pre>${text}</pre>`);
}

/* ================= COMMAND PARSER ================= */

async function handleCommand(query){
  const parts = query.split(" ");
  const command = parts[0].toLowerCase();
  const target = parts[1];

  if(command === "ping"){
    const res = await fetch(`https://api.hackertarget.com/nping/?q=${target}`);
    const text = await res.text();
    displayRaw(text);
    return true;
  }

  if(command === "dig"){
    const res = await fetch(`https://api.hackertarget.com/dnslookup/?q=${target}`);
    const text = await res.text();
    displayRaw(text);
    return true;
  }

  if(command === "traceroute"){
    const res = await fetch(`https://api.hackertarget.com/mtr/?q=${target}`);
    const text = await res.text();
    displayRaw(text);
    return true;
  }

  return false;
}

/* ================= WEATHER ================= */

async function showWeather(){
  navigator.geolocation.getCurrentPosition(async pos => {
    const { latitude, longitude } = pos.coords;

    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&hourly=temperature_2m&daily=temperature_2m_max,temperature_2m_min&timezone=auto`
    );

    const data = await res.json();

    let html = `<h2>Weather</h2>
      <p>Current: ${data.current_weather.temperature}°C</p>
      <h3>7 Day Forecast</h3>`;

    data.daily.temperature_2m_max.forEach((max,i)=>{
      html += `<p>Day ${i+1}: High ${max}°C / Low ${data.daily.temperature_2m_min[i]}°C</p>`;
    });

    showResults(html);

  });
}

/* ================= MAP ================= */

function showMap(query){
  const encoded = encodeURIComponent(query);
  showResults(`
    <iframe
      width="100%"
      height="400"
      src="https://www.openstreetmap.org/export/embed.html?search=${encoded}">
    </iframe>
  `);
}

/* ================= SEARCH ================= */

async function performSearch(query){

  if(await handleCommand(query)) return;

  if(query.toLowerCase().includes("weather")){
    showWeather();
    return;
  }

  if(query.toLowerCase().includes("near me") ||
     query.toLowerCase().includes("directions")){
    showMap(query);
    return;
  }

  showResults("Loading...");

  const response = await fetch(PROXY_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({ q: query })
  });

  const data = await response.json();

  let html = "";

  if(data.organic){
    data.organic.forEach(result=>{
      html += `
        <div class="resultItem">
          <a href="${result.link}" target="_blank">
            <h3>${result.title}</h3>
          </a>
          <p>${result.snippet}</p>
        </div>
      `;
    });
  } else {
    html = "No results found.";
  }

  showResults(html);
}

/* ================= INIT ================= */

document.addEventListener("DOMContentLoaded", function(){

  const input = document.getElementById("searchBox");

  input.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
      const query = input.value.trim();
      if(!query) return;
      window.history.pushState({}, "", "?q=" + encodeURIComponent(query));
      performSearch(query);
    }
  });

  const params = new URLSearchParams(window.location.search);
  const q = params.get("q");

  if(q){
    input.value = q;
    performSearch(q);
  }

});
</script>

</body>
</html>
