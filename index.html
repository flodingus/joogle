<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:flex-end;
  letter-spacing:-3px;
  margin-bottom:30px;
}

/* LOCKED */
.eye-svg{
  width:0.74em;
  height:0.74em;
  vertical-align:-0.085em;
}

.bounce{ animation:bounce 0.45s ease; }

@keyframes bounce{
  0%{transform:translateY(0);}
  50%{transform:translateY(-14px);}
  100%{transform:translateY(0);}
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{ margin-top:25px; }

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}
button:hover{ background:#f1f3f4; }

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">
  <div class="joogle-logo" id="logo"></div>

  <input class="search-box" id="searchInput" placeholder="Search Joogle..." />

  <div class="buttons">
    <button onclick="search()">Joogle Search</button>
    <button onclick="imFeelingJoogly()">I'm Feeling Joogly</button>
  </div>
</div>

<div class="footer">
Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<script>
function initLogo(){
const logo=document.getElementById("logo");

logo.innerHTML=`
<span style="color:#4285F4;">J</span>
<span style="color:#EA4335;">o</span>

<svg class="eye-svg" viewBox="0 0 60 60">
  <!-- Smaller circle -->
  <circle cx="30" cy="32" r="15.5" fill="white" stroke="#EA4335" stroke-width="4"/>
  <circle cx="30" cy="32" r="5" fill="black"/>
  <circle cx="32" cy="29" r="2" fill="white"/>

  <!-- 5 balanced lashes -->
  <path d="M18 18 Q22 6 26 18" stroke="black" stroke-width="2" fill="none"/>
  <path d="M23 14 Q27 4 31 14" stroke="black" stroke-width="2" fill="none"/>
  <path d="M28 12 Q30 2 32 12" stroke="black" stroke-width="2" fill="none"/>
  <path d="M33 14 Q37 4 41 14" stroke="black" stroke-width="2" fill="none"/>
  <path d="M38 18 Q42 6 46 18" stroke="black" stroke-width="2" fill="none"/>

  <ellipse class="lid" cx="30" cy="32" rx="18" ry="0" fill="#EA4335" opacity="0"/>
</svg>

<span style="color:#4285F4;">g</span>
<span style="color:#34A853;">l</span>
<span style="color:#EA4335;">e</span>
`;

animateLogo();
}

function animateLogo(){
const eye=document.querySelector(".eye-svg");
const lid=document.querySelector("ellipse");

function loop(){
eye.classList.add("bounce");

setTimeout(()=>{
eye.classList.remove("bounce");

setTimeout(()=>{
lid.style.transition="all .3s ease";
lid.setAttribute("ry","18");
lid.style.opacity="1";

setTimeout(()=>{
lid.setAttribute("ry","0");
lid.style.opacity="0";
},1200);

},300);

},500);
}

setInterval(loop,3200);
}

function search(){}

function imFeelingJoogly(){
if(Math.random()<0.20){
alert("Julie Mode Activated 💕");
}else{
search();
}
}

document.getElementById("searchInput").addEventListener("keydown",e=>{
if(e.key==="Enter") search();
});

initLogo();
</script>

</body>
</html>
