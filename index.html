<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  letter-spacing:-3px;
  margin-bottom:30px;
}

.bounce{
  display:inline-block;
  animation:bounce 1.6s infinite ease-in-out;
}
@keyframes bounce{
  0%,100%{transform:translateY(0);}
  50%{transform:translateY(-14px);}
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{ margin-top:25px; }

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}
button:hover{ background:#f1f3f4; }

.feature-card{
  width:90%;
  max-width:900px;
  margin-top:30px;
}

.map-container{
  height:380px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #dadce0;
}

.place-list{
  margin-top:15px;
  font-size:14px;
}

.place-item{
  margin-bottom:10px;
  cursor:pointer;
  color:#1a0dab;
}
.place-item:hover{ text-decoration:underline; }

.results{
  margin-top:30px;
  width:90%;
  max-width:800px;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">
  <div class="joogle-logo">
    <span style="color:#4285F4;">J</span>
    <span class="bounce" style="color:#EA4335;">o</span>
    <span class="bounce" style="color:#EA4335;">o</span>
    <span style="color:#4285F4;">g</span>
    <span style="color:#34A853;">l</span>
    <span style="color:#EA4335;">e</span>
  </div>

  <input class="search-box" id="searchInput" placeholder="Search Joogle..." />
  <div class="buttons">
    <button onclick="search()">Joogle Search</button>
    <button onclick="imFeelingJoogly()">I'm Feeling Joogly</button>
  </div>

  <div class="feature-card" id="featureCard"></div>
  <div class="results" id="results"></div>
</div>

<div class="footer">
Joogle is a parody project created with love.
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>
const WORKER_URL="https://joogle-proxy.flodingus.workers.dev/";

/* ---------------- CATEGORY MAP ---------------- */

const categoryMap = {
  restaurant:["restaurant","pizza","food","dinner","lunch"],
  cafe:["coffee","cafe","espresso","starbucks"],
  bar:["bar","pub","brewery"],
  fuel:["gas","gas station","fuel"],
  pharmacy:["pharmacy","cvs","walgreens"],
  library:["library"],
  fitness_centre:["gym","fitness"],
  hospital:["hospital","er"],
  hotel:["hotel","motel"],
  supermarket:["grocery","supermarket","market"]
};

function detectCategory(query){
  const q=query.toLowerCase();
  for(const amenity in categoryMap){
    for(const keyword of categoryMap[amenity]){
      if(q.includes(keyword)){
        return amenity;
      }
    }
  }
  return "restaurant";
}

/* ---------------- SEARCH ---------------- */

async function search(){
  const q=document.getElementById("searchInput").value.trim();
  if(!q) return;

  document.getElementById("featureCard").innerHTML="";
  document.getElementById("results").innerHTML="";

  if(q.toLowerCase().includes("near me") || q.toLowerCase().includes("nearby")){
    await handleNearMe(q);
    return;
  }

  // Weather remains your locked working implementation
  if(q.toLowerCase().includes("weather") || q.toLowerCase().includes("forecast")){
    return handleWeather(q);
  }

  const res=await fetch(WORKER_URL,{
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({q})
  });
  const data=await res.json();
  renderResults(data.organic||[]);
}

function renderResults(results){
  document.getElementById("results").innerHTML=
  results.map(r=>`
  <div style="margin-bottom:20px;">
  <a href="${r.link}" target="_blank" style="font-size:18px;color:#1a0dab;text-decoration:none;">${r.title}</a>
  <div style="color:#006621;font-size:14px;">${r.link}</div>
  <div style="color:#545454;font-size:14px;">${r.snippet||""}</div>
  </div>
  `).join("");
}

/* ---------------- MAP ---------------- */

async function handleNearMe(query){

  let lat,lon;
  await new Promise((resolve,reject)=>{
    navigator.geolocation.getCurrentPosition(pos=>{
      lat=pos.coords.latitude;
      lon=pos.coords.longitude;
      resolve();
    },()=>reject());
  });

  const amenity=detectCategory(query);

  document.getElementById("featureCard").innerHTML=
  `<div class="map-container" id="map"></div>
   <div class="place-list" id="placeList">Loading...</div>`;

  const map=L.map("map").setView([lat,lon],14);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png").addTo(map);
  L.marker([lat,lon]).addTo(map).bindPopup("You are here");

  const overpass=`
  [out:json];
  node["amenity"="${amenity}"](around:3000,${lat},${lon});
  out;
  `;

  const response=await fetch("https://overpass-api.de/api/interpreter",{
    method:"POST",
    body:overpass
  });
  const data=await response.json();

  const listContainer=document.getElementById("placeList");
  listContainer.innerHTML="";

  data.elements.forEach(place=>{
    if(place.tags && place.tags.name){

      const distance = getDistance(lat,lon,place.lat,place.lon);

      const marker=L.marker([place.lat,place.lon]).addTo(map);

      marker.on("click",()=>{
        showDetails(place,distance);
      });

      const item=document.createElement("div");
      item.className="place-item";
      item.textContent=`${place.tags.name} (${distance.toFixed(2)} mi)`;

      item.addEventListener("click",()=>{
        map.setView([place.lat,place.lon],16);
        showDetails(place,distance);
      });

      listContainer.appendChild(item);
    }
  });
}

function showDetails(place,distance){
  document.getElementById("results").innerHTML=`
  <div style="margin-top:20px;">
  <h2>${place.tags.name}</h2>
  <div>Distance: ${distance.toFixed(2)} miles</div>
  <div>${place.tags["addr:street"]||""}</div>
  <div>${place.tags.phone||""}</div>
  <div>
  <a href="https://www.google.com/maps/dir/?api=1&destination=${place.lat},${place.lon}" target="_blank">
  Get Directions
  </a>
  </div>
  </div>`;
}

function getDistance(lat1,lon1,lat2,lon2){
  const R=3958.8;
  const dLat=(lat2-lat1)*Math.PI/180;
  const dLon=(lon2-lon1)*Math.PI/180;
  const a=Math.sin(dLat/2)**2+
    Math.cos(lat1*Math.PI/180)*
    Math.cos(lat2*Math.PI/180)*
    Math.sin(dLon/2)**2;
  const c=2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
  return R*c;
}

/* ---------------- JOOGLE ---------------- */

function imFeelingJoogly(){
  alert("Joogly Mode Activated 💕");
}

document.getElementById("searchInput")
.addEventListener("keydown",e=>{
  if(e.key==="Enter") search();
});
</script>

</body>
</html>
