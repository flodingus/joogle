<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#202124;
}
.header{
  display:flex;
  align-items:center;
  padding:15px 24px;
  border-bottom:1px solid #dadce0;
  gap:10px;
}
.logo{
  font-size:26px;
  font-weight:bold;
  cursor:pointer;
}
.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.searchInput{
  flex:1;
  padding:10px 18px;
  border-radius:24px;
  border:1px solid #dadce0;
  font-size:16px;
}

.button{
  padding:8px 14px;
  border-radius:20px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  cursor:pointer;
}

.hero{
  height:60vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.heroLogo{
  font-size:100px;
  font-weight:bold;
  letter-spacing:-6px;
}

.bounce{
  display:inline-block;
  animation:bounce 2s infinite cubic-bezier(.28,.84,.42,1);
}
@keyframes bounce{
  0%,100%{transform:translateY(0)}
  30%{transform:translateY(-12px)}
  50%{transform:translateY(0)}
}

.results{
  max-width:900px;
  margin:30px auto;
  padding:0 20px;
}

.weatherCard{
  background:#f8f9fa;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
}
.weatherDay{
  display:flex;
  justify-content:space-between;
  padding:6px 0;
}

footer{
  text-align:center;
  font-size:12px;
  color:gray;
  padding:20px;
  opacity:.7;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.reload()">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>

  <form id="searchForm" style="flex:1;display:flex;gap:8px;">
    <input id="searchBox" class="searchInput" placeholder="Search Joogle...">
    <button class="button" type="submit">Search</button>
  </form>
</div>

<div id="hero" class="hero">
  <div class="heroLogo">
    <span>J</span>
    <span class="bounce">o</span>
    <span class="bounce">o</span>
    <span>g</span>
    <span>l</span>
    <span>e</span>
  </div>
</div>

<div class="results" id="main"></div>

<footer>
  Joogle is a private parody made with love and is not affiliated with Google LLC.
</footer>

<script>

const PROXY_URL="https://joogle-proxy.flodingus.workers.dev";

document.getElementById("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  performSearch(searchBox.value.trim());
});

async function performSearch(query){
  if(!query) return;

  if(query.toLowerCase().includes("weather")){
    loadWeather();
    return;
  }

  hero.style.display="none";
  main.innerHTML="Loading...";

  const res=await fetch(PROXY_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({q:query})
  });
  const data=await res.json();

  let html="";
  if(data.organic){
    data.organic.forEach(r=>{
      html+=`
      <div>
        <a href="${r.link}" target="_blank">
          <h3>${r.title}</h3>
        </a>
        <p>${r.snippet}</p>
      </div><br>`;
    });
  }
  main.innerHTML=html;
}

function loadWeather(){

  hero.style.display="none";
  main.innerHTML="Detecting location...";

  navigator.geolocation.getCurrentPosition(async pos=>{

    const lat=pos.coords.latitude;
    const lon=pos.coords.longitude;

    // Get city name
    const locRes=await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}`
    );
    const locData=await locRes.json();
    const city=
      locData.address.city ||
      locData.address.town ||
      locData.address.village ||
      locData.address.state;

    // Get weather
    const weatherRes=await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`
    );
    const weatherData=await weatherRes.json();

    let html=`
      <div class="weatherCard">
        <h2>${city}</h2>
        <h1>${Math.round(weatherData.current_weather.temperature)}°F</h1>
        <p>Wind: ${weatherData.current_weather.windspeed} mph</p>
        <hr>
    `;

    weatherData.daily.time.forEach((day,i)=>{
      html+=`
        <div class="weatherDay">
          <span>${day}</span>
          <span>
            ${Math.round(weatherData.daily.temperature_2m_max[i])}° /
            ${Math.round(weatherData.daily.temperature_2m_min[i])}°
          </span>
        </div>
      `;
    });

    html+="</div>";
    main.innerHTML=html;

  },()=>{
    main.innerHTML="Location access denied.";
  });
}

</script>

</body>
</html>
