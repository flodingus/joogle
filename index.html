<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:baseline;
  letter-spacing:-3px;
  margin-bottom:30px;
}

.twin-o{
  display:inline-block;
  color:#EA4335;
  animation:bounce 1.6s ease-in-out infinite;
}

.twin-o:nth-child(3){ margin-left:-6px; }

@keyframes bounce{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-14px); }
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{ margin-top:25px; }

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}
button:hover{ background:#f1f3f4; }

.feature-card{
  width:90%;
  max-width:900px;
  margin-top:30px;
}

.map-container{
  height:350px;
  border-radius:12px;
  overflow:hidden;
  margin-top:15px;
}

.results{
  margin-top:30px;
  width:90%;
  max-width:800px;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">

<div class="joogle-logo">
  <span style="color:#4285F4;">J</span>
  <span class="twin-o">o</span>
  <span class="twin-o">o</span>
  <span style="color:#4285F4;">g</span>
  <span style="color:#34A853;">l</span>
  <span style="color:#EA4335;">e</span>
</div>

<input class="search-box" id="searchInput" placeholder="Search Joogle..." />

<div class="buttons">
  <button id="searchBtn">Joogle Search</button>
  <button id="jooglyBtn">I'm Feeling Joogly</button>
</div>

<div class="feature-card" id="featureCard"></div>
<div class="results" id="results"></div>

</div>

<div class="footer">
Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script>

const WORKER_URL="https://joogle-proxy.flodingus.workers.dev/";

const LOCAL_KEYWORDS=[
  "restaurant","coffee","bar","gas","hotel",
  "library","pharmacy","grocery","pizza","near me"
];

/* ================= SEARCH ROUTER ================= */

async function search(){

  const input=document.getElementById("searchInput");
  const q=input.value.trim();
  if(!q) return;

  document.getElementById("featureCard").innerHTML="";
  document.getElementById("results").innerHTML="";

  const lower=q.toLowerCase();

  // WEATHER (FIXED REGEX)
  if(lower.startsWith("weather") || lower.startsWith("forecast")){
    await handleWeather(q);
    return;
  }

  // LOCAL INTENT
  if(LOCAL_KEYWORDS.some(k=>lower.includes(k))){
    await handleLocalSearch(q);
  }

  // ORGANIC ALWAYS RUNS
  await runOrganicSearch(q);
}

/* ================= ORGANIC ================= */

async function runOrganicSearch(q){

  try{
    const res=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q})
    });

    const data=await res.json();
    renderResults(data.organic||[]);
  }catch(err){
    console.error("Organic search error:",err);
  }
}

function renderResults(results){
  document.getElementById("results").innerHTML=
    results.map(r=>`
      <div style="margin-bottom:20px;">
        <a href="${r.link}" target="_blank"
           style="font-size:18px;color:#1a0dab;text-decoration:none;">
           ${r.title}
        </a>
        <div style="color:#006621;font-size:14px;">${r.link}</div>
        <div style="color:#545454;font-size:14px;">${r.snippet||""}</div>
      </div>
    `).join("");
}

/* ================= WEATHER ================= */

async function handleWeather(query){

  let location=query.replace(/^(weather|forecast)/i,"").trim();
  if(!location) location="Phoenix AZ";

  try{
    const geo=await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}`
    );
    const geoData=await geo.json();

    if(!geoData.results || geoData.results.length===0){
      document.getElementById("featureCard").innerHTML=
        `<div>No location found.</div>`;
      return;
    }

    const r=geoData.results[0];

    const weather=await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${r.latitude}&longitude=${r.longitude}&current_weather=true`
    );

    const wData=await weather.json();

    document.getElementById("featureCard").innerHTML=
      `<div style="border:1px solid #dadce0;border-radius:12px;padding:20px;">
         <div style="font-size:40px;">
           ${Math.round(wData.current_weather.temperature)}°F
         </div>
         <div>${r.name}${r.admin1 ? ", "+r.admin1 : ""}</div>
       </div>`;
  }catch(err){
    console.error("Weather error:",err);
  }
}

/* ================= LOCAL MAP ================= */

async function handleLocalSearch(query){

  try{
    const geo=await fetch(
      `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`
    );
    const geoData=await geo.json();
    if(!geoData.length) return;

    const lat=geoData[0].lat;
    const lon=geoData[0].lon;

    document.getElementById("featureCard").innerHTML=
      `<div id="map" class="map-container"></div>`;

    const map=L.map("map").setView([lat,lon],13);

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{
      attribution:'© OpenStreetMap'
    }).addTo(map);

    geoData.slice(0,8).forEach(place=>{
      L.marker([place.lat,place.lon])
        .addTo(map)
        .bindPopup(place.display_name);
    });

  }catch(err){
    console.error("Local error:",err);
  }
}

/* ================= JOOGLE ================= */

function imFeelingJoogly(){
  const input=document.getElementById("searchInput");
  const randomQueries=[
    "coffee near me",
    "weather Dallas TX",
    "best pizza in Phoenix",
    "funny cat videos"
  ];
  input.value=randomQueries[Math.floor(Math.random()*randomQueries.length)];
  search();
}

/* ================= EVENTS ================= */

document.getElementById("searchBtn").addEventListener("click",search);
document.getElementById("jooglyBtn").addEventListener("click",imFeelingJoogly);
document.getElementById("searchInput")
  .addEventListener("keydown",e=>{
    if(e.key==="Enter") search();
  });

</script>

</body>
</html>
