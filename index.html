<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#202124;
}

.header{
  display:flex;
  align-items:center;
  gap:20px;
  padding:15px 20px;
  border-bottom:1px solid #dadce0;
}

.logo{
  font-size:28px;
  font-weight:bold;
  cursor:pointer;
}

.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.home{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:70vh;
}

.homeLogo{
  font-size:80px;
  font-weight:bold;
  margin-bottom:20px;
}

.homeLogo span:nth-child(1){color:#4285F4}
.homeLogo span:nth-child(2){color:#DB4437}
.homeLogo span:nth-child(3){color:#F4B400}
.homeLogo span:nth-child(4){color:#4285F4}
.homeLogo span:nth-child(5){color:#0F9D58}
.homeLogo span:nth-child(6){color:#DB4437}

.gcse-search{
  width:600px;
  max-width:90%;
}
</style>

<!-- IMPORTANT: Replace cx below with your real one if different -->
<script async src="https://cse.google.com/cse.js?cx=427c85c8321db4c63"></script>

</head>

<body>

<div class="header">
  <div class="logo" onclick="location.href='/'">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
</div>

<div class="home">
  <div class="homeLogo">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>

  <!-- This renders BOTH search box and results inline -->
  <div class="gcse-search"></div>

</div>

</body>
</html>
