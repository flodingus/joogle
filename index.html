<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:baseline;
  letter-spacing:-3px;
  margin-bottom:30px;
}

/* 🔒 LOCKED TWIN-O FORMAT */
.twin-o{
  display:inline-block;
  color:#EA4335;
  animation:bounce 1.6s ease-in-out infinite;
}

.twin-o:nth-child(3){
  margin-left:-6px;
}

@keyframes bounce{
  0%,100%{ transform:translateY(0); }
  50%{ transform:translateY(-14px); }
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{
  margin-top:25px;
}

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}
button:hover{
  background:#f1f3f4;
}

.feature-card{
  width:90%;
  max-width:900px;
  margin-top:30px;
}

.weather-card{
  border:1px solid #dadce0;
  border-radius:12px;
  background:#fafafa;
  padding:20px;
  box-shadow:0 2px 6px rgba(0,0,0,0.05);
}

.forecast-row{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  border-top:1px solid #eee;
  padding-top:10px;
}

.forecast-day{
  text-align:center;
  font-size:13px;
}

.results{
  margin-top:30px;
  width:90%;
  max-width:800px;
}

.result-item{
  margin-bottom:20px;
}

.result-item a{
  font-size:18px;
  color:#1a0dab;
  text-decoration:none;
}

.result-url{
  color:#006621;
  font-size:14px;
}

.result-snippet{
  color:#545454;
  font-size:14px;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">

<div class="joogle-logo">
  <span style="color:#4285F4;">J</span>
  <span class="twin-o">o</span>
  <span class="twin-o">o</span>
  <span style="color:#4285F4;">g</span>
  <span style="color:#34A853;">l</span>
  <span style="color:#EA4335;">e</span>
</div>

<input class="search-box" id="searchInput" placeholder="Search Joogle..." />

<div class="buttons">
  <button id="searchBtn">Joogle Search</button>
  <button id="jooglyBtn">I'm Feeling Joogly</button>
</div>

<div class="feature-card" id="featureCard"></div>
<div class="results" id="results"></div>

</div>

<div class="footer">
Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<script>

const WORKER_URL="https://joogle-proxy.flodingus.workers.dev/";

/* ================= SEARCH ROUTER ================= */

async function search(){

  const q=document.getElementById("searchInput").value.trim();
  if(!q) return;

  clearUI();

  const lower=q.toLowerCase();

  if(lower.startsWith("weather") || lower.startsWith("forecast")){
    await handleWeather(q);
    return;
  }

  await runOrganicSearch(q);
}

function clearUI(){
  document.getElementById("featureCard").innerHTML="";
  document.getElementById("results").innerHTML="";
}

/* ================= ORGANIC ================= */

async function runOrganicSearch(q){

  try{
    const res=await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q})
    });

    const data=await res.json();
    renderResults(data.organic||[]);
  }catch(err){
    console.error("Organic search error:",err);
  }
}

function renderResults(results){

  const container=document.getElementById("results");

  container.innerHTML = results.map(r=>`
    <div class="result-item">
      <a href="${r.link}" target="_blank">${r.title}</a>
      <div class="result-url">${r.link}</div>
      <div class="result-snippet">${r.snippet||""}</div>
    </div>
  `).join("");
}

/* ================= WEATHER ================= */

async function handleWeather(query){

  let location=query.replace(/^(weather|forecast)/i,"").trim();
  if(!location) location="Phoenix AZ";

  try{
    const geo=await fetch(
      `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}`
    );
    const geoData=await geo.json();

    if(!geoData.results || geoData.results.length===0){
      document.getElementById("featureCard").innerHTML=
        `<div class="weather-card">No location found.</div>`;
      return;
    }

    const r=geoData.results[0];

    const weather=await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${r.latitude}&longitude=${r.longitude}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&forecast_days=5`
    );

    const wData=await weather.json();

    let forecastHTML="";
    for(let i=0;i<wData.daily.time.length;i++){
      const day=new Date(wData.daily.time[i]);
      const name=day.toLocaleDateString("en-US",{weekday:"short"});

      forecastHTML+=`
        <div class="forecast-day">
          <div><strong>${name}</strong></div>
          <div>${Math.round(wData.daily.temperature_2m_max[i])}°</div>
          <div style="color:#777;">
            ${Math.round(wData.daily.temperature_2m_min[i])}°
          </div>
        </div>
      `;
    }

    document.getElementById("featureCard").innerHTML=`
      <div class="weather-card">
        <div style="font-size:40px;">
          ${Math.round(wData.current_weather.temperature)}°F
        </div>
        <div>${r.name}${r.admin1 ? ", "+r.admin1 : ""}</div>
        <div class="forecast-row">
          ${forecastHTML}
        </div>
      </div>
    `;

  }catch(err){
    console.error("Weather error:",err);
  }
}

/* ================= JOOGLE ================= */

function imFeelingJoogly(){
  const input=document.getElementById("searchInput");
  const randomQueries=[
    "funny cat videos",
    "weather Dallas TX",
    "how to cook steak",
    "best pizza in Phoenix"
  ];
  input.value=randomQueries[Math.floor(Math.random()*randomQueries.length)];
  search();
}

/* ================= EVENTS ================= */

document.getElementById("searchBtn").addEventListener("click",search);
document.getElementById("jooglyBtn").addEventListener("click",imFeelingJoogly);

document.getElementById("searchInput")
  .addEventListener("keydown",e=>{
    if(e.key==="Enter") search();
  });

</script>

</body>
</html>
