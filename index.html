<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  justify-content:center;
  align-items:center;
}

.logo{
  font-size:104px;
  font-weight:500;
  display:flex;
  align-items:baseline;
  margin-bottom:30px;
}

.j{color:#4285F4;}
.g{color:#4285F4;}
.l{color:#34A853;}
.e{color:#EA4335;}

.oo{
  width:120px;
  height:82px;
  margin:0 4px;
  animation:bounce 1.6s ease-in-out infinite;
}

@keyframes bounce {
  0%,100% { transform:translateY(0); }
  40% { transform:translateY(-8px); }
  60% { transform:translateY(0); }
}

.search-box{
  width:560px;
  max-width:90vw;
}

.search-box input{
  width:100%;
  padding:14px 20px;
  border-radius:24px;
  border:1px solid #dcdcdc;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  box-shadow:0 1px 6px rgba(32,33,36,.28);
}

.buttons{
  margin-top:28px;
}

.buttons button{
  background:#f8f9fa;
  border:1px solid #f8f9fa;
  padding:10px 18px;
  margin:0 6px;
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
}

.buttons button:hover{
  border:1px solid #dadce0;
  box-shadow:0 1px 1px rgba(0,0,0,.1);
}

.footer{
  position:absolute;
  bottom:20px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="logo">
  <span class="j">J</span>

  <svg class="oo" viewBox="0 0 120 82">

    <defs>
      <!-- Mask removes overlapping interior stroke only -->
      <mask id="cut">
        <rect width="100%" height="100%" fill="white"/>
        <!-- narrow center cut -->
        <rect x="59" y="0" width="2" height="82" fill="black"/>
      </mask>
    </defs>

    <!-- LEFT O -->
    <circle cx="48" cy="41" r="30"
            fill="white"
            stroke="#EA4335"
            stroke-width="8"
            mask="url(#cut)"/>

    <!-- RIGHT O -->
    <circle cx="72" cy="41" r="30"
            fill="white"
            stroke="#EA4335"
            stroke-width="8"
            mask="url(#cut)"/>

    <!-- Dots -->
    <circle cx="48" cy="41" r="5" fill="#c62828"/>
    <circle cx="72" cy="41" r="5" fill="#c62828"/>

  </svg>

  <span class="g">g</span>
  <span class="l">l</span>
  <span class="e">e</span>
</div>

<div class="search-box">
  <input type="text" placeholder="Search Joogle...">
</div>

<div class="buttons">
  <button>Joogle Search</button>
  <button>I'm Feeling Joogly</button>
</div>

<div class="footer">
  Joogle is a parody project created with love.
</div>

</body>
</html>
