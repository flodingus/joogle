<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Joogle</title>

  <link rel="preconnect" href="https://cse.google.com" />
  <link rel="preconnect" href="https://www.google.com" />

  <style>
    :root{
      --bg:#fff; --text:#202124; --muted:#5f6368; --card:#fff; --border:#dfe1e5;
      --shadow:0 1px 6px rgba(32,33,36,.28);
      --btn:#f8f9fa; --btnText:#3c4043; --btnBorder:#dadce0;
      --hover:rgba(60,64,67,.08);
      --link:#1a0dab; --visited:#681da8;
    }
    body.dark{
      --bg:#202124; --text:#e8eaed; --muted:#9aa0a6; --card:#303134; --border:#5f6368;
      --shadow:0 1px 10px rgba(0,0,0,.6);
      --btn:#303134; --btnText:#e8eaed; --btnBorder:#5f6368;
      --hover:rgba(232,234,237,.08);
      --link:#8ab4f8; --visited:#c58af9;
    }

    *{box-sizing:border-box}
    body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}
    .topbar{height:56px;display:flex;justify-content:flex-end;align-items:center;padding:0 16px}
    .icon-btn{width:38px;height:38px;border-radius:999px;border:0;background:transparent;color:var(--text);cursor:pointer}
    .icon-btn:hover{background:var(--hover)}

    .wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
    .logo{text-align:center;font-size:84px;font-weight:700;letter-spacing:-1px;margin-top:70px;user-select:none}
    .logo span:nth-child(1){color:#4285f4}
    .logo span:nth-child(2){color:#ea4335}
    .logo span:nth-child(3){color:#fbbc05}
    .logo span:nth-child(4){color:#4285f4}
    .logo span:nth-child(5){color:#34a853}
    .logo span:nth-child(6){color:#ea4335}

    .search-area{margin-top:26px;position:relative}
    .searchbar{
      display:flex;align-items:center;gap:10px;width:100%;
      padding:12px 14px;border-radius:999px;border:1px solid var(--border);
      background:var(--card);transition:.15s;
    }
    .searchbar:hover,.searchbar:focus-within{box-shadow:var(--shadow);border-color:transparent}
    input[type="search"]{
      flex:1;border:0;outline:0;font-size:16px;background:transparent;color:var(--text);min-width:0
    }

    #suggestions{
      position:absolute;left:0;right:0;top:54px;
      background:var(--card);border:1px solid var(--border);border-top:none;
      border-radius:0 0 20px 20px;overflow:hidden;box-shadow:var(--shadow);
      z-index:50;display:none;
    }
    .sugg{padding:10px 16px;cursor:pointer}
    .sugg:hover{background:var(--hover)}

    .actions{margin-top:22px;display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
    .btn{padding:10px 16px;border-radius:4px;border:1px solid var(--btnBorder);background:var(--btn);color:var(--btnText);cursor:pointer;font-size:14px}
    .btn:hover{box-shadow:0 1px 1px rgba(0,0,0,.1)}

    #resultsWrap{margin-top:26px}

    /* CSE polish */
    .gsc-search-box{display:none !important;}
    .gsc-control-cse{padding:0 !important;border:0 !important;background:transparent !important}
    .gsc-webResult.gsc-result{
      background:var(--card) !important;border:1px solid var(--border) !important;border-radius:14px !important;
      padding:14px 16px !important;margin-bottom:12px !important;transition:.18s;
    }
    .gsc-webResult.gsc-result:hover{box-shadow:var(--shadow) !important}
    a.gs-title, a.gs-title:link{color:var(--link) !important;text-decoration:none !important}
    a.gs-title:visited{color:var(--visited) !important}
    .gs-snippet{color:var(--text) !important;opacity:.92}
    .gs-visibleUrl{color:var(--muted) !important}

    @media (max-width:480px){
      .logo{font-size:64px;margin-top:48px}
      #suggestions{top:52px}
    }
  </style>
</head>

<body>
  <div class="topbar">
    <button class="icon-btn" id="darkToggle" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
  </div>

  <div class="wrap">
    <div class="logo" aria-label="Joogle">
      <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
    </div>

    <!-- ✅ BULLETPROOF SEARCH: HTML FORM (no JS required) -->
    <form class="search-area" id="searchForm" method="GET" action="/">
      <div class="searchbar">
        <!-- name="q" is what makes /?q=... happen -->
        <input id="q" name="q" type="search" placeholder="Search the web" autocomplete="off" spellcheck="false" />
      </div>

      <div id="suggestions" role="listbox" aria-label="Suggestions"></div>

      <div class="actions">
        <!-- submit guarantees navigation even if JS is broken -->
        <button class="btn" type="submit">Joogle Search</button>
        <!-- lucky is JS-driven -->
        <button class="btn" type="button" id="luckyBtn">I’m Feeling Joogly</button>
      </div>

      <div id="resultsWrap">
        <div id="cse-results"></div>
      </div>
    </form>
  </div>

  <script>
    /************ CONFIG ************/
    const CX = "427c85c8321db4c63";

    const BLOCKED_DOMAINS = [
      "pinterest.","quora.","brainly.","answers.com","chegg.","coursehero.","scribd.com"
    ];

    /************ DARK MODE ************/
    const darkToggle = document.getElementById("darkToggle");
    function setDark(on){
      document.body.classList.toggle("dark", !!on);
      localStorage.setItem("joogle_dark", on ? "1" : "0");
      darkToggle.textContent = on ? "☀️" : "🌙";
    }
    setDark(localStorage.getItem("joogle_dark") === "1");
    darkToggle.addEventListener("click", ()=>setDark(!document.body.classList.contains("dark")));

    /************ HYDRATE INPUT FROM URL ************/
    const q = document.getElementById("q");
    (function hydrate(){
      const params = new URLSearchParams(location.search);
      const initial = params.get("q");
      if(initial) q.value = initial;
    })();

    /************ "I’M FEELING JOOGY" ************/
    document.getElementById("luckyBtn").addEventListener("click", ()=>{
      const query = q.value.trim();
      if(!query){ q.focus(); return; }
      location.href = "https://www.google.com/search?q=" + encodeURIComponent(query) + "&btnI=1";
    });

    /************ SUGGESTIONS ************/
    const suggestions = document.getElementById("suggestions");
    let suggAbort = null;
    let suggTimer = null;

    function closeSuggestions(){ suggestions.style.display="none"; suggestions.innerHTML=""; }
    function openSuggestions(){ if(suggestions.children.length) suggestions.style.display="block"; }

    q.addEventListener("input", ()=>{
      const query = q.value.trim();
      clearTimeout(suggTimer);

      if(!query){ closeSuggestions(); return; }

      suggTimer = setTimeout(async ()=>{
        try{
          if(suggAbort) suggAbort.abort();
          suggAbort = new AbortController();
          const url = "https://suggestqueries.google.com/complete/search?client=firefox&q="+encodeURIComponent(query);
          const res = await fetch(url, { signal: suggAbort.signal });
          const data = await res.json();
          const list = (data && data[1]) ? data[1].slice(0,8) : [];

          suggestions.innerHTML="";
          list.forEach(text=>{
            const div = document.createElement("div");
            div.className="sugg";
            div.textContent=text;
            div.addEventListener("mousedown",(e)=>e.preventDefault());
            div.addEventListener("click", ()=>{
              q.value = text;
              closeSuggestions();
              // Submit the form (guaranteed /?q= navigation)
              document.getElementById("searchForm").requestSubmit();
            });
            suggestions.appendChild(div);
          });
          openSuggestions();
        }catch(e){
          // ignore aborts/errors
        }
      }, 120);
    });

    document.addEventListener("click",(e)=>{
      if(!document.querySelector(".search-area").contains(e.target)) closeSuggestions();
    });

    q.addEventListener("keydown",(e)=>{
      if(e.key === "Escape") closeSuggestions();
    });

    /************ PROGRAMMABLE SEARCH (READS ?q=) ************/
    window.__gcse = {
      callback: function(){
        try{
          google.search.cse.element.render({
            div: "cse-results",
            tag: "searchresults-only",
            attributes: { queryParameterName: "q" }
          });
        }catch(e){}
      }
    };

    (function loadCSE(){
      const s = document.createElement("script");
      s.async = true;
      s.src = "https://cse.google.com/cse.js?cx=" + encodeURIComponent(CX);
      document.head.appendChild(s);
    })();

    /************ SPAM FILTER ************/
    function filterResults(){
      document.querySelectorAll(".gsc-webResult.gsc-result, .gsc-result").forEach(el=>{
        const a = el.querySelector("a");
        if(!a || !a.href) return;
        const href = a.href.toLowerCase();
        if(BLOCKED_DOMAINS.some(d => href.includes(d))) el.style.display="none";
      });
    }
    new MutationObserver(()=>filterResults()).observe(document.documentElement,{childList:true,subtree:true});
  </script>
</body>
</html>
