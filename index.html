<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle Pro</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#ffffff;
  --text:#202124;
  --border:#dadce0;
  --link:#1a0dab;
  --card:#f8f9fa;
}
body.dark{
  --bg:#121212;
  --text:#e8e8e8;
  --border:#333;
  --link:#8ab4f8;
  --card:#1e1e1e;
}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
.header{
  display:flex;
  align-items:center;
  padding:15px 24px;
  border-bottom:1px solid var(--border);
  gap:10px;
}
.logo{
  font-size:26px;
  font-weight:bold;
  cursor:pointer;
}
.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}
.searchInput{
  flex:1;
  padding:10px 18px;
  border-radius:24px;
  border:1px solid var(--border);
  font-size:16px;
  background:var(--bg);
  color:var(--text);
}
.tabs{
  display:flex;
  gap:20px;
  padding:10px 24px;
  border-bottom:1px solid var(--border);
}
.tab{cursor:pointer;}
.tab.active{
  font-weight:bold;
  border-bottom:2px solid var(--link);
}
.results{
  max-width:1000px;
  margin:20px auto;
  padding:0 20px;
  display:flex;
  gap:30px;
}
.main{flex:3;}
.side{flex:1;}
.summaryCard{
  background:var(--card);
  padding:15px;
  border-radius:12px;
  margin-bottom:20px;
}
.resultItem{margin-bottom:20px;}
.resultItem h3{color:var(--link);margin:0;}
.knowledgeCard{
  background:var(--card);
  padding:15px;
  border-radius:12px;
}
.imageGrid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:10px;
}
.imageGrid img{
  width:100%;
  border-radius:8px;
}
.weatherCard{
  background:linear-gradient(135deg,#4facfe,#00f2fe);
  color:white;
  padding:20px;
  border-radius:16px;
}
#map,#radarMap{height:400px;border-radius:12px;}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.reload()">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
  <input id="searchBox" class="searchInput" placeholder="Search Joogle...">
  <button id="voiceBtn">🎙</button>
  <button id="darkToggle">🌙</button>
</div>

<div class="tabs">
  <div class="tab active" data-tab="all">All</div>
  <div class="tab" data-tab="images">Images</div>
  <div class="tab" data-tab="news">News</div>
  <div class="tab" data-tab="maps">Maps</div>
  <div class="tab" data-tab="tools">Tools</div>
</div>

<div class="results">
  <div class="main" id="main"></div>
  <div class="side" id="side"></div>
</div>

<script>
const PROXY_URL="https://joogle-proxy.flodingus.workers.dev";
let currentTab="all";

/* DARK MODE */
document.getElementById("darkToggle").onclick=()=>{
  document.body.classList.toggle("dark");
  localStorage.setItem("darkMode",document.body.classList.contains("dark"));
};
if(localStorage.getItem("darkMode")==="true"){
  document.body.classList.add("dark");
}

/* TABS */
document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    currentTab=tab.dataset.tab;
    performSearch(document.getElementById("searchBox").value);
  };
});

/* VOICE */
document.getElementById("voiceBtn").onclick=()=>{
  const rec=new(window.SpeechRecognition||window.webkitSpeechRecognition)();
  rec.onresult=e=>{
    const text=e.results[0][0].transcript;
    document.getElementById("searchBox").value=text;
    performSearch(text);
  };
  rec.start();
};

/* SEARCH */
async function performSearch(query){
  if(!query) return;

  if(query.startsWith("=")){
    document.getElementById("main").innerHTML="<h2>"+eval(query.substring(1))+"</h2>";
    return;
  }

  if(query.toLowerCase().includes("weather")){
    return showWeather();
  }

  document.getElementById("main").innerHTML="Loading...";
  document.getElementById("side").innerHTML="";

  if(currentTab==="images") return showImages(query);
  if(currentTab==="news") return showNews(query);
  if(currentTab==="maps") return showMap();
  if(currentTab==="tools") return showTools(query);

  const res=await fetch(PROXY_URL,{
    method:"POST",
    headers:{ "Content-Type":"application/json" },
    body:JSON.stringify({q:query})
  });

  const data=await res.json();
  renderAll(query,data);
}

/* ALL TAB */
async function renderAll(query,data){
  let html="";
  if(data.organic){
    html+=`<div class="summaryCard">${data.organic[0].snippet}</div>`;
    data.organic.forEach(r=>{
      html+=`<div class="resultItem">
        <a href="${r.link}" target="_blank">
        <h3>${r.title}</h3></a>
        <p>${r.snippet}</p>
      </div>`;
    });
  }
  document.getElementById("main").innerHTML=html;
  loadKnowledge(query);
}

/* KNOWLEDGE PANEL */
async function loadKnowledge(query){
  const wiki=await fetch(
    `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`
  );
  if(wiki.ok){
    const data=await wiki.json();
    document.getElementById("side").innerHTML=
      `<div class="knowledgeCard">
        <h3>${data.title}</h3>
        <p>${data.extract||""}</p>
      </div>`;
  }
}

/* IMAGES */
function showImages(query){
  let html="<div class='imageGrid'>";
  for(let i=0;i<12;i++){
    html+=`<img src="https://source.unsplash.com/300x300/?${query}&sig=${i}">`;
  }
  html+="</div>";
  document.getElementById("main").innerHTML=html;
}

/* NEWS */
async function showNews(query){
  const rss=`https://api.rss2json.com/v1/api.json?rss_url=https://news.google.com/rss/search?q=${encodeURIComponent(query)}`;
  const res=await fetch(rss);
  const data=await res.json();
  let html="";
  data.items.slice(0,10).forEach(n=>{
    html+=`<div class="resultItem">
      <a href="${n.link}" target="_blank">
      <h3>${n.title}</h3></a>
    </div>`;
  });
  document.getElementById("main").innerHTML=html;
}

/* MAP */
function showMap(){
  document.getElementById("main").innerHTML="<div id='map'></div>";
  navigator.geolocation.getCurrentPosition(pos=>{
    const {latitude,longitude}=pos.coords;
    const map=L.map('map').setView([latitude,longitude],10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.marker([latitude,longitude]).addTo(map);
  });
}

/* TOOLS */
function showTools(query){
  document.getElementById("main").innerHTML=
    `<div class="summaryCard">Tools result for: ${query}</div>`;
}

/* ELITE WEATHER */
async function showWeather(){

  navigator.geolocation.getCurrentPosition(async pos=>{

    const {latitude,longitude}=pos.coords;

    const geoRes=await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latitude}&lon=${longitude}`
    );
    const geoData=await geoRes.json();
    const city=geoData.address.city||
               geoData.address.town||
               geoData.address.village||
               "Your Location";

    const res=await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}
      &current_weather=true
      &hourly=temperature_2m,relativehumidity_2m,apparent_temperature,precipitation_probability,uv_index
      &daily=temperature_2m_max,temperature_2m_min,sunrise,sunset
      &temperature_unit=fahrenheit
      &windspeed_unit=mph
      &timezone=auto`
    );

    const data=await res.json();
    const current=data.current_weather;

    document.getElementById("main").innerHTML=
      `<div class="weatherCard">
        <h2>${city}</h2>
        <h1 style="font-size:60px;margin:0;">
          ${current.temperature}°F
        </h1>
        <div>Wind ${current.windspeed} mph</div>
        <canvas id="weatherChart" style="margin-top:20px;"></canvas>
        <div id="radarMap" style="margin-top:20px;"></div>
      </div>`;

    new Chart(document.getElementById("weatherChart"),{
      type:"line",
      data:{
        labels:data.hourly.time.slice(0,12).map(t=>t.slice(11,16)),
        datasets:[{
          label:"Temp °F",
          data:data.hourly.temperature_2m.slice(0,12)
        }]
      }
    });

    const map=L.map('radarMap').setView([latitude,longitude],6);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
    L.tileLayer(
      'https://tile.openweathermap.org/map/precipitation_new/{z}/{x}/{y}.png?appid=439d4b804bc8187953eb36d2a8c26a02',
      {opacity:0.6}
    ).addTo(map);

  });
}

document.getElementById("searchBox")
.addEventListener("keydown",e=>{
  if(e.key==="Enter"){
    performSearch(e.target.value);
  }
});
</script>

</body>
</html>
