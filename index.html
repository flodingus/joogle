<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#202124;
}

.header{
  display:flex;
  align-items:center;
  gap:20px;
  padding:15px 20px;
  border-bottom:1px solid #dadce0;
}

.logo{
  font-size:28px;
  font-weight:bold;
  cursor:pointer;
}

.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.search{
  flex:1;
  max-width:600px;
  padding:10px 20px;
  font-size:15px;
  border:1px solid #dadce0;
  border-radius:999px;
  outline:none;
}

.center{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:70vh;
}

.homeLogo{
  font-size:80px;
  font-weight:bold;
  margin-bottom:20px;
}

.homeLogo span:nth-child(1){color:#4285F4}
.homeLogo span:nth-child(2){color:#DB4437}
.homeLogo span:nth-child(3){color:#F4B400}
.homeLogo span:nth-child(4){color:#4285F4}
.homeLogo span:nth-child(5){color:#0F9D58}
.homeLogo span:nth-child(6){color:#DB4437}

#results{
  padding:20px;
}
</style>
</head>

<body>

<div class="header" id="header" style="display:none;">
  <div class="logo" onclick="goHome()">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
  <input id="topSearch" class="search" placeholder="Search Joogle...">
</div>

<div class="center" id="home">
  <div class="homeLogo">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
  <input id="homeSearch" class="search" placeholder="Search Joogle...">
</div>

<div id="results"></div>

<script async src="https://cse.google.com/cse.js?cx=427c85c8321db4c63"></script>

<script>
function goHome(){
  document.getElementById("results").innerHTML="";
  document.getElementById("home").style.display="flex";
  document.getElementById("header").style.display="none";
}

function showResults(query){
  document.getElementById("home").style.display="none";
  document.getElementById("header").style.display="flex";
  document.getElementById("results").innerHTML = `
    <div class="gcse-searchresults-only"></div>
  `;
  document.getElementById("topSearch").value = query;

  setTimeout(()=>{
    if(window.google && google.search && google.search.cse){
      google.search.cse.element.getElement("searchresults-only0").execute(query);
    }
  },500);
}

document.getElementById("homeSearch").addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    showResults(this.value);
  }
});

document.getElementById("topSearch").addEventListener("keydown",function(e){
  if(e.key==="Enter"){
    showResults(this.value);
  }
});
</script>

</body>
</html>
