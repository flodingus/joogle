<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Joogle</title>

<link rel="icon" href="data:image/svg+xml,
<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
<text y='.9em' font-size='90'>💙</text>
</svg>">

<style>
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#ffffff;
  color:#202124;
  transition:.4s;
  overflow-x:hidden;
}

.header{
  padding:15px 24px;
  border-bottom:1px solid #dadce0;
}

.logo{
  font-size:26px;
  font-weight:bold;
  letter-spacing:-2px;
  cursor:pointer;
}

.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.hero{
  height:65vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.heroLogo{
  font-size:90px;
  font-weight:bold;
  letter-spacing:-6px;
}

.bounce{
  display:inline-block;
  animation:bounce 2.4s infinite cubic-bezier(.28,.84,.42,1);
}

@keyframes bounce{
  0%,100%{transform:translateY(0)}
  30%{transform:translateY(-8px) scale(1.05,.95)}
  50%{transform:translateY(0) scale(.95,1.05)}
}

.searchArea{
  margin-top:25px;
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  justify-content:center;
}

.searchInput{
  width:420px;
  max-width:90vw;
  padding:12px 18px;
  border-radius:24px;
  border:1px solid #dadce0;
  font-size:16px;
}

.button{
  padding:10px 16px;
  border-radius:20px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  cursor:pointer;
}

.results{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

.weatherCard{
  max-width:600px;
  margin:auto;
  padding:30px;
  border-radius:20px;
  background:#f8f9fa;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}

.loveContainer{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  background:linear-gradient(135deg,#ffdde1,#ee9ca7);
  animation:fadeIn 1s ease;
}

@keyframes fadeIn{
  from{opacity:0;transform:scale(.98)}
  to{opacity:1;transform:scale(1)}
}

.loveMessage{
  font-size:52px;
  font-weight:bold;
  color:white;
  text-shadow:0 0 25px white;
}

.loveNote{
  margin-top:20px;
  font-size:22px;
  color:white;
}

.signature{
  margin-top:25px;
  color:white;
  opacity:.8;
}

.heart{
  position:absolute;
  bottom:-50px;
  font-size:22px;
  animation:floatUp 6s linear infinite;
}

@keyframes floatUp{
  0%{transform:translateY(0);opacity:1}
  100%{transform:translateY(-110vh);opacity:0}
}

footer{
  text-align:center;
  font-size:12px;
  color:gray;
  padding:30px;
  opacity:.6;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.reload()">
    <span>J</span><span>o</span><span class="bounce">o</span><span class="bounce">g</span><span>l</span><span>e</span>
  </div>
</div>

<div id="hero" class="hero">
  <div class="heroLogo">
    <span style="color:#4285F4">J</span>
    <span style="color:#DB4437" class="bounce">o</span>
    <span style="color:#F4B400" class="bounce">o</span>
    <span style="color:#4285F4">g</span>
    <span style="color:#0F9D58">l</span>
    <span style="color:#DB4437">e</span>
  </div>

  <form id="searchForm" class="searchArea">
    <input id="searchBox" class="searchInput" placeholder="Search Joogle..." />
    <button class="button" type="submit">Search</button>
    <button class="button" type="button" onclick="feelingJoogly()">I'm Feeling Joogly</button>
  </form>
</div>

<div id="main" class="results"></div>

<footer>
Joogle is a private parody made with love and is not affiliated with Google LLC.
</footer>

<script>
const PROXY_URL="https://joogle-proxy.flodingus.workers.dev";
let julieAudio=null;
let heartInterval=null;

const loveNotes=[
"You're my favorite search result.",
"You make every day better.",
"My favorite thing to Joogle.",
"I’d search the whole internet for you.",
"Always you. 💙",
"Forever your Joogle."
];

document.getElementById("searchForm").addEventListener("submit",e=>{
  e.preventDefault();
  performSearch(searchBox.value.trim());
});

function feelingJoogly(){
  const val=searchBox.value.trim();
  if(val) window.open("https://www.google.com/search?q="+encodeURIComponent(val));
}

function spawnHeart(){
  const heart=document.createElement("div");
  heart.className="heart";
  heart.style.left=Math.random()*100+"vw";
  heart.innerHTML="💙";
  document.body.appendChild(heart);
  setTimeout(()=>heart.remove(),8000);
}

function startJulieMusic(){
  if(julieAudio) return;
  julieAudio=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8b63c9b2a.mp3?filename=romantic-piano-110624.mp3");
  julieAudio.loop=true;
  julieAudio.volume=0;
  julieAudio.play().then(()=>{
    let fade=setInterval(()=>{
      if(julieAudio.volume<0.7){julieAudio.volume+=0.05}
      else clearInterval(fade)
    },200);
  }).catch(()=>{
    document.body.addEventListener("click",()=>julieAudio.play(),{once:true});
  });
}

async function performSearch(query){
  if(!query) return;
  const q=query.toLowerCase();

  if(q.includes("julie")){
    hero.style.display="none";
    main.innerHTML=`
      <div class="loveContainer">
        <div class="loveMessage">💙 Julie 💙</div>
        <div class="loveNote">${loveNotes[Math.floor(Math.random()*loveNotes.length)]}</div>
        <div class="signature">— Always Yours</div>
      </div>
    `;
    if(!heartInterval){
      heartInterval=setInterval(spawnHeart,400);
    }
    startJulieMusic();
    return;
  }

  if(q.includes("weather")||q.includes("forecast")){
    handleWeather(query);
    return;
  }

  hero.style.display="none";
  main.innerHTML="Loading...";

  try{
    const res=await fetch(PROXY_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({q:query})
    });
    const data=await res.json();
    if(!data.organic){main.innerHTML="No results.";return;}
    main.innerHTML=data.organic.map(r=>`
      <div style="margin-bottom:24px">
        <a href="${r.link}" target="_blank"><h3>${r.title}</h3></a>
        <p>${r.snippet}</p>
      </div>`).join("");
  }catch{
    main.innerHTML="Search failed.";
  }
}

async function handleWeather(query){
  hero.style.display="none";
  main.innerHTML="<div class='weatherCard'>Loading weather...</div>";

  try{
    let lat,lon,label;
    const cleaned=query.toLowerCase().replace("weather","").replace("forecast","").trim();

    if(cleaned){
      const geo=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(cleaned)}&count=1`);
      const g=await geo.json();
      if(!g.results) throw "No city";
      lat=g.results[0].latitude;
      lon=g.results[0].longitude;
      label=g.results[0].name+", "+g.results[0].country;
    }else{
      await new Promise((resolve,reject)=>{
        navigator.geolocation.getCurrentPosition(pos=>{
          lat=pos.coords.latitude;
          lon=pos.coords.longitude;
          resolve();
        },reject);
      });
      const rev=await fetch(`https://geocoding-api.open-meteo.com/v1/reverse?latitude=${lat}&longitude=${lon}&count=1`);
      const r=await rev.json();
      label=r.results[0].name+", "+r.results[0].country;
    }

    const weather=await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&temperature_unit=fahrenheit&timezone=auto`
    );
    const w=await weather.json();

    main.innerHTML=`
      <div class="weatherCard">
        <h2>${label}</h2>
        <div style="font-size:48px;font-weight:bold">
          ${Math.round(w.current_weather.temperature)}°F
        </div>
        <p>Wind ${w.current_weather.windspeed} mph</p>
      </div>
    `;

  }catch{
    main.innerHTML="<div class='weatherCard'>Weather unavailable.</div>";
  }
}
</script>

</body>
</html>
