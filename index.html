<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Joogle</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
body{margin:0;font-family:Arial;background:#fff;color:#202124}
.header{
  border-bottom:1px solid #dadce0;
  padding:12px 20px;
  display:flex;
  align-items:center;
  gap:20px;
}
.logo{
  font-size:24px;
  font-weight:bold;
  cursor:pointer;
}
.logo span:nth-child(1){color:#4285F4}
.logo span:nth-child(2){color:#DB4437}
.logo span:nth-child(3){color:#F4B400}
.logo span:nth-child(4){color:#4285F4}
.logo span:nth-child(5){color:#0F9D58}
.logo span:nth-child(6){color:#DB4437}

.search{
  flex:1;
  max-width:600px;
  padding:10px 20px;
  border-radius:999px;
  border:1px solid #dadce0;
  font-size:15px;
}

.container{
  display:flex;
  gap:20px;
  padding:20px;
}

.results{
  flex:1;
  max-width:700px;
}

.card{
  padding:14px 0;
  border-bottom:1px solid #eee;
}

.card b{
  font-size:16px;
  color:#1a0dab;
}

.meta{
  font-size:13px;
  color:#5f6368;
}

#map{
  width:400px;
  height:500px;
  border-radius:12px;
}

@media(max-width:1000px){
  .container{flex-direction:column}
  #map{width:100%;height:300px}
}
</style>
</head>

<body>

<div class="header">
  <div class="logo" onclick="location.reload()">
    <span>J</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span>
  </div>
  <input id="searchInput" class="search" placeholder="Search Joogle...">
</div>

<div class="container">
  <div class="results" id="results"></div>
  <div id="map"></div>
</div>

<script>
const API="https://api.joogle.pro";
const input=document.getElementById("searchInput");
const resultsDiv=document.getElementById("results");

let userLat=null;
let userLon=null;
let map=L.map("map").setView([32.84402,-97.14307],13);
L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(map);

function haversine(a,b,c,d){
 const R=3958.8;
 const toRad=x=>x*Math.PI/180;
 const dLat=toRad(c-a), dLon=toRad(d-b);
 const x=Math.sin(dLat/2)**2+Math.cos(toRad(a))*Math.cos(toRad(c))*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}

async function fetchJSON(url){
 const r=await fetch(url);
 return r.json();
}

async function runSearch(query){
 if(!query) return;

 resultsDiv.innerHTML="Searching...";

 if(!userLat||!userLon){
   const geo=await fetchJSON(API+"/geo");
   userLat=geo.geo.latitude;
   userLon=geo.geo.longitude;
   map.setView([userLat,userLon],13);
 }

 const data=await fetchJSON(
   API+`/places?query=${encodeURIComponent(query)}&lat=${userLat}&lon=${userLon}`
 );

 if(!data.items||data.items.length===0){
   resultsDiv.innerHTML="No results found.";
   return;
 }

 map.eachLayer(layer=>{
   if(layer instanceof L.Marker) map.removeLayer(layer);
 });

 let html="";
 data.items.sort((a,b)=>{
   return haversine(userLat,userLon,a.lat,a.lon) -
          haversine(userLat,userLon,b.lat,b.lon);
 });

 data.items.forEach(p=>{
   const dist=haversine(userLat,userLon,p.lat,p.lon).toFixed(1);
   html+=`
     <div class="card">
       <b>${p.name||"Business"}</b><br>
       <span class="meta">${p.type||""}</span><br>
       <span class="meta">${p.address?.street||""} ${p.address?.city||""}</span><br>
       <span class="meta">${dist} mi away</span>
     </div>
   `;

   if(p.lat&&p.lon)
     L.marker([p.lat,p.lon]).addTo(map);
 });

 resultsDiv.innerHTML=html;
}

input.addEventListener("keydown",e=>{
 if(e.key==="Enter") runSearch(input.value);
});
</script>

</body>
</html>
