<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:flex;
  align-items:center;
  letter-spacing:-3px;
  margin-bottom:30px;
}

/* TRUE MATCH */
.eye-svg{
  width:1em;
  height:1em;
  display:inline-block;
  vertical-align:middle;
}

.bounce{ animation:bounce 0.45s ease; }

@keyframes bounce{
  0%{transform:translateY(0);}
  50%{transform:translateY(-14px);}
  100%{transform:translateY(0);}
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{ margin-top:25px; }

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}
button:hover{ background:#f1f3f4; }

.feature-card{
  width:90%;
  max-width:900px;
  margin-top:30px;
}

.results{
  margin-top:30px;
  width:90%;
  max-width:800px;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">
  <div class="joogle-logo" id="logo"></div>
  <input class="search-box" id="searchInput" placeholder="Search Joogle..." />
  <div class="buttons">
    <button onclick="search()">Joogle Search</button>
    <button onclick="imFeelingJoogly()">I'm Feeling Joogly</button>
  </div>
  <div class="feature-card" id="featureCard"></div>
  <div class="results" id="results"></div>
</div>

<div class="footer">
Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<script>
const WORKER_URL="https://joogle-proxy.flodingus.workers.dev/";

/* LOGO */

function initLogo(){
const logo=document.getElementById("logo");

logo.innerHTML=`
<span style="color:#4285F4;">J</span>
<span class="o1" style="color:#EA4335;">o</span>

<svg class="eye-svg" viewBox="0 0 60 60">
  <circle cx="30" cy="30" r="18" fill="white" stroke="#EA4335" stroke-width="4"/>
  <circle class="pupil" cx="30" cy="30" r="6" fill="black"/>
  <circle cx="33" cy="27" r="2" fill="white"/>

  <path d="M18 14 Q22 6 26 14" stroke="black" stroke-width="2" fill="none"/>
  <path d="M26 12 Q30 4 34 12" stroke="black" stroke-width="2" fill="none"/>
  <path d="M34 14 Q38 6 42 14" stroke="black" stroke-width="2" fill="none"/>

  <ellipse class="lid" cx="30" cy="30" rx="22" ry="0" fill="#EA4335" opacity="0"/>
</svg>

<span style="color:#4285F4;">g</span>
<span style="color:#34A853;">l</span>
<span style="color:#EA4335;">e</span>
`;

animateLogo();
}

function animateLogo(){
const o1=document.querySelector(".o1");
const eye=document.querySelector(".eye-svg");
const pupil=document.querySelector(".pupil");
const lid=document.querySelector(".lid");

function loop(){
o1.classList.add("bounce");
eye.classList.add("bounce");

setTimeout(()=>{
o1.classList.remove("bounce");
eye.classList.remove("bounce");

setTimeout(()=>{
lid.style.transition="all .3s ease";
lid.setAttribute("ry","22");
lid.style.opacity="1";
pupil.style.transform="scale(0.7)";

setTimeout(()=>{
lid.setAttribute("ry","0");
lid.style.opacity="0";
pupil.style.transform="scale(1)";
},1200);

},300);

},500);
}

setInterval(loop,3200);
}

/* SEARCH (unchanged logic) */

async function search(){
const q=document.getElementById("searchInput").value.trim();
if(!q) return;
document.getElementById("featureCard").innerHTML="";
document.getElementById("results").innerHTML="";
}

function imFeelingJoogly(){
if(Math.random()<0.20){
alert("Julie Mode Activated 💕");
}else{
search();
}
}

document.getElementById("searchInput").addEventListener("keydown",e=>{
if(e.key==="Enter") search();
});

initLogo();
</script>
</body>
</html>
