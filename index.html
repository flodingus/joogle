<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.main{
  margin-top:18vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

.joogle-logo{
  font-size:64px;
  font-weight:500;
  display:inline-flex;
  align-items:baseline; /* KEY FIX */
  letter-spacing:-3px;
  margin-bottom:30px;
}

.eye-svg{
  width:0.74em;
  height:0.74em;
}

.bounce{ animation:bounce 0.45s ease; }

@keyframes bounce{
  0%{transform:translateY(0);}
  50%{transform:translateY(-14px);}
  100%{transform:translateY(0);}
}

.search-box{
  width:90%;
  max-width:580px;
  padding:14px 20px;
  border-radius:30px;
  border:1px solid #dadce0;
  font-size:16px;
  outline:none;
}

.buttons{ margin-top:25px; }

button{
  margin:5px;
  padding:10px 18px;
  border:1px solid #dadce0;
  background:#f8f9fa;
  border-radius:4px;
  cursor:pointer;
}
button:hover{ background:#f1f3f4; }

.footer{
  margin-top:auto;
  padding:20px;
  font-size:12px;
  color:#70757a;
  text-align:center;
}
</style>
</head>

<body>

<div class="main">
  <div class="joogle-logo" id="logo"></div>

  <input class="search-box" placeholder="Search Joogle..." />

  <div class="buttons">
    <button>Joogle Search</button>
    <button>I'm Feeling Joogly</button>
  </div>
</div>

<div class="footer">
Joogle is a parody project created with love. Not affiliated with Google LLC.
</div>

<script>
function initLogo(){
const logo=document.getElementById("logo");

logo.innerHTML=`
<span style="color:#4285F4;">J</span>
<span style="color:#EA4335;">o</span>

<svg class="eye-svg" viewBox="0 0 60 60">
  <!-- Circle geometry tuned -->
  <circle cx="30" cy="34" r="15" fill="white" stroke="#EA4335" stroke-width="4"/>
  <circle cx="30" cy="34" r="5" fill="black"/>
  <circle cx="32" cy="31" r="2" fill="white"/>

  <!-- 5 lashes -->
  <path d="M18 20 Q22 8 26 20" stroke="black" stroke-width="2" fill="none"/>
  <path d="M23 16 Q27 6 31 16" stroke="black" stroke-width="2" fill="none"/>
  <path d="M28 14 Q30 4 32 14" stroke="black" stroke-width="2" fill="none"/>
  <path d="M33 16 Q37 6 41 16" stroke="black" stroke-width="2" fill="none"/>
  <path d="M38 20 Q42 8 46 20" stroke="black" stroke-width="2" fill="none"/>

  <ellipse cx="30" cy="34" rx="17" ry="0" fill="#EA4335" opacity="0"/>
</svg>

<span style="color:#4285F4;">g</span>
<span style="color:#34A853;">l</span>
<span style="color:#EA4335;">e</span>
`;
}

initLogo();
</script>

</body>
</html>
