<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
}

.logo{
  font-size:104px;
  font-weight:500;
  display:flex;
  align-items:baseline;
  margin-top:120px;
  margin-bottom:30px;
}

.j{color:#4285F4;}
.g{color:#4285F4;}
.l{color:#34A853;}
.e{color:#EA4335;}

/* LOCKED LOGO */
.oo-wrapper{
  display:flex;
  margin:0 6px;
  animation:bounce 1.6s ease-in-out infinite;
}

.o{
  width:54px;
  height:54px;
  border:8px solid #EA4335;
  border-radius:50%;
  background:white;
  position:relative;
  margin:0 -10px;
  transform:scaleX(0.88);
}

.o::after{
  content:"";
  width:9px;
  height:9px;
  background:#c62828;
  border-radius:50%;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}

@keyframes bounce {
  0%,100% { transform:translateY(0); }
  40% { transform:translateY(-8px); }
  60% { transform:translateY(0); }
}

.search-box{
  width:560px;
  max-width:90vw;
}

.search-box input{
  width:100%;
  padding:14px 20px;
  border-radius:24px;
  border:1px solid #dcdcdc;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  box-shadow:0 1px 6px rgba(32,33,36,.28);
}

.buttons{
  margin-top:28px;
}

.buttons button{
  background:#f8f9fa;
  border:1px solid #f8f9fa;
  padding:10px 18px;
  margin:0 6px;
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
}

.buttons button:hover{
  border:1px solid #dadce0;
  box-shadow:0 1px 1px rgba(0,0,0,.1);
}

.weather-card{
  width:600px;
  max-width:92vw;
  margin-top:40px;
  border:1px solid #dadce0;
  border-radius:12px;
  padding:24px;
  display:none;
  box-shadow:0 1px 6px rgba(0,0,0,.08);
}

.weather-header{
  font-size:22px;
  font-weight:500;
}

.weather-current{
  font-size:48px;
  font-weight:500;
  margin:10px 0;
}

.weather-condition{
  color:#5f6368;
  margin-bottom:20px;
}

.forecast{
  display:flex;
  justify-content:space-between;
}

.day{
  text-align:center;
  font-size:14px;
}

.footer{
  margin-top:auto;
  padding:20px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="logo">
  <span class="j">J</span>
  <div class="oo-wrapper">
    <div class="o"></div>
    <div class="o"></div>
  </div>
  <span class="g">g</span>
  <span class="l">l</span>
  <span class="e">e</span>
</div>

<div class="search-box">
  <input id="searchInput" type="text" placeholder="Search Joogle...">
</div>

<div class="buttons">
  <button onclick="performSearch()">Joogle Search</button>
  <button>I'm Feeling Joogly</button>
</div>

<div class="weather-card" id="weatherCard">
  <div class="weather-header" id="weatherLocation"></div>
  <div class="weather-current" id="weatherTemp"></div>
  <div class="weather-condition" id="weatherCondition"></div>
  <div class="forecast" id="forecast"></div>
</div>

<div class="footer">
  Joogle is a parody project created with love.
</div>

<script>

// ENTER KEY SUPPORT
document.getElementById("searchInput")
.addEventListener("keydown", function(e){
  if(e.key === "Enter"){
    performSearch();
  }
});

async function performSearch(){
  const rawQuery = document.getElementById("searchInput").value.trim();
  const query = rawQuery.toLowerCase();

  // WEATHER DETECTION
  if(query.includes("weather")){
    const location = rawQuery
      .replace(/weather/gi,"")
      .replace(/in/gi,"")
      .trim();

    showWeather(location);
  } else {
    window.location.href = "https://www.google.com/search?q=" + encodeURIComponent(rawQuery);
  }
}

async function showWeather(city){

  if(!city){
    alert("Please enter a city.");
    return;
  }

  const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1`);
  const geoData = await geoRes.json();

  if(!geoData.results){
    alert("City not found.");
    return;
  }

  const {latitude, longitude, name, admin1} = geoData.results[0];

  const weatherRes = await fetch(
    `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&current_weather=true&daily=temperature_2m_max,temperature_2m_min&temperature_unit=fahrenheit&timezone=auto`
  );

  const weatherData = await weatherRes.json();

  document.getElementById("weatherLocation").innerText =
    name + (admin1 ? ", " + admin1 : "");

  document.getElementById("weatherTemp").innerText =
    weatherData.current_weather.temperature + "°F";

  document.getElementById("weatherCondition").innerText =
    "Wind " + weatherData.current_weather.windspeed + " mph";

  const forecastEl = document.getElementById("forecast");
  forecastEl.innerHTML = "";

  weatherData.daily.time.slice(0,5).forEach((day,i)=>{
    forecastEl.innerHTML += `
      <div class="day">
        <div>${new Date(day).toLocaleDateString(undefined,{weekday:'short'})}</div>
        <div>${Math.round(weatherData.daily.temperature_2m_max[i])}° /
        ${Math.round(weatherData.daily.temperature_2m_min[i])}°</div>
      </div>
    `;
  });

  document.getElementById("weatherCard").style.display = "block";
}

</script>

</body>
</html>
