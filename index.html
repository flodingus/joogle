<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Joogle</title>

<style>
body{
  margin:0;
  font-family:Arial, Helvetica, sans-serif;
  background:#fff;
  display:flex;
  flex-direction:column;
  min-height:100vh;
  justify-content:center;
  align-items:center;
}

/* LOGO */
.logo{
  font-size:104px;
  font-weight:500;
  display:flex;
  align-items:baseline;
  margin-bottom:30px;
}

.j{color:#4285F4;}
.g{color:#4285F4;}
.l{color:#34A853;}
.e{color:#EA4335;}

/* SVG OO block */
.o-svg{
  width:140px;
  height:110px;
  margin:0 6px;
  display:inline-block;
  animation:bounce 1.6s ease-in-out infinite;
}

/* Bounce (same feel as mockup) */
@keyframes bounce {
  0%,100% { transform:translateY(0); }
  40% { transform:translateY(-10px); }
  60% { transform:translateY(0); }
}

/* SEARCH */
.search-box{
  width:560px;
  max-width:90vw;
}

.search-box input{
  width:100%;
  padding:14px 20px;
  border-radius:24px;
  border:1px solid #dcdcdc;
  font-size:16px;
  outline:none;
}

.search-box input:focus{
  box-shadow:0 1px 6px rgba(32,33,36,.28);
}

/* BUTTONS */
.buttons{
  margin-top:28px;
}

.buttons button{
  background:#f8f9fa;
  border:1px solid #f8f9fa;
  padding:10px 18px;
  margin:0 6px;
  border-radius:4px;
  cursor:pointer;
  font-size:14px;
}

.buttons button:hover{
  border:1px solid #dadce0;
  box-shadow:0 1px 1px rgba(0,0,0,.1);
}

/* FOOTER */
.footer{
  position:absolute;
  bottom:20px;
  font-size:13px;
  color:#777;
}
</style>
</head>

<body>

<div class="logo">
  <span class="j">J</span>

  <!-- Perfect geometric OO -->
  <svg class="o-svg" viewBox="0 0 140 110">

    <!-- Left O -->
    <circle cx="50" cy="55" r="42"
            fill="none"
            stroke="#EA4335"
            stroke-width="10"/>
    <circle cx="50" cy="55" r="6" fill="#EA4335"/>

    <!-- Right O (slightly pressed, no crossing) -->
    <circle cx="88" cy="55" r="42"
            fill="none"
            stroke="#EA4335"
            stroke-width="10"/>
    <circle cx="88" cy="55" r="6" fill="#EA4335"/>

  </svg>

  <span class="g">g</span>
  <span class="l">l</span>
  <span class="e">e</span>
</div>

<div class="search-box">
  <input type="text" placeholder="Search Joogle...">
</div>

<div class="buttons">
  <button>Joogle Search</button>
  <button>I'm Feeling Joogly</button>
</div>

<div class="footer">
  Joogle is a parody project created with love.
</div>

</body>
</html>
